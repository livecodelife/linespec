service:
  name: scheduled-worker
  service_dir: ..
  type: worker
  framework: custom
  port: 8080
  health_endpoint: /health
  docker_compose: ../docker-compose.yml
  build_context: ..
  start_command: ./scheduled-worker
  environment:
    DATABASE_URL: postgres://worker_user:worker_password@db:5432/worker_db?sslmode=disable
    USERS_API_URL: http://users-api:8080
    WEBHOOK_URL: http://webhook-service:8080
    SYNC_INTERVAL_SECONDS: "2"

database:
  type: postgresql
  image: postgres:16-alpine
  port: 5432
  container: db
  init_script: ../init.sql
  database: worker_db
  username: worker_user
  password: worker_password

job_backend:
  type: scheduled

infrastructure:
  database: true

dependencies:
  - name: users-api
    type: http
    host: users-api
    port: 8080
    proxy: true
  - name: webhook-service
    type: http
    host: webhook-service
    port: 8080
    proxy: true
