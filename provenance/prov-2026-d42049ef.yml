id: prov-2026-d42049ef
title: Annotate remote-owned nodes in graph output
status: implemented
created_at: "2026-04-24"
author: calebcowen@gmail.com
intent: >
  Graph output gives no visual indication that a node originates from a shared
  repo rather than the local provenance directory. A Brief resolved from a
  remote cache looks identical to a local Brief, making the cross-repo boundary
  invisible. Add a [remote] annotation to the text graph and a remote boolean
  field to the JSON graph so users can see at a glance which nodes are
  remote-owned.
constraints:
  - Text graph annotation is a plain "[remote]" suffix on the title, no colour needed
  - JSON graph adds a "remote" boolean field (omitted when false)
  - Determination uses the same path-separator-aware check as isRemoteRecord
  - No DOT output exists; the review mention of outputDotGraph was speculative
  - No change to graph structure or traversal logic
affected_scope:
