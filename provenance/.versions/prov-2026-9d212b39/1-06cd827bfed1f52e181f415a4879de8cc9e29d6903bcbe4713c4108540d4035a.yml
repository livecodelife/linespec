content:
  id: prov-2026-9d212b39
  title: Add per-record progress logging to --enrich phase
  type: imprint
  created_at: "2026-06-12"
  author: calebcowen@gmail.com
  intent: |
    Adds a Progress func(string) field to enrich.Input. EnrichWithBaseURL calls it
    at each stage: collecting git history, calling LLM, and on completion (intent
    written, skipped, or error). runDiscoverEnrich wires it up to print per-record
    lines to stdout so the user can see activity during long enrichment runs.
  affected_scope:
    - pkg/discover/enrich/enrich.go
    - pkg/discover/enrich/enrich_test.go
    - cmd/linespec/main_stable.go
  implements: prov-2026-a18e2104
