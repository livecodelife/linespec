reason: |-
  Two leftovers from prov-2026-a3105d31. First, the legacy FindMock path now applies VERIFY_* to Mongo expectations, but the Mongo interceptor passes only a command name, so legacyVerifyHolds calls the constraint check with no WHERE columns, WHERE values or written values. VERIFY_OPERATION and ACCESSING_TABLES work on Mongo; VERIFY_WHERE_COLUMNS, VERIFY_WHERE and VERIFY_WRITTEN_VALUES cannot hold, so a spec using them fails at run time with a message about the statement not matching, which does not say the clause is unsupported.
  Fix: the parser rejects those three clauses on READ:MONGODB and WRITE:MONGODB with an error naming the clause and saying Mongo has no WHERE analysis, the same approach the parser already takes for RETURNS on Oracle and for NO TRANSACTION. Rejected: implementing WHERE analysis for Mongo filters, which is a feature and a separate decision.
  Second, the parser now rejects NO TRANSACTION, so ExpectStatement.NoTransaction is never set and nothing outside one test reads it. Remove the field. That test (TestLegacyFindMockEnforcesVerify_NoTransactionNotInert) reads the field after a parse that is allowed to succeed, so it must be updated to assert the parse error instead.
reason_kind: fix
