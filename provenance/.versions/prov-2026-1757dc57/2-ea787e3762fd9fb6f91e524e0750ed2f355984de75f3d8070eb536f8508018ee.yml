id: prov-2026-1757dc57
version: 2
content_hash: sha256:ea787e3762fd9fb6f91e524e0750ed2f355984de75f3d8070eb536f8508018ee
parent_hash: sha256:c119ee735927ea52bff7048309a01e9ec2c744c6083c32d6fd9ed7b391924ca2
reason: |-
  strict_passthrough has no effect on PostgreSQL. The redis, grpc, http, kafka, mongodb and mysql proxies call registry.RecordPassthrough when traffic bypasses the mock layer, and the runner fails the spec under strict_passthrough: true. The PostgreSQL proxy never calls it, so an undeclared SELECT count(*) FROM sponsors reached the real database and the spec passed. Writes-are-strict, undeclared-queries-fail is not enforced.

  Decision: record a passthrough in the PostgreSQL proxy at the point a statement is resolved against the mocks and found to have none. For the simple protocol that is MsgQuery when findMock fails. For the extended protocol it is MsgBind, after bind parameters are decoded and findMock(query, bindParams) fails. Never at Parse: Parse is forwarded upstream whenever peekMock(query, nil) cannot match, which includes a value-level VERIFY mock that only matches once parameters exist, and that is not an undeclared query. Bind resolves with parameters, so those cases stay unrecorded, and one Bind yields at most one record. Parse/Describe with no Bind executes nothing and records nothing.

  Housekeeping is exempt, mirroring mysql's isWhitelisted: SET, SHOW, BEGIN, START TRANSACTION, COMMIT, ROLLBACK, SAVEPOINT, RELEASE, DISCARD, DEALLOCATE, RESET, plus SELECT 1, SELECT version(), and any query touching pg_catalog, pg_type, pg_namespace, pg_class, pg_attribute, pg_settings or information_schema (Npgsql, tokio-postgres and asyncpg type loading). Startup and auth never reach this loop. Use a small local predicate and the existing registry helper; prov-2026-167380f0 will move passthrough accounting into pkg/proxy/base later.

  Rejected: recording at Parse (false positives above) and exempting only by exact string (drivers vary the text).
reason_kind: fix
