reason: |-
  prov-2026-806c453e introduced mock-only Parse interception: when a query is mocked, the proxy
  sends ParseComplete locally instead of forwarding Parse to upstream. This works for clients like
  asyncpg and lib/pq that supply explicit parameter type OIDs or use $N::TYPE casts. However,
  tokio-postgres (Rust) sends num_params=0 in Parse with no OID hints and relies on the server's
  ParameterDescription to discover parameter types. When the proxy returns OID=0 (unspecified) for
  all parameters, tokio-postgres calls typeinfo(0), which queries pg_catalog for OID=0, finds no
  rows, and raises "unexpected message from server" — causing any service using tokio-postgres to
  return 500.

  Fix: before intercepting Parse locally, check if OIDs can be resolved without the upstream. If
  the client provided explicit OIDs in Parse, or the query contains $N::TYPE casts, or the query
  has no parameters, use mock-only mode. Otherwise forward Parse to upstream so the real server's
  ParameterDescription (with correct OIDs) is relayed to the client. Bind/Execute are still
  intercepted and mocked as before.
reason_kind: fix
author: test@example.com
