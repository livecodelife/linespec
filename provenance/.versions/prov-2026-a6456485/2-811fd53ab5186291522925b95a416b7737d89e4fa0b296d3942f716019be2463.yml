content:
  id: prov-2026-a6456485
  title: Fix linespec build cross-compile for non-Linux hosts
  type: blueprint
  created_at: "2026-04-20"
  author: calebcowen@gmail.com
  intent: |
    The `linespec build` command copies the host binary into an Alpine Docker image. On macOS (darwin), the binary is Mach-O format; Linux containers require ELF format. The result is `exec format error` when the proxy sidecar starts, silently breaking all non-PostgreSQL proxy types (MySQL, MongoDB, Redis) because the proxy container exits immediately. The fix cross-compiles a Linux binary before building the Docker image when the host OS is not Linux, using `go build` with `GOOS=linux` from the source root. The source root is located by walking up from the current working directory then from the executable path, looking for a `go.mod` containing `module github.com/livecodelife/linespec`.
  constraints:
    - On Linux hosts the current binary is used as-is — no cross-compile step
    - On non-Linux hosts a fresh `go build` with GOOS=linux GOARCH=<host-arch> is run; if no source root can be found the command exits with a clear error describing how to obtain a Linux binary
    - The cross-compiled binary is placed in the existing tmpDir alongside the Dockerfile so no additional temp directories are created
    - |
      `linespec build` run from a linespec source directory must produce a
      working linespec:latest image on a macOS host with Docker running, with no
      manual `docker build` fallback and no host C toolchain setup required.
    - |
      The cgo/tree-sitter dependency must be built with CGO_ENABLED=1 wherever
      the Linux binary is actually produced. If any host-side cross-compile path
      is kept, it must not hardcode CGO_ENABLED=0.
    - |
      The non-source-directory path (goInstallForLinux, used when `linespec
      build` runs outside a checkout) must either be fixed the same way or fail
      with a clear, actionable message instead of a tree-sitter compiler dump.
    - |
      The binary inside linespec:latest must report the real version via
      `--version`, not "vdev".
    - |
      No change to the image's runtime contract: same entrypoint
      (/app/linespec), same alpine base with ca-certificates and libstdc++, and
      the image must stay usable by the existing test runner.
  affected_scope:
    - cmd/linespec/main_stable.go
    - provenance/prov-2026-0e5c82e4.yml
    - Dockerfile.linespec
    - cmd/linespec/build_test.go
    - cmd/linespec/build_integration_test.go
  related:
    - prov-2026-0e5c82e4
  associated_specs:
    - path: cmd/linespec/main_stable.go
      type: code
    - path: Dockerfile.linespec
      type: docker
    - path: cmd/linespec/build_test.go
      type: go_test
    - path: cmd/linespec/build_integration_test.go
      type: go_test
