  id: prov-2026-e192c00f
  title: Release v3.11.6
  type: blueprint
  created_at: "2026-05-28"
  author: calebcowen@gmail.com
  intent: |
    Version bump and release artifacts for v3.11.6. Patch release containing one
    bug fix: the example order-service now reconnects automatically when the
    PostgreSQL proxy resets connections between test runs (persistent container
    reuse path). Fixes create_order_success returning HTTP 500 after
    cancel_order_success passes in the same suite run.
  constraints:
    - |
      Promote [Unreleased] in CHANGELOG.md to [3.11.6] - 2026-05-28 with an entry
      for the example service reconnect fix; add a fresh empty [Unreleased] section above it.
    - make bump-version NEW=3.11.6 handles VERSION and all doc/site references.
    - Run linespec provenance compile to rebuild the hash manifest.
  affected_scope:
    - CHANGELOG.md
    - VERSION
