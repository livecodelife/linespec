  intent: Publish v3.3.0 of LineSpec. This release adds the `linespec init` interactive setup command (prov-2026-85259a41 / prov-2026-d7f475dd), which guides users through configuring a new .linespec.yml from scratch. Includes CHANGELOG entry, docs site updates, version bump, and git tag.
