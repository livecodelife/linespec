content:
  id: prov-2026-7eea40c2
  title: A hit key distinguishes every mock its matcher can distinguish
  type: blueprint
  created_at: "2026-09-08"
  author: caleb.cowen@linq.com
  intent: |
    A hit-tracking key must distinguish every mock the matcher can distinguish.
    Where it does not, a hit on one expectation is reported to the host as
    satisfying another, and the never-called check — the only thing asserting an
    outbound call happened — goes inert for whichever the service skipped. The
    SQL write channels were fixed for exactly this; four other channels were
    left.

    Measured, as GitHub issue #226: two HTTP expectations on one URL differing
    only in method collide, because mockHitKey spells an HTTP key from the
    channel and URL alone. A spec asserting an insert and the read that names the
    row the constraint refused passes against a read-first implementation that
    never attempts the insert. It collides in the other direction too — a
    positive expectation's hit satisfies an EXPECT_NOT on the same URL, failing a
    spec whose service did nothing wrong. Reading the code, gRPC and Redis keys
    drop CALL N, and the default branch that MongoDB falls to drops the database
    and CALL N as well. Every one of those matchers consumes a mock once and in
    declaration order, so in each case the matcher can tell two expectations
    apart and the key cannot.

    So each channel's key carries what its matcher discriminates on. Selection is
    untouched. Rejected: keying HTTP on the request's own URL as observed, which
    would tie the key to a query string the matcher never sees and break every
    expectation the moment a caller added a parameter. Oracle needs nothing — its
    expectations require ACCESSING_TABLES, so they key through the semantic
    branch, which already carries the database, the table set and CALL N.
  constraints:
    - Two expectations the matcher can tell apart are tracked as separate hits.
    - An expectation the service never called fails verification.
    - A hit recorded proxy-side is attributed host-side to the expectation that matched it.
    - A negative expectation is satisfied only by a call the matcher attributed to it.
    - Mock selection discriminates on the same fields before and after this change.
  affected_scope:
    - pkg/registry/registry.go
    - pkg/registry/registry_test.go
    - pkg/registry/hit_key_discrimination_test.go
    - LINESPEC.md
