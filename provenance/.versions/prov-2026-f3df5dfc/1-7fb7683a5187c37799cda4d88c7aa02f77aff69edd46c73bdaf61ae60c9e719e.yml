content:
  id: prov-2026-f3df5dfc
  title: Infer discover record author from target repo git config
  type: imprint
  created_at: "2026-06-12"
  author: calebcowen@gmail.com
  intent: |
    When --dir points to an external repo, author resolution ran git config
    user.email in the linespec-discover worktree (which has a local override of
    test@example.com). Fix: resolve git email in scanDir instead of repoRoot, so
    the local config of the TARGET repo is used, with natural fallback to global
    git config. One-line change in runDiscover.
  affected_scope:
    - cmd/linespec/main_stable.go
  implements: prov-2026-a18e2104
  implements_version: 1
