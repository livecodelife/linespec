content:
  id: prov-2026-7c084083
  title: Fix stable Kafka resolver wiring and example Kafka event payloads for body comparison
  type: imprint
  created_at: "2026-04-26"
  author: noreply@anthropic.com
  intent: |
    Two fixes required to make body comparison work correctly in practice:
    1. cmd/linespec/main_stable.go was missing SetResolver for the Kafka interceptor (stable and beta
       must be at parity — all other proxy types already call SetResolver in stable).
    2. The todo-api Kafka event payload files (todo_created_event.yaml, todo_updated_event.yaml,
       todo_deleted_event.yaml) include dynamic timestamp fields (created_at, updated_at, deleted_at)
       that will never match runtime-generated values. Since CompareJSON uses subset matching, removing
       these fields from the payload files makes the comparison meaningful for the stable fields that DO
       have deterministic values in the integration test context.
  affected_scope:
    - cmd/linespec/main_stable.go
    - examples/todo-linespecs/payloads/
  implements: prov-2026-9e052576
  implements_version: 2
