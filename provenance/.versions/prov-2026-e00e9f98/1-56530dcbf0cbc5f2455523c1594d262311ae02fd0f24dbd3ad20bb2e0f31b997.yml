content:
  id: prov-2026-e00e9f98
  title: Fix MySQL integration tests broken by P2-E database name enforcement
  type: blueprint
  created_at: "2026-04-07"
  author: calebcowen@gmail.com
  intent: |
    Fix three MySQL proxy integration tests (TestProxy_Passthrough, TestProxy_Mocking, TestProxy_MockingSelect) that were broken by P2-E. P2-E required the MySQL proxy to receive an explicit database name before Start() and fail if none is set. The integration tests were not updated to call SetDatabaseName(), so the proxy exited before binding and tests saw "connection refused" on the proxy port.
  affected_scope:
    - pkg/proxy/mysql/proxy_test.go
