content:
  id: prov-2026-70332d7c
  title: Replace dummy NULL row with SendEmptyResultSet on both query protocol paths
  type: imprint
  created_at: "2026-05-27"
  author: calebcowen@gmail.com
  intent: |
    In sendMockResultSet (simple query path) and sendMockResultSetForExtended (extended query
    protocol path), replace the dummy-NULL-row block with a call to SendEmptyResultSet. The
    column list is still extracted from the SQL SELECT clause so RowDescription has correct
    column names. No new protocol logic needed — SendEmptyResultSet already sends the correct
    RowDescription + CommandComplete "SELECT 0" + ReadyForQuery sequence.
  affected_scope:
    - pkg/proxy/postgresql/proxy.go
  implements: prov-2026-9041ccc5
  implements_version: 1
  associated_specs:
    - path: examples/notification-linespecs/get_notification_not_found.linespec
      type: linespec
