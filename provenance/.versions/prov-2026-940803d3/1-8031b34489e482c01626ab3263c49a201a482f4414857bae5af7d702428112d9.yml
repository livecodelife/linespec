content:
  id: prov-2026-940803d3
  title: Add install-skill CLI command for provenance skill
  type: blueprint
  created_at: "2026-04-16"
  author: calebcowen@gmail.com
  intent: Add a `linespec provenance install-skill` CLI command that embeds the provenance skill content and writes it into a target Claude Code skills directory. Users running AI agents can now set up the skill without cloning the repo or running a separate shell script.
  constraints:
    - Default target path must be `.claude/skills` relative to repo root
    - Default skill name must be `provenance`
    - Command must fail with a clear error if the destination directory already exists
    - Skill content must be kept in sync with `skills/provenance/SKILL.md`
  affected_scope:
    - pkg/provenance/commands.go
    - cmd/linespec/main_stable.go
    - cmd/linespec/main_beta.go
    - CHANGELOG.md
    - PROVENANCE_RECORDS.md
    - README.md
    - VERSION
    - docs/index.html
    - docs/provenance.html
    - docs/linespec.html
    - docs/docs.html
    - LINESPEC.md
  associated_specs:
    - path: pkg/provenance/commands.go
      type: code
