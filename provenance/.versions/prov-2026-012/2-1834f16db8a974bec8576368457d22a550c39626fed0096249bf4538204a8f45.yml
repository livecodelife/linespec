id: prov-2026-012
version: 2
content_hash: sha256:1834f16db8a974bec8576368457d22a550c39626fed0096249bf4538204a8f45
parent_hash: sha256:abcc46d11fc30bfafacf999fb8454fb71cf19a34ba37a0a7b913761a876f557f
reason: |-
  linespec-beta is a 22MB statically-linked Linux x86-64 ELF binary committed
  into the repo root, last rebuilt 2026-04-30 (e998292). Nothing consumes it:

    - Dockerfile.linespec builds from source (`COPY . .` + `go build`) in a
      golang:1.23-alpine builder stage; it never copies the committed binary.
    - .goreleaser.yml builds its own linespec-beta artifact from source for
      the backward-compatible Homebrew formula.
    - The Makefile's build-beta target only *produces* this path; nothing
      reads it.

  It is a leftover from a retired practice of rebuilding and committing the
  binary on release (prov-2026-5c6ea0f5, prov-2026-c9e62857,
  prov-2026-8ae0dd5d). Since v2.0.0 the beta binary has been byte-identical in
  purpose to the stable one, and since the Cobra collapse there is not even a
  `beta` build tag left to distinguish them, so a committed copy has no
  remaining reason to exist.

  It is also stale in a way that actively misleads: it predates the Cobra CLI
  rewrite, so `./linespec-beta` still presents the old hand-rolled
  `linespec <command>` interface and reports a version that no longer
  corresponds to anything released.

  Root cause of it being tracked at all: .gitignore ignores `/linespec` but has
  no matching `/linespec-beta` entry, so the sibling build artifact was never
  ignored and got committed. Fixing the ignore rule alongside the deletion is
  what stops it coming back the next time someone runs `make build-beta`.

  Removing it from HEAD does not shrink the existing git history; the goal is
  to stop the churn and remove the misleading artifact, not to rewrite history.
reason_kind: fix
author: calebcowen@gmail.com
created_at: "2026-08-13T16:51:13Z"
spec_hashes:
