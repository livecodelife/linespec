content:
  id: prov-2026-7b7c2c32
  title: Resolve CodeQL allocation overflow by slicing msg before allocation
  type: blueprint
  created_at: "2026-04-23"
  author: calebcowen@gmail.com
  intent: |
    CodeQL flags the make([]byte, 5+msgLen) allocation in encodeGRPCFrame as a potential overflow. Previous fix (prov-2026-710251c7) capped msgLen but did not slice the msg slice itself, so CodeQL taint tracker still sees the original unbounded msg flowing into the allocation. Fix by slicing msg to maxGRPCMessageSize before computing the allocation size, so the taint source is directly bounded.
  constraints:
    - No behavioral change for messages under 1 GB
  affected_scope:
    - pkg/proxy/grpc/interceptor.go
    - provenance/
  related:
    - prov-2026-ae5d2ade
  associated_specs:
    - path: pkg/proxy/grpc/interceptor_test.go
      type: go-test
  tags:
    - security
    - grpc
