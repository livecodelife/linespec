content:
  id: prov-2026-7b7c2c32
  title: Fix CodeQL allocation overflow with int-safe max message size
  type: blueprint
  created_at: "2026-04-23"
  author: calebcowen@gmail.com
  intent: |
    Previous fix (prov-2026-ae5d2ade) used (1<<32)-1-5 as the max message size which overflows int on 32-bit systems where int is 32 bits. CodeQL still flags the 5+msgLen allocation as potentially overflowing. Replace with an int-safe constant (1<<30 - 1) that fits on all platforms.
  constraints:
    - No behavioral change for messages under 1 GB
  affected_scope:
    - pkg/proxy/grpc/interceptor.go
  related:
    - prov-2026-ae5d2ade
  associated_specs:
    - path: pkg/proxy/grpc/interceptor_test.go
      type: go-test
  tags:
    - security
    - grpc
