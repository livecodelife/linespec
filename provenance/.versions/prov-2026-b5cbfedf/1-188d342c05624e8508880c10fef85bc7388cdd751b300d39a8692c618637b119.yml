content:
  id: prov-2026-b5cbfedf
  title: Fix todo-linespecs SQL mocks to use USING_SQL_CONTAINS
  type: blueprint
  created_at: "2026-04-16"
  author: calebcowen@gmail.com
  intent: |
    The get_todo_success, delete_todo_success, and update_todo_success
    linespecs used USING_SQL with "SELECT * FROM todos WHERE id = 1 AND
    user_id = 42 LIMIT 1". Rails 7 .where(...).first generates
    "SELECT todos.* FROM todos WHERE ... ORDER BY todos.id ASC LIMIT 1",
    which doesn't match exactly. Switch to USING_SQL_CONTAINS with just
    the WHERE clause so tests are resilient to ORM query shape differences.
  constraints:
    - Use USING_SQL_CONTAINS for the todo lookup WHERE clause
  affected_scope:
    - examples/todo-linespecs/get_todo_success.linespec
    - examples/todo-linespecs/delete_todo_success.linespec
    - examples/todo-linespecs/update_todo_success.linespec
    - provenance/prov-2026-543305e3.yml
  related:
    - prov-2026-543305e3
  associated_specs:
    - path: examples/todo-linespecs/get_todo_success.linespec
      type: test
    - path: examples/todo-linespecs/delete_todo_success.linespec
      type: test
    - path: examples/todo-linespecs/update_todo_success.linespec
      type: test
