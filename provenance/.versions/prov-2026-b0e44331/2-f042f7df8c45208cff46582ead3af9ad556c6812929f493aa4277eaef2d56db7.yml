reason: |-
  The supersession transition exception in isSupersessionTransitionBetween checks
  beforeRecord.Status != StatusOpen and returns false for anything else, including
  StatusImplemented. This means the git hook scope bypass only fires when superseding
  an open record. But open records are still mutable — a valid supersession should only
  target records that are fully implemented (not superseded or deprecated). The fix
  changes the guard to require StatusImplemented, which is the only valid state a
  record should be in before it can be superseded.
reason_kind: fix
