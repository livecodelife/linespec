content:
  id: prov-2026-8cc1d6c0
  title: Improve validateImplements error message for cross-repo resolution
  type: imprint
  created_at: "2026-04-24"
  author: calebcowen@gmail.com
  intent: |
    Update the error message in validateImplements when the referenced record cannot be
    resolved. The old message said "must exist in the local provenance directory", which
    is misleading now that cross-repo resolution via shared repo cache is supported.

    The new message states the record was not found locally or in any configured
    shared_repo cache, and directs the user to add the repo to shared_repos in
    .linespec.yml and run linespec provenance sync.
  constraints:
    - Error message must mention both local and shared_repo cache as resolution sources
    - 'Error message must suggest the specific remediation steps: add to shared_repos and run sync'
    - The linter_test.go test for unresolved implements must be updated to match the new message
  affected_scope:
    - pkg/provenance/linter.go
    - pkg/provenance/linter_test.go
  implements: prov-2026-90ec670e
  implements_version: 1
  associated_specs:
    - path: pkg/provenance/linter_test.go
      type: code
