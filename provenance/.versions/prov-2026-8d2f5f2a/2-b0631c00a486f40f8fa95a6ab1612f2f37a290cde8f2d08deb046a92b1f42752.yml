parent_hash: sha256:2ecab3b58c94a476750bc74d66a24c45c2069cff6befda453e89a4cd757cccf2
reason: |-
  The fswrite write-permission projection (blueprint prov-2026-8d2f5f2a) locks every
  git-tracked file that is not covered by an open, allowlist-mode record's affected_scope,
  and holds writable only the "authoring coop" returned by AlwaysWritablePaths
  (pkg/provenance/fswrite.go): provenance.exclude_paths, the provenance dir, .linespec.yml,
  and every associated_spec path. That coop does NOT include LineSpec's own tracked,
  regenerated state files under .linespec/. In this repo two such files are git-tracked:
  .linespec/embeddings.bin and .linespec/hash_manifest.json. Because they fall outside the
  coop and outside any open record's scope, reconcile chmods them read-only.

  This is easy to trigger during normal use: Next() runs reconcile unconditionally on every
  invocation (pkg/provenance/commands.go:2467), and the Claude Code plugin's session-start
  hook calls `next`. So merely using the tool locks these files. Subsequent regeneration
  then fails hard: the embeddings store writes via os.Create (pkg/embeddings/store.go:123),
  which returns EACCES on a read-only file, so the next `provenance index` fails with
  "failed to create file: permission denied"; hash_manifest.json is written via
  os.WriteFile and fails the same way.

  A related, quieter instance: .linespec/scope-index.json hits the identical projection but
  is gitignored in this repo, so reconcile never walks it — it is spared only by accident of
  being untracked. Where it (or any managed state file) is tracked, its write failure is
  additionally SILENT: refreshScopeIndexCache discards the error (`_ = ...save(path)` in
  pkg/provenance/scope_index.go), leaving a permanently stale cache with no user signal.
  Reproduced in an isolated sandbox: after locking, a record scope change never propagated
  to the cache and no error surfaced.

  Root cause: LineSpec's own managed, machine-regenerated state under .linespec/ is treated
  as governed source and locked, even though it is not human-authored code the
  provenance-before-code invariant is meant to gate. The fix is to exempt LineSpec's managed
  .linespec/ state from the write-permission projection, the same way the provenance dir and
  .linespec.yml are already always-writable.
reason_kind: fix
author: calebcowen@gmail.com
