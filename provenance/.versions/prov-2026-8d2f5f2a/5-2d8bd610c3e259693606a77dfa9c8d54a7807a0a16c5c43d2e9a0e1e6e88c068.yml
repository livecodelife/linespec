id: prov-2026-8d2f5f2a
version: 5
content_hash: sha256:2d8bd610c3e259693606a77dfa9c8d54a7807a0a16c5c43d2e9a0e1e6e88c068
parent_hash: sha256:31d86dbbc4739c62b2d24caa02a0a42e5e877aa8a5b0194490bee447bde761f4
reason: |-
  Issue #173: with write_restriction enabled, `reconcile` locks a nested
  package's own .linespec.yml — the file that turns the restriction on — even
  though PROVENANCE_RECORDS.md documents "The provenance directory and
  .linespec.yml remain always-writable." The provenance directory honors that
  exemption; the config file only does so at the repo root.

  Root cause: AlwaysWritablePaths (pkg/provenance/fswrite.go) appends the
  literal string ".linespec.yml" to the always-writable set. IsAlwaysWritable
  delegates to IsPathExcluded (pkg/provenance/exclude.go), whose exact-match
  and directory-prefix cases only ever compare against that bare literal, so
  it matches a repo-root config (".linespec.yml") but not a nested one
  (e.g. "pkg_a/.linespec.yml") — the exact repro in the issue. Meanwhile the
  provenance dir entry appended two lines above is correctly derived from
  config.Dir (normalized to repo-relative), and Commands already carries
  config.ConfigFileDir — the repo-relative directory the loaded .linespec.yml
  lives in (added by prov-2026-bde50f4d to bound reconcile's own directory) —
  but AlwaysWritablePaths never consults it for the config-file entry.
  reconcile_scope_test.go's
  TestCommandsReconcile_BothPassesTogetherPartitionTheWholeTree already pins
  this down as pre-existing, documented behavior to keep: it asserts
  "pkg/foo/.linespec.yml": false with a comment explicitly scoping that
  earlier fix (prov-2026-bde50f4d) as being about scope precedence, "not this
  pre-existing always-writable pattern."

  Fix: derive the config-file entry in AlwaysWritablePaths the same way the
  provenance-dir entry is derived — join config.ConfigFileDir (defaulting to
  "." for the repo root, matching existing ConfigFileDir semantics) with
  ".linespec.yml" instead of appending the bare literal — so each config's own
  .linespec.yml is always-writable relative to where it actually lives,
  without exempting any other config's file or requiring it to appear in any
  record's affected_scope.
reason_kind: fix
author: 305597777+agent-loops-boxd[bot]@users.noreply.github.com
