reason: |-
  Record-internal paths (affected_scope, forbidden_scope, associated_specs) are
  interpreted inconsistently with provenance.dir. `dir` is resolved relative to
  the directory holding the `.linespec.yml` that declares it (loadProvenanceConfigFromFile,
  cmd/linespec/main_stable.go: `cfg.Dir = filepath.Join(configDir, fullConfig.Provenance.Dir)`,
  then made absolute against the "repoRoot" passed into
  provenance.NewCommandsWithEmbedder). Record-internal paths are not resolved
  against that same base at all — pkg/provenance/linter.go calls os.Stat,
  filepath.Glob, and filepath.Walk(".") directly on the raw stored path
  (validateExactPath, validateGlobPattern, validateRegexPattern,
  checkDeadRecords/patternHasMatches, validateAssociatedSpecs), which the OS
  resolves against the process's current working directory. Our own records
  store repo-root-relative paths (e.g. "pkg/provenance/linter.go"), matching
  what auto_affected_scope writes, so linting from the repo root happens to be
  correct by coincidence — cwd == repo root. Linting (or opening) from inside a
  subdirectory is not: a stored path like "pkg_a/app/a.rb" resolves via the OS
  as cwd-relative, so from inside pkg_a it becomes pkg_a/pkg_a/app/a.rb, a path
  that does not exist. The record is found (dir resolved correctly) but every
  scope/spec path inside it then reports as missing.

  This isn't confined to lint output. The same double-join affects an actual
  filesystem side effect: pkg/provenance/commands.go passes `c.RepoRoot` (which
  is `os.Getwd()` at CLI startup — see cmd/linespec/cli.go provSetup, despite
  the misleading name) into fswrite.go's MaterializeScope/materializeTargets,
  which do `filepath.Join(repoRoot, rel)` on each affected_scope path. Run from
  inside a package with write_restriction: true, `open` unlocks the wrong
  parent directory for a declared-but-not-yet-existing path. commands.go's
  Complete also os.Stat()s each associated_specs path directly (the "Proof
  artifact does not exist" check), hitting the same cwd-relative resolution.

  Two of the linter's misresolved messages are actively misleading rather than
  merely noisy: "Dead record: all governed files have been deleted. Consider
  deprecating this record" (checkDeadRecords) reports a live record as dead
  purely because of invocation directory, and following its advice deprecates
  a record that governs files that still exist. "Scope path does not exist
  yet — declared for creation; opening unlocks its parent directory" pairs
  with the MaterializeScope bug above to unlock the wrong directory under
  write_restriction: true.

  Fix: resolve every record-internal path (affected_scope, forbidden_scope,
  associated_specs) against the same base, consistently, regardless of the
  invoking process's cwd. Per the issue's own analysis, resolving against
  provenance.dir's own base (the directory holding the declaring .linespec.yml)
  is a breaking change for repos — including this one — whose records store
  paths relative to the git repository root rather than the config file's
  directory. The no-migration alternative is to resolve record-internal paths
  against the git repository root instead of cwd. That is the base this fix
  must use: it makes every affected command's result invocation-independent
  without invalidating any existing record in this repo or others that already
  follow the auto_affected_scope convention.

  Related: issue #163 (already fixed, prov-2026-3687be46) was the inverse
  problem for the hash manifest — a path that ignored `-c` and always landed at
  <repoRoot>/.linespec/ regardless of the resolved config. Same underlying
  question of what a path in this tool is relative to, opposite symptom.
reason_kind: fix
author: 305597777+agent-loops-boxd[bot]@users.noreply.github.com
