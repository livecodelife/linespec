parent_hash: sha256:3b21572451e8aee09194a8cb37547e5e86f321d072f397331b043419501526eb
reason: |-
  `pkg/embeddings/store.go`'s `Store.ReadAll` reads each record's ID with a
  single `bufio.Reader.Read(idBytes)` call instead of `io.ReadFull`. `Read` is
  only guaranteed to return `1 <= n <= len(idBytes)` bytes when data is
  available, not `len(idBytes)`; a short read leaves `idBytes` partially
  zero-filled but the code proceeds as if the full ID had been consumed. Once
  the underlying byte stream is desynced by the shortfall, every subsequent
  record in the file is parsed from the wrong offset, and parsing eventually
  fails with "unexpected EOF" partway through a vector read. Because a
  `bufio.Reader`'s short reads depend on how much is left in its internal
  buffer relative to the read boundary, this only manifests once a record ID
  of different length than its neighbors (e.g. `prov-2026-40000000-aaaaaaaaaaaaa`,
  which carries a disambiguating suffix) lands at a byte offset that produces a
  short read for a later `idLen`-sized read — small corpora and uniform-length
  corpora never hit the boundary, matching the issue's isolation table.
  Compounding this, `Commands.Index` (`pkg/provenance/commands.go`) treats a
  non-`os.IsNotExist` error from `store.Exists` as "skip this record" (prints a
  warning and `continue`s without adding it to `toIndex`), so once `ReadAll`
  starts erroring, affected records vanish from the indexing plan entirely: a
  run with zero candidates left prints "All implemented records already have
  embeddings." even though some records were never successfully embedded, and
  `--force` (which bypasses the `Exists` check but still routes through
  `Store.Write` -> `ReadAll` to rewrite the file) fails on every record because
  the store is already desynced. Fix `ReadAll` to consume exactly `idLen` bytes
  (or fail loudly) regardless of ID length or buffer boundary, and stop
  `Index` from silently dropping records whose existence check errored so a
  wedged store is reported and retried instead of masked as complete.
reason_kind: fix
