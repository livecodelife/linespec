      type: go_test
    - path: pkg/embeddings/client_test.go
      type: go_test
    - path: pkg/provenance/provenance_test.go
      type: go_test
    - path: pkg/embeddings/index_wedge_test.go
  tags:
    - embeddings
    - semantic-search
    - ai-integration
    - claude-code
