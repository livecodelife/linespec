reason: The validateAssociatedSpecs function in the linter fires its enforcement-level check (strict/warn/none) against any open record that has no associated_specs. Brief records are structurally forbidden from carrying associated_specs (the validateNotApplicableFields rule emits a warning if they do), which means an open brief will always trigger the "No associated specs" error/warning from the enforcement block — even though adding specs is not a valid resolution. The fix is to skip the enforcement check entirely for brief records.
reason_kind: fix
