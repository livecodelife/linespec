content:
  id: prov-2026-c99fbd8e
  title: 'Fix P5-B: HTTP proxy port is hardcoded to 80'
  type: blueprint
  created_at: "2026-04-08"
  author: calebcowen@gmail.com
  intent: 'Allow HTTP dependency proxies to bind on the port declared in .linespec.yml instead of always port 80. Services that connect to HTTP dependencies on non-80 ports (e.g., user-service:3001) currently cannot be intercepted. Fix by using DependencyConfig.Port (which already exists) in two places in the runner: proxy command bind address and generated _URL env vars.'
  constraints:
    - Default to port 80 when dep.Port is 0 for backward compatibility
    - Document the single-port-per-proxy-container limitation in a comment
  affected_scope:
    - pkg/runner/runner.go
    - examples/todo-linespecs/.linespec.yml
    - examples/notification-linespecs/.linespec.yml
  associated_specs:
    - path: examples/todo-linespecs/create_todo_success.linespec
      description: Exercises HTTP proxy interception via user-service dependency
    - path: examples/notification-linespecs/get_notification_success.linespec
      description: Exercises HTTP proxy interception via user-service dependency
