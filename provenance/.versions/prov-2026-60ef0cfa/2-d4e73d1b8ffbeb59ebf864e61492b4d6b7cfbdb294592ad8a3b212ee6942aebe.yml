content:
  id: prov-2026-60ef0cfa
  title: 'Blueprint: Hash-based integrity for implemented provenance records'
  type: blueprint
  created_at: "2026-05-05"
  author: calebcowen@gmail.com
  intent: |
    Implement the hash-based provenance integrity system described in the parent brief. This blueprint covers three concrete deliverables: a Hasher type that owns the hash manifest (.linespec/hash_manifest.json), content hash computation using SHA-256 over a canonical YAML serialization of each record's fields, and a real validateImmutability check in the Linter that compares live hashes against the manifest without calling git. The Complete() command is extended to seal a content hash into the manifest at transition time, and the manifest also tracks a full-graph hash and an active-subset hash updated on every seal.
  constraints:
    - Hash manifest is stored at .linespec/hash_manifest.json, separate from record YAML files
    - Content hash uses SHA-256 over yaml.Marshal output with FilePath cleared
    - validateImmutability is implemented without any git calls
    - Complete() writes the per-record hash and recomputes graph hashes on every seal
    - If the manifest is absent, validateImmutability emits warnings rather than errors
    - Full-graph hash covers all records sorted by ID; active-subset excludes superseded and deprecated
  affected_scope:
    - pkg/provenance/hasher.go
    - pkg/provenance/linter.go
    - pkg/provenance/commands.go
    - .linespec/hash_manifest.json
    - pkg/provenance/linter_test.go
    - pkg/provenance/provenance_test.go
    - provenance/prov-2026-60ef0cfa.yml
    - provenance/prov-2026-618113ec.yml
    - provenance/prov-2026-9a992763.yml
    - provenance/prov-2026-3ee43780.yml
    - CHANGELOG.md
    - PROVENANCE_RECORDS.md
    - PROVENANCE_RECORD_SCHEMA.md
    - .github/workflows/ci.yml
    - .github/workflows/provenance-lint-sarif.yml
    - .github/workflows/index-provenance.yml
    - pkg/dsl/integration_test.go
  implements: prov-2026-82bd8b00
  implements_repo: livecodelife-cli
  implements_version: 1
  associated_specs:
    - path: pkg/provenance/linter_test.go
      type: code
    - path: pkg/dsl/integration_test.go
      type: go_test
