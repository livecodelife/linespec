content:
  id: prov-2026-a02e898c
  title: Suppress passthrough warnings for idle pop commands
  type: imprint
  created_at: "2026-05-14"
  author: test@example.com
  intent: |
    Suppress false-positive passthrough warnings for BRPOP/BLPOP/LPOP commands when no seed is available. After a seeded job is consumed, the worker naturally re-issues the blocking pop to wait for more work. This is normal idle-polling behavior, not an unmatched interaction. Recording it as a passthrough creates noisy warnings that mislead users into thinking their test has uncovered interactions outside the mock layer.
  constraints:
    - Pop commands (BRPOP, BLPOP, LPOP) with no seed and no mock must not record a passthrough
    - All other commands with no matching mock must continue to record a passthrough as before
    - Returning nil for un-seeded pops (empty queue simulation) is unchanged
  affected_scope:
    - pkg/proxy/redis/interceptor.go
  implements: prov-2026-bfa97730
  implements_version: 2
  associated_specs:
    - path: examples/asynq-worker/linespecs/process_email_job.linespec
      type: code
