content:
  id: prov-2026-f25d8526
  title: Document compile, init, publish, import, and clone commands in provenance skill
  type: blueprint
  created_at: "2026-05-15"
  author: test@example.com
  intent: |
    The provenance skill (both the embedded constant in commands.go and the skills/provenance/SKILL.md file) does not mention five commands that exist in the CLI: compile, init, publish, import, and clone. Engineers relying on the skill will not know these commands exist or what they do. Add concise descriptions and usage examples for all five to the Useful Commands section of both the embedded skill and the file-based skill.
  constraints:
    - Both the provenanceSkillMD constant in pkg/provenance/commands.go and skills/provenance/SKILL.md must be updated with identical language for the new commands section.
    - The installed skill at ~/.claude/skills/provenance/SKILL.md must be regenerated by running linespec provenance install-skills after the source changes are committed.
    - Each command entry must include a one-line description matching the implementation behavior discovered in the codebase.
    - A version bump and release must follow after the skill update is complete.
  affected_scope:
    - skills/provenance/SKILL.md
    - pkg/provenance/commands.go
  associated_specs:
    - path: skills/provenance/SKILL.md
      type: code
    - path: pkg/provenance/commands.go
      type: code
