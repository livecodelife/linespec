content:
  id: prov-2026-fadc2c53
  title: Release v3.10.2 - fix supersession scope bypass to require implemented status
  type: blueprint
  created_at: "2026-05-20"
  author: test@example.com
  intent: |
    Publish v3.10.2 with one bug fix: the supersession transition scope bypass in the git hook now requires the old record to be implemented (not open). Previously, the bypass only fired for open → superseded transitions; the correct behavior is to only allow supersession of fully implemented records.
  constraints:
    - make test must pass before tagging
    - CHANGELOG.md [Unreleased] must be promoted to [3.10.2] - 2026-05-20 with a new empty [Unreleased] section above it
    - make bump-version NEW=3.10.2 handles VERSION, docs/index.html, docs/linespec.html, docs/docs.html, docs/provenance.html, README.md, LINESPEC.md
    - linespec provenance compile must run to rebuild the hash manifest
    - git tag v3.10.2 must be created and pushed to trigger the release workflow
  affected_scope:
    - CHANGELOG.md
    - VERSION
    - docs/index.html
    - docs/linespec.html
    - docs/docs.html
    - docs/provenance.html
    - README.md
    - LINESPEC.md
    - .linespec/hash_manifest.json
  associated_specs:
    - path: pkg/config/container_naming_docs_test.go
  tags:
    - release
