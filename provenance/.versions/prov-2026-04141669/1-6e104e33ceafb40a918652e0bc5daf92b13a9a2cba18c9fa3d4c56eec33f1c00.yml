content:
  id: prov-2026-04141669
  title: 'Fix go install cross-compile: use temp GOPATH instead of GOBIN'
  type: blueprint
  created_at: "2026-04-20"
  author: calebcowen@gmail.com
  intent: |
    `goInstallForLinux` set `GOBIN` to direct `go install` output to a known path. Go refuses to install cross-compiled binaries (GOOS != host OS) when GOBIN is set, returning "cannot install cross-compiled binaries when GOBIN is set". This breaks `linespec build` on Homebrew-installed machines that don't have the source repo (Strategy 1a/1b both fail, falling through to the go install path). The fix uses a temp GOPATH instead of GOBIN. When cross-compiling, `go install` places the binary in $GOPATH/bin/<GOOS>_<GOARCH>/ rather than $GOPATH/bin/. Any pre-existing GOBIN or GOPATH env vars must be stripped to prevent them from interfering.
  constraints:
    - Strip existing GOBIN and GOPATH from the environment before running go install
    - Cross-compiled binary lands in $GOPATH/bin/linux_<GOARCH>/linespec — rename to outPath
    - Clean up the temp GOPATH directory after copying the binary
  affected_scope:
    - cmd/linespec/main_stable.go
  related:
    - prov-2026-a6456485
  associated_specs:
    - path: cmd/linespec/main_stable.go
      type: code
