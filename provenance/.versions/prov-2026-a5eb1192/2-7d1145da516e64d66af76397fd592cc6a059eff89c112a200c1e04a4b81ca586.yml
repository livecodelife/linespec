content:
  id: prov-2026-a5eb1192
  title: 'Framework-agnostic discover: language detection, symbol extraction, directory grouping'
  type: blueprint
  created_at: "2026-07-15"
  author: calebcowen@gmail.com
  intent: |
    The discover command currently requires a framework description to run — without one it
    exits with an error. Many codebases (CLIs, workers, libraries, unsupported frameworks)
    have no supported framework yet still benefit from provenance scaffolding. This blueprint
    adds a framework-agnostic code path that detects language from file extensions, extracts
    top-level symbols and import relationships using tree-sitter, groups files by
    package/directory, and generates blueprint records per group — without generating
    .linespec stubs (which require route and boundary information that only a framework
    description provides). A Grouper interface is defined so that future community-detection
    grouping (Option B) can replace directory grouping without changing the rest of the
    pipeline.
  constraints:
    - When --framework is unspecified and auto-detection fails, discover MUST warn and proceed in framework-agnostic mode rather than exiting with an error.
    - Framework-agnostic mode MUST NOT generate .linespec stubs (no routes or boundaries are known). It MUST generate blueprint records per group.
    - Grouping in framework-agnostic mode MUST be driven through a Grouper interface so that community-detection grouping can be substituted without pipeline changes.
    - Language detection MUST be extension-based and require no framework description.
    - The existing framework-driven pipeline (when a framework IS detected or specified) MUST be unchanged.
    - New language grammars added to pkg/discover/treesitter/ MUST be additive only; existing Go and Ruby support must not regress.
    - Fix must not regress framework-based route discovery (routes still get blueprints).
    - Fix must not duplicate blueprints for directories already covered by a route group.
    - Fix must apply uniformly across all three supported frameworks (chi, rails, sinatra).
    - 'Chi (grouping_strategy:package): non-route directories AND over-collapsed route groups both undercount.'
    - 'Rails (grouping_strategy:controller): only config/routes.rb is read; models, jobs, mailers, services, concerns produce no blueprints.'
    - 'Sinatra (grouping_strategy:file): per-file route grouping is least severe but helpers, models, and lib/ dirs are still skipped.'
  affected_scope:
    - cmd/linespec/main_stable.go
    - pkg/discover/treesitter/lang.go
    - pkg/discover/treesitter/treesitter_test.go
    - pkg/discover/lang/**
    - pkg/discover/symbols/**
    - pkg/discover/graph/**
    - cmd/linespec/discover_test.go
    - pkg/discover/graph/graph.go
    - pkg/discover/graph/graph_test.go
  implements: prov-2026-0071506f
  implements_repo: livecodelife-cli
  implements_version: 1
  related:
    - prov-2026-0071506f
