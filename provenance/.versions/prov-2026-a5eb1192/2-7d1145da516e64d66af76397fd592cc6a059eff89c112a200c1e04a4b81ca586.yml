reason: |-
  When `linespec provenance discover` runs on a directory where a framework is detected
  (chi, rails, sinatra), the framework-based pipeline only processes files that contain
  HTTP route registrations. All other source files — services, repositories, models,
  utilities — are invisible to the assembler and receive no blueprint coverage.

  Additionally, chi's `grouping_strategy: package` collapses all routes sharing a Go
  package name into a single blueprint group. A service with N route-bearing packages
  produces exactly N blueprints regardless of how many files or subdirectories exist.

  The framework-agnostic path (runDiscoverAgnostic) does the correct thing — one
  blueprint per directory with source files — but it only fires when no framework is
  detected. Once a framework is found, the agnostic supplemental pass never runs.

  This causes a severe undercount: a monorepo package with ~40 subdirectories produces
  ~8 blueprints instead of the expected 35–50.
reason_kind: fix
author: calebcowen@gmail.com
