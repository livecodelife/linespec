parent_hash: sha256:4d832fd3352503dd54af01113433a62228f45cf5f27a56ee49fdbcfd52771207
reason: |-
  The PostgreSQL proxy's oidForColumn heuristic returns OID 23 (INT4) for any
  column named "id" or ending in "_id", because it was originally written for
  asyncpg (Python) where integer primary keys are the common case. When a service
  uses UUID primary keys and reads them back via tokio-postgres, the declared OID
  in RowDescription is INT4 but the Go type requested is Uuid. tokio-postgres
  checks Uuid::accepts(&Type::INT4) before decoding, which returns false, causing
  row.get::<_, Uuid>(0) to panic. The panic propagates out of the axum handler
  (no CatchPanic middleware), dropping the HTTP connection with EOF.

  The fix introduces value-based OID inference: when building RowDescription and
  the sample payload row contains a UUID-formatted string for a column, declare
  that column as OID 2950 (UUID) instead of INT4. tokio-postgres then requests
  binary UUID format in Bind, the proxy's existing encodeUUIDBinary path encodes
  it as 16 bytes, and Uuid::from_sql succeeds.
reason_kind: fix
author: calebcowen@gmail.com
created_at: "2026-05-28T18:36:15Z"
