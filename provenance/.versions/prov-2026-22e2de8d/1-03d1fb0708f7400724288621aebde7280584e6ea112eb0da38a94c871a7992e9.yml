reason: |-
  Suite setup waits for the shared MySQL container by polling a ping with a hard-coded 30 second deadline, after a separate 60 second TCP wait. The PostgreSQL and MongoDB waits in the runner are likewise fixed at 30 and 45 seconds. None is configurable. On a loaded Docker host MySQL initialisation can exceed the deadline (a mysql:8.4 container was observed needing about 42 seconds), and the run then fails with "MySQL not accepting connections: timeout waiting for MySQL at localhost:<port>". That message omits the timeout used, the last connection error, and the container to inspect.
  Fix: add a config setting for the database readiness timeout in .linespec.yml with a default longer than today's (the observed 42 seconds must pass without configuration), apply it to the MySQL, PostgreSQL and MongoDB waits, and make the timeout error state the timeout, the last ping error, and the setting that raises it. Rejected: only raising the constant, which fixes this host and leaves the next slower one with the same opaque failure.
