reason: 'The CodeQL rerun on PR 238 reported five more go/allocation-size-overflow alerts in pkg/proxy/postgresql: CreateMessage and forwardMessage size a buffer from len(payload)+5, buildParameterDescription and buildParameterDescriptionFromOIDs size one from 2+n*4, and the two RowDescription builders size one from len(columns)*20. Remove the size arithmetic (fixed small capacity or appends) so the alerts clear, with identical bytes on the wire.'
reason_kind: fix
