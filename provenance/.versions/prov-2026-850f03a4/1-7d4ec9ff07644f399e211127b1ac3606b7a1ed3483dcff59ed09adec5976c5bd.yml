  intent: |
    Created in error as an attempt to log an imprint for the linespec-beta
    binary removal, originally with `implements: prov-2026-a0b6be6b` — an
    illegal imprint-implements-bug relationship, since imprints may only
    implement blueprint-type records. This record never performed the
    binary removal or gitignore edit it describes: that work was done
    directly under prov-2026-a0b6be6b (commit c685bca, "Remove tracked
    linespec-beta binary and gitignore it [prov-2026-a0b6be6b]").

    Deprecated rather than left dangling in draft, then reclassified from
    `imprint` to a standalone `blueprint` with no `implements` value to
    satisfy schema validation without fabricating a parent relationship.
    This record governs nothing and is retained only as the historical
    trail of the mistake; see prov-2026-a0b6be6b for the real change.
