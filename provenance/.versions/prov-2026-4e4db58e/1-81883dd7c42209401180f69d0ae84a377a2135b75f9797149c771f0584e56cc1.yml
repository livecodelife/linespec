content:
  id: prov-2026-4e4db58e
  title: Add interpolation support to RETURNS payload loading in proxy containers
  type: blueprint
  created_at: "2026-04-16"
  author: calebcowen@gmail.com
  intent: Wire the interpolate.Resolver through to proxy-container PayloadLoaders so that ${VAR} tokens in RETURNS payload files are resolved using environment variables or auto-generated values, consistent with how DSL field interpolation already works.
  constraints:
    - Variables resolved by the runner's Resolver must be serialized into the registry JSON and made available to proxy containers at runtime
    - All six proxy types (postgresql, mysql, http, mongodb, redis, grpc) must resolve variables when loading RETURNS payload files
    - The /reload-registry hot-reload path must preserve the resolver so reloaded tests still interpolate correctly
    - Variables must use the same ${VAR_NAME} syntax and resolution priority (env > generated) as the existing interpolate package
  affected_scope:
    - pkg/registry/registry.go
    - pkg/runner/runner.go
    - pkg/proxy/postgresql/proxy.go
    - pkg/proxy/mysql/proxy.go
    - pkg/proxy/http/interceptor.go
    - pkg/proxy/mongodb/interceptor.go
    - pkg/proxy/redis/interceptor.go
    - pkg/proxy/grpc/interceptor.go
    - cmd/linespec/main_beta.go
    - examples/user-linespecs/payloads/user_response.json
    - examples/user-linespecs/get_user_success.linespec
    - examples/user-linespecs/get_user_not_found.linespec
    - examples/user-linespecs/delete_user_success.linespec
    - examples/user-linespecs/update_user_success.linespec
  associated_specs:
    - path: examples/user-linespecs/get_user_success.linespec
      type: linespec
