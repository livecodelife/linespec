reason: |-
  The publish command's packLayer function returns single-file layers (e.g. prompt.md) as raw
  bytes with the original file extension, while the clone command passes all non-provenance layers
  to manifest.ExtractSpecs which always calls extractTar. When a single-file prompt layer is
  published, clone fails because tar.NewReader cannot parse raw markdown bytes. Fix packLayer to
  always wrap single files in a tar archive, making all layer artifacts uniformly tar-formatted and
  eliminating the format mismatch.
reason_kind: fix
