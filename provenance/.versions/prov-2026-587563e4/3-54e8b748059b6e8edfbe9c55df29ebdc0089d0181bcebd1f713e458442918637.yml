reason: |-
  The clone command extracts specs, code, and prompt layer tarballs into the destination
  directory, but files end up nested inside a subdirectory (e.g., linespec.manifest/) instead
  of the destination root. This happens because tar entries in published layer artifacts carry
  a leading directory prefix from the source repository's layout. The fix strips any common
  single top-level directory component from tar entries when extracting non-provenance layers,
  so files land directly in the destination root.

  After the fix, a cloned project directory should have this structure:
    <manifest_name>/
      <spec_directory>/
      <code_files_and_directories>
      <prompt_file>
reason_kind: fix
