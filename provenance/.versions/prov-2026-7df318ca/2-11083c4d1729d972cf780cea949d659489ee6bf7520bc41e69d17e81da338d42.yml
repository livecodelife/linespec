parent_hash: sha256:299e7c608b9d5000c0a5d0c0b9af421e66644f0325975a42c2d43de7bc9729de
reason: |-
  `createRecord` writes a new record with `SaveRecord` but never adds it to the
  loader's in-memory index, so the record exists on disk and is invisible to
  every lookup for the rest of the process. `lock-layer` is the only command
  that creates a record and then acts on it, so it is the only one that fails:
  step 2 of 4 calls `Complete`, which resolves through `GetRecord`, and the
  command dies with "Record not found" naming the id it just wrote. It leaves a
  stray draft behind and no locked record. Reproduced twice on a clean tree.

  The fix registers the record with the loader at creation rather than
  reloading inside `LockLayer`. `Complete` is not the only consumer that
  resolves through that index — `SealRecord` and `LintRecord` do too — so
  patching the one caller would fix this command and leave the next
  create-then-use command to fail the same way.

  This shipped because the lock-layer tests cover `checkLockedScope`, the
  enforcement half, and nothing calls `LockLayer` at all. The half that decides
  whether a locked record can be created has never run in a test, which is why
  the end-to-end assertion below is the one that matters.
reason_kind: fix
author: caleb.cowen@linq.com
