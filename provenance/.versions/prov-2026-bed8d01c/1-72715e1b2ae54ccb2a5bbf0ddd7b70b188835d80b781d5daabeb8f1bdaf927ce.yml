content:
  id: prov-2026-bed8d01c
  title: Release v3.10.3 - fix complete command to include hash manifest in auto-commit
  type: blueprint
  created_at: "2026-05-20"
  author: test@example.com
  intent: |
    Publish v3.10.3 with one bug fix: the complete command now includes the hash manifest in its auto-commit alongside the record YAML, so PROV-IMM no longer fires in CI after a release completion. Also fixes the stale manifest from the v3.10.2 release.
  constraints:
    - make test must pass before tagging
    - CHANGELOG.md [Unreleased] must be promoted to [3.10.3] - 2026-05-20 with a new empty [Unreleased] section above it
    - make bump-version NEW=3.10.3 handles VERSION, docs/index.html, docs/linespec.html, docs/docs.html, docs/provenance.html, README.md, LINESPEC.md
    - git tag v3.10.3 must be created and pushed to trigger the release workflow
  affected_scope:
    - CHANGELOG.md
    - VERSION
    - docs/index.html
    - docs/linespec.html
    - docs/docs.html
    - docs/provenance.html
    - README.md
    - LINESPEC.md
    - .linespec/hash_manifest.json
  associated_specs:
