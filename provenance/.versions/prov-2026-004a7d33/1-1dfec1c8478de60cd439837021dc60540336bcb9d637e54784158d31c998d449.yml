content:
  id: prov-2026-004a7d33
  title: Generate CLI reference via cobra/doc and wire into docs pipeline
  type: imprint
  created_at: "2026-06-23"
  author: calebcowen@gmail.com
  intent: |
    Deliver the brief's payoff: add CLI-reference generation from the Cobra command
    tree via spf13/cobra/doc (a generator, e.g. a hidden `gen-docs` command or a
    small main under a build tag), and wire it into scripts/build-docs.sh so the
    published CLI reference is regenerated from the tree on every build and can no
    longer drift from the code. Scheduled last, once the whole tree is declarative
    and collapsed (af7becf2), so the generated reference reflects the final single
    binary.
  constraints:
    - Generation output must be deterministic/byte-stable so CI diffs are clean.
    - Per the parent brief, this lands after the docs-pipeline change; coordinate with scripts/build-docs.sh (pandoc + templates) rather than hand-editing HTML.
    - The generated reference is a build artifact (gitignored like the other rendered docs and llms*.txt); the command tree remains the single source of truth.
    - No runtime behavior change to the shipped CLI; the generator must not alter the normal command set users see.
  affected_scope:
    - cmd/linespec/main_stable.go
    - scripts/build-docs.sh
    - .gitignore
    - .github/workflows/pages.yml
    - go.mod
    - go.sum
  implements: prov-2026-f1241113
  implements_version: 3
  associated_specs:
    - path: cmd/linespec/main_stable.go
      type: code
  tags:
    - cobra
    - cli
    - documentation
