content:
  id: prov-2026-f7f1d960
  title: The runner brings up Oracle, so a spec can name an Oracle channel
  type: blueprint
  created_at: "2026-09-04"
  author: caleb.cowen@linq.com
  intent: |
    prov-2026-37958093 added READ:ORACLE and WRITE:ORACLE and proved them against a
    live database from a Go integration test. The runner never learned any of it: the
    word oracle does not appear in pkg/runner, so `linespec test` on a spec naming an
    Oracle channel starts no database, starts no proxy, and the expectation is never
    hit. This is the missing half - the database container, its readiness, and the
    proxy sidecar in front of it.

    It follows the PostgreSQL branch rather than inventing a shape: one container per
    configured database on alias real-<host>, the oracle proxy on alias <host>, the
    app dialling the proxy. Two details are Oracle's own. Readiness is the image's own
    /opt/oracle/healthcheck.sh declared as the container's HEALTHCHECK and polled
    through inspect, because the listener accepts TCP long before the pluggable
    database opens and a TCP probe reports ready roughly a minute early. And there is
    no Go driver, deliberately - prov-2026-37958093 kept one out of the module for the
    sake of a test, and reintroducing one here to run a seed script would undo that.

    So per-spec reset runs as a container rather than a connection. The Oracle image
    carries sqlplus; a short-lived container from that same image, on the same
    network, replays the configured init script between specs. That is the migration
    container pattern the runner already has, which is why it needs no new
    orchestrator method.

    Boot is paid once. Oracle takes about a minute to open, so a fresh container per
    spec would be unusable; HTTP specs already reuse persistent containers, and the
    reset container is what makes reuse sound.
  constraints:
    - Oracle joins the existing per-database switch; MySQL, PostgreSQL and MongoDB behave exactly as before.
    - No Oracle driver enters the module - readiness is the image's healthcheck, reset is sqlplus in a container.
    - Readiness is the pluggable database being open, not the listener accepting TCP.
    - The database container is reused across specs; only the reset container runs per spec.
    - A configured init script is the single definition of the seed state, applied after the database opens and again between specs (see prov-2026-93f3a5d2 for why not at first boot).
    - The proxy sidecar is the oracle proxy from prov-2026-37958093, unchanged, and loads no schema because nothing is synthesised.
    - Container spec construction and the reset command are pure functions, so they are asserted without Docker.
  affected_scope:
    - pkg/runner/runner.go
    - pkg/runner/oracle.go
    - pkg/runner/oracle_test.go
    - pkg/proxy/oracle/proxy.go
    - pkg/proxy/oracle/verify_test.go
    - CHANGELOG.md
  related:
    - prov-2026-37958093
    - prov-2026-0ea7902a
  associated_specs:
    - path: pkg/runner/oracle_test.go
  tags:
    - runner
