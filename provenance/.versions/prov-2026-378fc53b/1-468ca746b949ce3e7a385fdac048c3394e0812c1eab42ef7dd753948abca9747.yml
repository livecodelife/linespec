content:
  id: prov-2026-378fc53b
  title: Add -s -w -trimpath build flags to Makefile
  type: imprint
  created_at: "2026-04-27"
  author: calebcowen@gmail.com
  intent: |
    Add -ldflags="-s -w" and -trimpath to the go build and go install invocations
    in the Makefile. Strips debug symbols and local filesystem paths from the
    binary, reducing size by ~29% with no runtime impact.
  affected_scope:
    - Makefile
