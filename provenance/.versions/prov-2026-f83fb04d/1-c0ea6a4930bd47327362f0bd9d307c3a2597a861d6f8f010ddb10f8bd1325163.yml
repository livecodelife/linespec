content:
  id: prov-2026-f83fb04d
  title: Add body-matcher variants of FindHTTPMock, FindGRPCMock, and FindKafkaMock to registry
  type: imprint
  created_at: "2026-04-26"
  author: noreply@anthropic.com
  intent: Add FindHTTPMockWithBody, FindGRPCMockWithBody, and FindKafkaMockWithBody to the registry. Each accepts a bodyMatch func(withFile, baseDir string) bool callback so the interceptor supplies the comparison logic (loading + CompareJSON) while the registry handles iteration and hit tracking. Mocks whose callback returns false are skipped; mocks with no WithFile always return true from the callback (match-any preserved).
  affected_scope:
    - pkg/registry/registry.go
  implements: prov-2026-9e052576
  implements_version: 2
