parent_hash: sha256:3b2606ec949162667a53f8a515b8b5e5f1043ebc81a8f3c469a0e1a6f453d410
reason: |-
  prov-2026-afd410b6 diagnosed the repo-root discover hang as Tracer.traceHandler's lack of
  memoization causing exponential blowup on JS/TS name collisions (get, map, filter, ...),
  fixed it by memoizing (function name, remaining depth) results, and sealed with a passing
  test (TestTracer_TypeScript_NoExponentialBlowupOnNameCollisions, 40 synthetic files / 8
  shared names). That fix is real — its own test passes — but the original symptom still
  reproduces on a real, only moderately larger file set. This is the same hang, still open,
  not a new mechanism as far as verification could tell; it extends rather than duplicates
  prov-2026-afd410b6 because that record is sealed/immutable and the fix it shipped is
  correct as far as it goes, just insufficient.

  Re-verified against linq-lens at the current sealed commit (built from source, associated
  specs for both prov-2026-afd410b6 and prov-2026-ebc2266b passing): `discover --dry-run` at
  the repo root still pegs ~95% CPU with zero output for 2+ minutes before being killed.

  Isolated with a much smaller, portable repro than "the whole linq-lens repo" (built by
  copying real linq-lens source, no synthetic fixture):
    1. A scratch dir containing only linq-lens's app/ (56 files) plus a minimal package.json
       declaring a `next` dependency (so the framework auto-detects, same as at linq-lens's
       real root). `discover --dry-run` there: fast, correctly finds 36 routes
       (prov-2026-ebc2266b's fix confirmed working here).
    2. The same scratch dir with linq-lens's lib/ and components/ also copied in (236 files
       total, same 36 routes — lib/ and components/ contain no route.ts/page.tsx of their
       own): hangs the same way as the full repo root.

  So the threshold is somewhere between 56 and 236 total indexed files, with the route count
  held constant at 36 — this is not about more routes, it's about a bigger shared file index
  for those same 36 routes' call-graph tracing to walk. One plausible link to the fix that
  didn't take: prov-2026-afd410b6's fix landed while prov-2026-ebc2266b's route-detection fix
  was also landing (both sealed in nearby commits under the same open blueprint), and 0
  routes were being found through most of this bug's original investigation — meaning Phase 2
  boundary tracing may never have run for real against a repo-sized index until both fixes
  were in place together. The memoization fix was validated against a 40-file synthetic
  fixture; it may cover the within-single-handler collision case but not whatever scales with
  total index size across many real handlers. Root cause beyond that is unconfirmed — this
  record documents the smaller repro so it doesn't have to be rediscovered from the full
  linq-lens tree.

  Root cause confirmed: reproduced a 180+ second, still-not-finished trace against a 236-file/
  36-route fixture built from scratch with entirely UNIQUE function names (no collisions at
  all), ruling out the exponential-blowup mechanism prov-2026-afd410b6 fixed as the cause here.
  boundaries.go's queryForNode/queryNode both called sitter.NewQuery fresh on every single
  invocation — compiling a tree-sitter query is not cheap, and the same pattern (a boundary
  query, the static callee pattern, or one function's funcDefPatterns entry) was being
  recompiled from scratch once per file, for every memoized (name, depth) pair. The
  memoization fix made the number of distinct lookups roughly linear in call-graph size, but
  each lookup still scanned every file in the index, so the *count* of query compilations is
  roughly (distinct (name, depth) pairs) × (files) × (patterns per lookup) — on this fixture,
  back-of-envelope, on the order of 1,000 pairs × 236 files × ~3 patterns ≈ 700k+ compiles,
  which lines up with the observed multi-minute wall time. Fixed by caching each distinct
  compiled query pattern for the lifetime of one Trace() call (queryCache), so a pattern is
  compiled once and reused — via qc.Exec(q, tree) — across every file/node it's matched
  against, which is tree-sitter's own intended usage pattern (a compiled Query is stateless
  with respect to which tree it runs against).
reason_kind: fix
