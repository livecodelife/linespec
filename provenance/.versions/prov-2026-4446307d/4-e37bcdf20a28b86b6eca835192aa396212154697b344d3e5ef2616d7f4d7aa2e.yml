content:
  id: prov-2026-4446307d
  title: Next.js + JavaScript/TypeScript support for discover
  type: blueprint
  created_at: "2026-09-22"
  author: caleb.cowen@linq.com
  intent: |
    discover currently only detects Go, Ruby, and Python (pkg/discover/lang/lang.go maps only
    .go/.rb/.py), and only ships framework descriptions for Chi, Rails, and Sinatra
    (prov-2026-c60ec2ad) — all registration-call-based routing. A file with an unrecognized
    extension is skipped outright by both the framework-driven pipeline and framework-agnostic
    mode (prov-2026-a5eb1192), not even reported as unclassified. Verified against a real
    Next.js 16 App Router codebase (linq-lens): dry-run against app/, components/, lib/,
    scripts/, and tests/ each returned zero draft records, because none of those files are
    .go/.rb/.py.

    This blueprint adds (1) TypeScript/JavaScript as a supported language for symbol
    extraction — tree-sitter already ships production-grade TS/JS grammars, per
    LINESPEC_DISCOVER.md's own parsing-infrastructure rationale for choosing tree-sitter over
    per-language native tooling — and (2) a Next.js framework description so App Router (and
    Pages Router) projects get real route-driven discovery instead of only directory grouping.

    Next.js's routing is filesystem-convention-based, not registration-call-based like
    Chi/Rails/Sinatra: a route is `app/**/route.ts` exporting `GET`/`POST`/etc., or
    `app/**/page.tsx` for a page — there is no `r.Post(...)` or `get '/path' do` call site for
    a tree-sitter route query to match. The route/middleware/group query shape LineSpec's
    framework description format already assumes (see LINESPEC_DISCOVER.md's "Route queries")
    is built around call-site matching, so Next.js needs a filesystem-convention detection mode
    alongside (or instead of) query-based route matching.
  constraints:
    - MUST add .ts/.tsx/.js/.jsx to pkg/discover/lang/lang.go's extension map, with tree-sitter TypeScript/JavaScript grammars wired into symbols.Supported() and the per-language dispatch in pkg/discover/boundaries and pkg/discover/routes/assembler.go (currently Go/Ruby only).
    - MUST NOT regress existing Go/Ruby/Python detection or the Chi/Rails/Sinatra framework-driven pipeline — the same non-regression bar prov-2026-a5eb1192 set for its own additions.
    - MUST add a Next.js framework description (e.g. pkg/discover/framework/builtin/nextjs.yml) that derives routes from the app/ (and pages/) directory filesystem convention rather than from a route-registration call-site query, since Next.js has no such call site.
    - MUST detect App Router route handlers (route.ts exporting GET/POST/PUT/PATCH/DELETE) and pages (page.tsx); SHOULD cover the legacy Pages Router (pages/**/*.tsx, pages/api/**/*.ts) where practical.
    - MUST auto-detect Next.js from `next` in package.json dependencies, consistent with the existing dependency-manifest detection rules (go.mod/Gemfile) LINESPEC_DISCOVER.md already documents.
    - Protocol boundary tracing for JS/TS SHOULD cover at least one common DB client and outbound fetch/HTTP calls, mirroring the Go/Ruby boundary query pattern in LINESPEC_DISCOVER.md Phase 2 — exact library coverage is an implementation decision, not a hard requirement of this blueprint.
    - Grouping hints for Next.js SHOULD cluster by route segment/directory (the natural App Router unit), not by arbitrary file directory the way framework-agnostic mode does.
    - MUST NOT hang or exhibit worse than roughly linear-in-file-count behavior when discover's framework-driven pipeline runs across a repo root containing multiple top-level source directories — reproduce against a multi-directory fixture, not only single-directory fixtures, since that is precisely what individual-directory testing missed here.
    - A CLI run that will take a long time SHOULD emit periodic progress output (even under plain, non-debug operation) so a hang is distinguishable from a slow-but-live scan; right now there is no way to tell the two apart from the outside.
    - Root-causing this MUST include a repro fixture shaped like linq-lens (several top-level source directories, a generated multi-hundred-line .ts file, real cross-file imports between them) — the existing associated_specs for prov-2026-4446307d and its imprints only exercise small/single-directory fixtures and did not catch this.
    - MUST NOT hang or exhibit worse than roughly linear-in-(routes × index size) behavior once discover's route detection actually finds a realistic number of routes (36 here) — the original bug's symptom was masked for most of its own investigation by prov-2026-ebc2266b's separate 0-routes bug, so it was never exercised end-to-end until both fixes landed together.
    - MUST be reproduced and fixed against a fixture in the 56-to-236-file range with routes held roughly constant, not only against the smaller synthetic collision fixture that validated the prior fix — that fixture did not catch this.
    - 'Before considering this resolved, MUST re-run the exact repro that surfaced it: a directory combining app/, lib/, and components/-shaped real source (not just minimized/synthetic files) with a package.json declaring `next`, run through plain `discover --dry-run` with no --dir/--framework overrides.'
    - SHOULD add basic timing/progress instrumentation to discover (echoed already as a SHOULD in prov-2026-afd410b6) so future regressions like this show up as "slow" rather than as an indistinguishable-from-hung silent spin.
    - MUST detect an App Router route handler as a file matching app/**/route.ts (or .js) that exports one or more of GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS as a named function or const-assigned arrow function — reproduced against app/api/cron/ingest/route.ts, app/api/search/users/route.ts, app/auth/callback/route.ts, and app/auth/signout/route.ts, all of which currently yield 0 routes.
    - MUST NOT be thrown off by sibling named exports in the same file that are route-segment config, not handlers (dynamic, runtime, maxDuration, revalidate, fetchCache, and the like) — all four reproduction files above export at least one of these ahead of their real handler.
    - MUST derive the route's path from the file's location under app/ per Next.js convention (directory segments become path segments; a parenthesized segment like (dashboard) is a route group and contributes nothing to the URL path; a bracketed segment like [name] or [user_id] is a dynamic path parameter) — linq-lens's app/(dashboard)/... and app/(dashboard)/people/[user_id]/... trees exercise both cases.
    - SHOULD also detect app/**/page.tsx as a page route per the same blueprint's constraint, which is untested here since this record is scoped to the route.ts / API-handler gap that blocks Phase 2/3 entirely.
    - A fix here MUST be proven against a fixture with real route.ts files carrying config-const exports ahead of the handler, not only a minimal single-export fixture — that shape is exactly what the existing associated_specs for prov-2026-4446307d and prov-2026-e5067371 did not cover.
  affected_scope:
    - pkg/discover/lang/**
    - pkg/discover/symbols/**
    - pkg/discover/routes/**
    - pkg/discover/boundaries/**
    - pkg/discover/treesitter/**
    - pkg/discover/framework/**
    - cmd/linespec/discover_test.go
    - pkg/discover/boundaries/boundaries.go
    - pkg/discover/boundaries/boundaries_test.go
    - pkg/discover/routes/filesystem.go
    - pkg/discover/routes/filesystem_test.go
    - pkg/discover/routes/assembler.go
    - pkg/discover/framework/builtin/**
  related:
    - prov-2026-c60ec2ad
    - prov-2026-a5eb1192
  associated_specs:
    - path: pkg/discover/lang/lang_test.go
      type: go_test
    - path: pkg/discover/symbols/symbols_test.go
      type: go_test
    - path: pkg/discover/boundaries/boundaries_test.go
      type: go_test
    - path: pkg/discover/routes/filesystem_test.go
      type: go_test
    - path: pkg/discover/framework/framework_test.go
      type: go_test
    - path: cmd/linespec/discover_test.go
      type: go_test
  tags:
    - discovery
    - nextjs
    - typescript
    - javascript
    - framework-descriptions
