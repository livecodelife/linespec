content:
  id: prov-2026-618113ec
  title: 'Hash manifest: JSON file in .linespec/, keyed by record ID'
  type: imprint
  created_at: "2026-05-05"
  author: calebcowen@gmail.com
  intent: |
    Store the hash manifest as .linespec/hash_manifest.json — a JSON file keyed by record ID, containing per-record content hashes plus the two derived graph hash values (full_graph_hash and active_subset_hash). JSON is chosen over YAML because it is unambiguous, has a stable canonical form, and is natively parseable without an external library.
  constraints:
    - Manifest file path is .linespec/hash_manifest.json at the repo root
    - Top-level fields are records (map of ID to hash string), full_graph_hash, and active_subset_hash
    - Per-record entries are keyed by record ID
    - Manifest must be written atomically via temp-file rename to avoid partial writes
  implements: prov-2026-60ef0cfa
  implements_version: 3
  associated_specs:
    - path: pkg/provenance/linter_test.go
      type: code
