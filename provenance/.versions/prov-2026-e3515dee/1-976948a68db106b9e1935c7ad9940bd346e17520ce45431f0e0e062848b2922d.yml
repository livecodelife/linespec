content:
  id: prov-2026-e3515dee
  title: Revert homebrew_casks to brews
  type: blueprint
  created_at: "2026-04-14"
  author: calebcowen@gmail.com
  intent: Revert homebrew_casks back to brews. homebrew_casks is for macOS DMG-based casks and has an incompatible struct (no url_template, install, or test fields). brews is the correct and only supported key for Homebrew formula publishing in GoReleaser v2.15.2. The tap was being updated correctly all along — the skip_upload changes were chasing a red herring.
  constraints:
    - Only rename homebrew_casks back to brews; do not change any other fields
