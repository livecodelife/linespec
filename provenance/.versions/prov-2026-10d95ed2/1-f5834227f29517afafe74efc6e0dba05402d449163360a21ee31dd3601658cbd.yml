content:
  id: prov-2026-10d95ed2
  title: Always serialize url field in ManifestLayer
  type: imprint
  created_at: "2026-05-15"
  author: calebcowen@gmail.com
  intent: |
    Remove omitempty from ManifestLayer.URL so the field always appears in the serialized manifest JSON with an empty string value, making it explicit to the author that the URL needs to be filled in after uploading the artifact.
  constraints:
    - ManifestLayer.URL json tag changes from "url,omitempty" to "url".
  affected_scope:
    - pkg/provenance/publish.go
