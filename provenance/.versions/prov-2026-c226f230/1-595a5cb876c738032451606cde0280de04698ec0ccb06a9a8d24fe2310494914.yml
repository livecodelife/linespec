content:
  id: prov-2026-c226f230
  title: Migrate proxy command to declarative Cobra
  type: imprint
  created_at: "2026-06-23"
  author: calebcowen@gmail.com
  intent: |
    Replace the proxy bridge with a declarative Cobra subcommand exposing the
    positional <type> <addr> <upstream> contract plus the flags --db-name, --host,
    --schema-data, --schema-file, --sidecar-port, --grpc-descriptor-set, and --debug.
    The RunE wrapper calls the existing runProxy logic unchanged. proxy is isolated
    in its own imprint because its flag surface is the largest and is consumed by the
    proxy sidecars at runtime.
  constraints:
    - All proxy flag names/shapes and the positional type/addr/upstream contract stay byte-identical — proxy sidecars and the runner depend on them.
    - Wire-protocol logic in pkg/proxy/* is unchanged; only arg parsing is replaced.
    - Both the --flag value and --flag=value forms currently accepted must continue to parse (Cobra/pflag supports both natively).
  affected_scope:
    - cmd/linespec/provenance_cobra.go
    - cmd/linespec/main_stable.go
  implements: prov-2026-f1241113
  implements_version: 3
  associated_specs:
    - path: cmd/linespec/main_stable.go
      type: code
  tags:
    - cobra
    - cli
