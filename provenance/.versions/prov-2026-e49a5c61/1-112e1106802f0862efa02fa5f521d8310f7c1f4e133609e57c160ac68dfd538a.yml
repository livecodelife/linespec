  title: 'records package: route group to blueprint record generation'
  type: imprint
  created_at: "2026-06-05"
  author: test@example.com
  intent: Implement pkg/discover/records/ — the record generation package that groups route groups into draft blueprint provenance records. Groups are derived from Phase 1 output (routes.Group), stubs from Phase 3, and boundary data from Phase 2. Writes draft blueprint records to the provenance directory using pkg/provenance infrastructure. Supports dry-run mode via Plan(). Includes tests and FormatTable/FormatJSON helpers.
