content:
  id: prov-2026-0742993e
  title: Install skills during linespec clone
  type: imprint
  created_at: "2026-05-15"
  author: calebcowen@gmail.com
  intent: |
    Call cloneCmds.InstallSkills after InstallHooks in runClone so the provenance and
    linespec-testing skills are written to .claude/skills/ in the cloned project. Without
    skills the installed git hooks reference provenance commands that Claude Code cannot
    invoke, making the hooks effectively useless.
  affected_scope:
    - cmd/linespec/main_stable.go
  implements: prov-2026-fde4ee3a
  implements_version: 1
  associated_specs:
    - path: pkg/manifest/manifest_test.go
      type: go_test
