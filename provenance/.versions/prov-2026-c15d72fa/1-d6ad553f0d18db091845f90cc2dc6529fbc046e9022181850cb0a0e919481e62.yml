content:
  id: prov-2026-c15d72fa
  title: Add bug RecordType and extends field to Record struct
  type: imprint
  created_at: "2026-04-24"
  author: calebcowen@gmail.com
  intent: |
    Extend the type system with the bug RecordType constant and add the extends field to the Record struct. The bug type slots into the hierarchy alongside blueprint and has special conditional rules enforced by the linter. The extends field is a string reference (like supersedes) that only Bug records may use to express additive constraint coverage.
  constraints:
    - RecordTypeBug = bug added to types.go and included in IsValid()
    - Extends string field added to Record struct with yaml:extends,omitempty tag
  affected_scope:
    - pkg/provenance/types.go
  implements: prov-2026-9ffe68bb
  implements_version: 2
  associated_specs:
    - path: pkg/provenance/linter_test.go
      type: test
