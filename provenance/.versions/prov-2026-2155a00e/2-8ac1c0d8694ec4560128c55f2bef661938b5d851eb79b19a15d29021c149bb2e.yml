reason: |-
  `linespec provenance complete` never actually runs a record's own `associated_specs`,
  even when `run_associated_specs_on_complete: true` is set. `Complete()` only checks
  that each spec's `path` exists on disk (os.Stat) and `FormatCompleteSuccess` prints
  `✓` based on that same existence check — neither calls `runRecordSpecs`, the function
  that `RunSpecs`/`run-specs` uses to actually execute each spec's command and inspect
  its exit status. So a record whose proof command exits non-zero is reported as
  verified and sealed to `implemented` anyway, while `run-specs` against the identical
  record and config correctly reports `✗ failed` and exits 1. The completion-time
  overlap "teeth" already call `runRecordSpecs` correctly, but only for *other* sealed
  records the change happens to touch — never for the record actually being completed.
  Fix `Complete()` to run the record's own `associated_specs` via `runRecordSpecs` when
  `run_associated_specs_on_complete` is enabled, roll back the transition (leaving the
  record `open`) and exit nonzero if any spec fails — mirroring the rollback-on-lint-
  failure path already in `Complete()` — and fix `FormatCompleteSuccess` to report each
  spec's actual pass/fail outcome instead of mere file existence.
reason_kind: fix
