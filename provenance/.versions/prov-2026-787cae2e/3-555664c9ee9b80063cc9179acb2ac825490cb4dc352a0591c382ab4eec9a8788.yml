  id: prov-2026-787cae2e
  title: 'v2.6.0 release: VARS constraints, CI pipeline, SARIF fix'
  type: blueprint
  created_at: "2026-04-18"
  author: calebcowen@gmail.com
  intent: |
    Bump version to v2.6.0. This release adds typed constraints to the VARS block (integer min/max, string charset/length/pattern, enum), adds a CI workflow that runs unit tests and all four example linespec suites on every PR and push to main, and fixes the SARIF lint output bug where multiple JSON documents were concatenated causing GitHub Code Scanning to reject the upload.
  constraints:
    - Version string MUST be updated to v2.6.0 in all files
    - CHANGELOG.md MUST include an entry for v2.6.0 covering all three areas
  affected_scope:
