content:
  id: prov-2026-c673e4af
  title: Ensure Docker containers are always cleaned up when test run ends
  type: blueprint
  created_at: "2026-04-15"
  author: calebcowen@gmail.com
  intent: |
    Fix the test runner so that all Docker containers started during a test run are guaranteed to be removed when the process exits, regardless of whether tests pass, fail, or the user cancels with Ctrl+C. Add SIGINT/SIGTERM signal handling and restructure exit paths so cleanup defers always execute before the process terminates.
  affected_scope:
    - cmd/linespec/main_beta.go
  associated_specs:
