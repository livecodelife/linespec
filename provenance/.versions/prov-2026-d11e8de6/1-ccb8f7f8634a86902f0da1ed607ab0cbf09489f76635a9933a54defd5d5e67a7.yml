content:
  id: prov-2026-d11e8de6
  title: Install the v2 plugin, skills and hooks from provenance assets
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: |
    Replace linespec's embedded plugin, skills and hook installer with the provenance CLI's own: the
    Claude Code plugin and skill come from the provenance repo's assets (origin/main at the pinned SHA), and
    git hooks are installed by `provenance hooks install`. Remove plugins/provenance and the duplicate skill
    copies that the v1 `install-plugin`/`install-skills`/`install-hooks` embedded, or turn them into thin
    copies of the assets.
  affected_scope:
    - plugins/provenance/**
    - skills/provenance/**
    - .claude/skills/provenance/**
  implements: prov-2026-dfb51160
  implements_version: 1
  associated_specs:
    - path: plugins/provenance/hooks_test.go
      type: code
