content:
  id: prov-2026-b107a5da
  title: Release v3.4.0 — lint output filtering flags
  type: blueprint
  created_at: "2026-05-14"
  author: calebcowen@gmail.com
  intent: |
    Publish v3.4.0 adding lint output filtering flags. New flags: --warn (warnings only), --info (hints only), --all (everything). Default output now shows errors only. Summary line always shown. Includes CHANGELOG entry and version bump via make bump-version.
  constraints:
    - docs/index.html, docs/linespec.html, docs/provenance.html, and docs/docs.html must reference v3.4.0.
    - README.md must reference v3.4.0.
    - make test must pass before tagging.
    - A signed git tag v3.4.0 must be pushed to trigger the release workflow.
  affected_scope:
    - docs/index.html
    - docs/linespec.html
    - docs/provenance.html
    - docs/docs.html
    - README.md
    - LINESPEC.md
    - CHANGELOG.md
    - VERSION
    - .linespec/hash_manifest.json
