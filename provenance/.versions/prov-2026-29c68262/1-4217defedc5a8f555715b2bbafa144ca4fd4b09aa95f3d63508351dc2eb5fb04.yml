content:
  id: prov-2026-29c68262
  title: Extract errEmbeddingNotConfigured helper in provenance commands
  type: imprint
  created_at: "2026-06-12"
  author: calebcowen@gmail.com
  intent: |
    pkg/provenance/commands.go repeats an identical "Embedding API not configured"
    stderr guidance block (9 Fprintln lines + the returned error) in both Search
    and Index. Extract a package-level errEmbeddingNotConfigured() error helper
    that prints the guidance and returns the standard error, and call it from both
    not-configured guards.
  constraints:
    - Prints byte-identical stderr lines and returns the same "embedding not configured" error
    - Behavior unchanged; pkg/provenance tests pass unmodified
  affected_scope:
    - pkg/provenance/commands.go
  implements: prov-2026-b5c9c813
  implements_version: 1
