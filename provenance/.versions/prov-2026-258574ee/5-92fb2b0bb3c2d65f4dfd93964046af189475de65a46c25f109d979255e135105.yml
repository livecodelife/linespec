id: prov-2026-258574ee
version: 5
content_hash: sha256:92fb2b0bb3c2d65f4dfd93964046af189475de65a46c25f109d979255e135105
parent_hash: sha256:e67655d8f4a591034f2ee384d1fedc8d70a9f0d7e634bfabe3c9e467d97904fe
reason: |-
  A mock-only Describe can send a RowDescription wider than the mock row. Npgsql fails with
  "Row's number of columns (1) differs from the row description's (12)" for
  `SELECT applicationid FROM applications` (12 columns) and `SELECT errorcode FROM
  cnp_global.errors` (7). The DescribePortal path builds columns with inferColumnsForTable,
  i.e. every column of the discovered table, ignoring the select list. The statement-Describe
  path uses extractSelectColumns, which is also wrong for several shapes: `*` becomes a
  literal "*" column, and the comma split breaks on function calls with commas. It likely
  surfaced only now because prov-2026-059ba152 (v3.26.1) lets discovery see non-public
  tables, so these tables finally have wide schemas.

  Decision: replace both with one pure function, (query, schemaCache) -> []column, where a
  column is a name plus the discovered type when known. It handles explicit lists, aliases,
  `*` and `t.*` (expanded from the schema), qualified names, casts, and expressions or
  aggregates such as count(*), which have no table column and get the implicit name
  (count, sum, ...) or the alias with the existing name-based OID heuristics. A selected
  column missing from the schema falls back to those heuristics rather than failing. The
  function takes no proxy or connection state, so the planned core refactor
  (prov-2026-167380f0) can reuse it. Both Describe paths call it; Execute already
  uses the select list, so Describe and DataRow now agree.

  Rejected: truncating the table-wide column list to the mock row's keys. Row key order is
  not select order and it hides the real query, so the query stays the source of truth.
reason_kind: fix
author: caleb.cowen@linq.com
created_at: "2026-10-12T17:32:12Z"
