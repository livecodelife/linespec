reason: |-
  The count_users job handler added to the asynq-worker example (prov-2026-02213cc0)
  introduced a PostgreSQL dependency — github.com/lib/pq v1.10.9 in
  examples/asynq-worker/go.mod, used by main.go for sql.Open("postgres", ...) and the
  SELECT COUNT(*) FROM users query. The corresponding examples/asynq-worker/go.sum was
  never committed, and it was not listed in the affected_scope of prov-2026-02213cc0
  (which covered only main.go, the count_users linespec, and payloads/).

  Worse, the go.sum left untracked in the working tree is incomplete: it carries only
  the /go.mod hashes for lib/pq and go-redis and none of the h1: build hashes or the
  transitive dependencies (cespare/xxhash, dgryski/go-rendezvous, bsm/ginkgo,
  bsm/gomega). `go build ./...` against it fails with "missing go.sum entry". A fresh
  checkout therefore cannot build the worker; it only succeeds today because the Docker
  build regenerates go.sum at image build time, which masks the gap. Every sibling Go
  example (catalog-service, multi-db-service) commits a complete go.sum; this one
  should too.

  The fix regenerates a complete examples/asynq-worker/go.sum via `go mod tidy` (adding
  the missing h1: hashes and transitive-dependency entries) and commits it so the
  example builds reproducibly without relying on on-the-fly regeneration.
reason_kind: fix
