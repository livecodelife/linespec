content:
  id: prov-2026-258574ee
  title: Fix PostgreSQL proxy binary encoding for integer types and COUNT(*)
  type: blueprint
  created_at: "2026-05-27"
  author: calebcowen@gmail.com
  intent: |
    The PostgreSQL proxy does not correctly honour the result format codes that clients
    supply in their Bind messages for integer types. The root cause is two related gaps:

    1. oidForColumn returns TEXT (OID 25) for count-like column names (e.g. "count",
       "total", "num_rows"). When a client like lib/pq reads OID 25 in the RowDescription
       it requests text format in its Bind — so the proxy and client agree on text, but
       the result does not match what real PostgreSQL sends for COUNT(*) (which has OID 20,
       INT8). The OID mismatch means COUNT(*) values scanned into int64 work via text
       parsing but any client that drives format selection from the OID gets the wrong type.

    2. The binary encoding path in sendDataRowInternal (fmtCode == 1, default branch)
       calls toInt32, which encodes all integers as 4-byte big-endian INT4. INT8 columns
       (OID 20, 8 bytes) require 8-byte big-endian encoding. When lib/pq (or any client)
       requests binary format for an int8 column it expects 8 bytes; receiving 4 bytes
       causes a decode error or silent data corruption.

    Fix oidForColumn to return INT8 (OID 20, size 8) for count/aggregate column names,
    and fix sendDataRowInternal to encode integers as int64 (8 bytes) when the client
    requests binary format for a column whose OID is INT8.

    Add a COUNT(*) test case to the asynq-worker example suite so the fix has a
    regression harness.
  constraints:
    - oidForColumn must return OID 20 (INT8, size 8) for column names "count", "total", and names with prefix "num_" or suffix "_count"
    - sendDataRowInternal binary path must encode integer values as int64 (8 bytes big-endian) when the column OID is INT8; INT4 columns (OID 23) continue to use 4-byte encoding
    - The OID-to-size mapping must be consistent between oidForColumn (RowDescription) and the binary encoding in sendDataRowInternal (DataRow)
    - All existing example test suites must continue to pass (make test + all 4 example suites)
    - No changes to the DSL, MySQL proxy, HTTP proxy, Kafka proxy, or Redis proxy
    - |
      Regenerate examples/asynq-worker/go.sum with `go mod tidy` so it contains complete
      entries (both h1: and /go.mod hashes) for github.com/lib/pq v1.10.9 and
      github.com/redis/go-redis/v9 v9.7.3 plus their transitive dependencies.
    - |
      go.sum must be consistent with examples/asynq-worker/go.mod (no module additions or
      removals as part of this fix); `cd examples/asynq-worker && go build ./...` must
      succeed against the committed go.sum.
    - |
      No source, proxy, runner, or linespec changes — this is purely the missing build
      artifact.
    - |
      Add the `// indirect` require block for github.com/cespare/xxhash/v2 v2.2.0 and
      github.com/dgryski/go-rendezvous (the go-redis v9 transitive deps) to
      examples/asynq-worker/go.mod, exactly as produced by `go mod tidy`.
    - |
      `cd examples/asynq-worker && GOFLAGS=-mod=readonly go build ./...` must succeed against
      the committed go.mod + go.sum (no on-the-fly module updates).
    - |
      go.sum is already committed (prov-2026-0714ca9d) and is not modified here; no source,
      proxy, runner, or linespec changes.
    - Per-column result format is resolved by one pure function of (Bind result format codes, column count) with no proxy, connection or registry state; RowDescription and DataRow both use it
    - Where RowDescription and DataRow already agree (text format, Describe Statement, simple protocol, nil codes) output is byte-identical; no regression for lib/pq, asyncpg or tokio-postgres (prov-2026-1aac1dc7, prov-2026-258574ee, prov-2026-cbc8213e)
    - 'Unit tests for each combination (no codes, one code, per-column codes, mixed) assert the RowDescription per-column format code equals the format used to encode the DataRow, including applicationid bigint with binary result format: RowDescription OID 20 AND format code 1, DataRow 00 00 00 08 00 00 00 00 00 00 00 0b'
    - 'Verified by reading, not on the wire: both RowDescription builders write 0 unconditionally; Bind result formats are captured by extractBindResultFormats into the mocked portal and reach DataRow encoding; the mock-only Describe Statement path runs before Bind and marks the statement described so Execute skips RowDescription; the Describe Portal path has the portal formats available but ignores them; the Execute-time RowDescription (no prior Describe) declares 0 while encoding per Bind. NOT verified: a live Npgsql session, which Describe variant Npgsql sends for unprepared versus prepared commands, and whether Npgsql ever trusts a Describe Statement RowDescription format over its Bind-time formats'
    - 'Known remaining disagreements, not fixed here: the simple protocol and nil-format-code Bind keep the legacy binary heuristic under a declared format 0; a non-mock-only Describe Statement forwards the upstream RowDescription, whose OIDs come from upstream while the mock DataRow uses columnOIDs; Describe-time columns (describeInputs) and Execute-time columns (selectColumnKeys) are computed separately and could differ in count'
    - 'DECIDED (human, 2026-10-09, wording corrected after the spec was written): the legacy nil-codes case stays byte-identical, RowDescription format 0 with the name heuristic in the DataRow. It is reached only through the simple protocol; a Bind with zero result format codes is already all-text via extractBindResultFormats returning []int16{0} and must keep passing that, so a zero-code Bind yields RowDescription 0 and an all-text DataRow, exactly as today. Declaring the heuristic''s real format is rejected because it changes bytes on paths that work today and it is unknown which of lib/pq, asyncpg and tokio-postgres depend on it'
  affected_scope:
    - pkg/proxy/postgresql/result.go
    - pkg/proxy/postgresql/proxy.go
    - examples/asynq-worker/main.go
    - examples/asynq-worker/linespecs/**
    - examples/asynq-worker/go.sum
    - examples/asynq-worker/go.mod
    - pkg/proxy/postgresql/result_format_agreement_test.go
