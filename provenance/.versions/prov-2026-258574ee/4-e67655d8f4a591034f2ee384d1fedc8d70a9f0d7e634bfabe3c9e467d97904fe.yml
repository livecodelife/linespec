reason: |-
  After prov-2026-7e08a3cb a mocked bigint applicationid carries OID 20 in both the
  RowDescription and the DataRow, yet Npgsql still hands the app raw bytes. Both
  RowDescription builders hardcode format code 0 (text) for every column, while the DataRow
  is encoded per the client's Bind result format codes. A client that asked for binary is
  told text, so it reads the 8 binary bytes as a string. Text columns pass only because the
  text and binary encodings of text are identical.

  Decision: one pure function, (Bind result format codes, column count) -> per-column format,
  is the only place format codes are resolved (none = all text, one code = all columns, N codes
  = per column, a short list pads with text). The RowDescription writes that format for every
  column it builds, both on Describe Portal (Bind has already arrived, so the portal's formats
  are known) and on the Execute-time RowDescription when no Describe ran; DataRow encoding
  reads the same function. Describe Statement answers before Bind, so formats are unknown and
  it keeps declaring 0 for every column, which is what PostgreSQL itself does; the client's
  Bind-time formats govern the DataRow. The function takes no proxy state so
  prov-2026-167380f0 can reuse it.

  The simple protocol keeps today's exact bytes: RowDescription format 0, and the legacy
  name heuristic (binary for id/_id/*_at/*time) in the DataRow. The function reports
  "legacy" for nil or empty codes and the RowDescription writes 0 for it. CORRECTED while
  drafting specs: on the extended protocol extractBindResultFormats already turns a Bind
  with zero result format codes into []int16{0} (text, per the PostgreSQL spec), so that
  case is all-text today and must stay all-text; the legacy heuristic is reached only via
  the simple protocol (or a Bind whose result formats cannot be parsed, which returns nil).
  Declaring the heuristic's real format would change output for lib/pq, asyncpg and
  tokio-postgres paths that work today, so the hazard stays recorded, not fixed.

  Rejected: only patching the Describe Portal builder. The Execute-time RowDescription has the
  same defect and would leave a second path where the two disagree.
reason_kind: fix
author: caleb.cowen@linq.com
