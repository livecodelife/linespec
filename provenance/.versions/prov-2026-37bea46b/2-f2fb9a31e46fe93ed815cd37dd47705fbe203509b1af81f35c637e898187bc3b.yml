reason: 'Fix .linespec/hash_manifest.json (pkg/provenance/hasher.go) reported against GitHub issue #163: independent branches that each seal one record touch the same sorted `records` map plus the two aggregate hashes (`full_graph_hash`, `active_subset_hash`), so the file text-conflicts on essentially every rebase in a repo with concurrent provenance PRs, and no client-side merge strategy resolves it safely. `merge=union` produces invalid JSON (duplicate keys, broken sort). A merge driver that shells out to `provenance compile` silently drops the other side''s record, because git invokes merge drivers before writing the incoming branch''s record YAML files into the worktree, so `compile` regenerates from only one side''s records and exits 0 anyway (verified end-to-end in the issue). A driver that merges the JSON directly can rebuild `full_graph_hash` (sha256 over the sorted id+hash concatenation per computeGraphHash) but not `active_subset_hash`, since isActiveRecord needs each record''s `status` and the manifest does not carry it. Compounding this: validateImmutability (pkg/provenance/linter.go) treats a record with no manifest entry as "pre-dates the manifest, nothing to check" unconditionally, so a hash a bad merge silently dropped is indistinguishable from a pre-manifest record — lint and check both pass with a record missing from the manifest, silently disabling its immutability check. Separately, NewCommandsWithEmbedder (pkg/provenance/commands.go) always builds the Hasher from repoRoot via NewHasher(repoRoot), never from the resolved provenance config''s own directory, so `compile -c packages/foo/.linespec.yml` writes to the same `<repoRoot>/.linespec/hash_manifest.json` as a root-level compile and clobbers it with only that package''s records instead of getting a manifest of its own.'
reason_kind: fix
