id: prov-2026-cd7b32ac
title: Fix RETURNS last_insert_id always returning 0 in Docker proxy sidecars
status: open
created_at: "2026-04-16"
author: calebcowen@gmail.com
intent: >
  When a WRITE:MYSQL or WRITE:POSTGRESQL EXPECT has a RETURNS payload,
  last_insert_id and affected_rows from that payload were always returning 0
  inside Docker proxy sidecars. The proxy sidecar received the registry JSON
  with BaseDir set to an absolute host filesystem path, which doesn't exist
  inside the container. loadWriteResult silently fell back to sendMockOK
  (last_insert_id=0). Fix by rewriting BaseDir to container-internal paths
  before serialising the registry for Docker use.
constraints:
  - BaseDir rewriting must only affect paths that are under the host CWD; paths
    outside CWD are left unchanged
  - Existing SaveToFile and ToBytes methods must not be modified
  - Both the initial registry write and the prepareForReuse hot-reload path must
    use the container-aware methods
affected_scope:
  - pkg/registry/registry.go
  - pkg/runner/runner.go
  - examples/multi-db-service/main.go
  - examples/multi-db-linespecs/create_order_success_missing_expect_test.linespec
