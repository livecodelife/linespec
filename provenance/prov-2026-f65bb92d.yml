id: prov-2026-f65bb92d
title: Fix provenance check false positives on completion and imprint commits, and enforce the draft to open to implemented lifecycle in complete
status: open
created_at: "2026-08-13"
author: calebcowen@gmail.com
intent: |
  `linespec provenance check` reports forbidden-scope violations against
  commits that linespec itself generated via the documented workflow, so a
  repo following CLAUDE.md to the letter cannot get a clean `check` on its own
  recent history. Reproduced on this repo at 127c796 (HEAD, 2 violations) and
  54eb101 (HEAD~1, 1 violation); confirmed present in v3.15.0 and the
  pre-Cobra build too, so this is long-standing and not a v3.17.0 regression.

  Three independent causes, all in CheckCommit (pkg/provenance/git.go):

  1. The hash-manifest exemption is unreachable for implemented records.
     CheckCommit iterates records, then files. The implemented-record guard
     (git.go:400) runs first: for a file where isRecordFile() is false it
     leaves isCompletion false, appends a violation, and `continue`s. The
     `if isHashManifest(file) { continue }` exemption added by
     prov-2026-8bb2286c sits at git.go:474, *after* that guard, so it never
     runs for an implemented record. Because every completion commit stages
     .linespec/hash_manifest.json alongside the record, every completion
     commit reports a violation for the manifest.

  2. `complete` permits a draft -> implemented lifecycle skip that `check`
     correctly rejects. isCompletionTransitionBetween (git.go:808) returns
     `beforeRecord.Status == StatusOpen && afterRecord.Status ==
     StatusImplemented`, i.e. it only accepts open -> implemented — which is
     exactly the documented draft -> open -> implemented lifecycle. But
     Complete (commands.go:1044) guards only against StatusImplemented, so it
     will seal a record straight from draft: prov-2026-f857109e is
     `status: draft` in 127c796^ and `status: implemented` in 127c796, sealed
     by linespec's own auto-commit (commit_on_status_change).

     `check` is right here and `complete` is wrong. The fix is to enforce the
     lifecycle in Complete, not to teach check to accept the skip. This is
     already the near-universal practice: of the last 60 completion commits,
     59 were open -> implemented and exactly one (127c796) skipped open. That
     commit is already sealed and pushed, so it will remain a permanent check
     violation — correctly, because it records a real lifecycle violation.
     Historical noise is bounded at that single commit.

  3. Creating an imprint's YAML is out of scope for the blueprint it
     implements. 54eb101 creates provenance/prov-2026-f857109e.yml (an imprint
     with `implements: prov-2026-f05161eb`) under a commit tagged
     [prov-2026-f05161eb]. That path is not in the blueprint's affected_scope,
     so it is reported as forbidden. This is the standard documented workflow
     — CLAUDE.md step 4 says to create imprints as you work — so it must not
     require widening the blueprint's affected_scope with the imprint's own
     record path.

  On 127c796 causes 1 and 2 produced one violation each. Fixing cause 1
  removes the manifest violation; cause 2's violation on that commit stays by
  design. Cause 3 produces the single violation on 54eb101.

  Causes 1 and 3 must be fixed in CheckStaged as well as CheckCommit —
  CheckStaged carries a parallel copy of the implemented-record guard
  (git.go:606) and its own isHashManifest exemption (git.go:668) — otherwise
  the pre-commit path and the historical-audit path stay inconsistent.

  Related false positive to fix while in here: `check --staged` with no
  --message-file falls back to reading HEAD's commit message, so run bare it
  reports a phantom violation against whatever record HEAD happens to name.
  The real commit-msg hook always passes --message-file, which is why this
  never surfaces in the hook path. Staged mode with no message source should
  derive record IDs from the staged records themselves, or say plainly that it
  has no message to check, rather than silently auditing HEAD.
constraints:
  - |
    The hash-manifest exemption must be evaluated before the implemented-record
    guard in both CheckCommit and CheckStaged, so that
    .linespec/hash_manifest.json is never reported as a scope violation
    regardless of the governing record's status. The manifest is system-managed
    and is already exempt by intent (prov-2026-8bb2286c); this only fixes the
    ordering that made the exemption unreachable.
  - |
    Complete must refuse any record that is not in `open` status, with an
    actionable error naming `linespec provenance open --record <id>` as the
    required prior step. draft, superseded, and deprecated must all be
    refused; only open -> implemented may seal. This makes `complete` agree
    with isCompletionTransitionBetween, which already encodes the documented
    lifecycle.
  - |
    isCompletionTransitionBetween must NOT be widened to accept
    draft -> implemented. The already-sealed commit 127c796 stays flagged;
    that is the intended consequence of enforcing the lifecycle, not a
    regression to paper over. Do not add a historical exemption for it.
  - |
    Audit every existing Complete call site in the test suite (14 across
    pkg/provenance) and seed each record as `open` where it currently relies
    on completing from draft, so the new guard does not silently mask real
    coverage. The three TestComplete_* cases in transition_rollback_test.go
    already seed `open` and should need no change.
  - |
    Add a regression test asserting Complete on a draft record fails, leaves
    the record at draft, writes no manifest entry, and creates no commit —
    i.e. the same rollback guarantees the existing transition tests assert.
  - |
    A commit tagged with record X must be allowed to add or modify the YAML of
    a record whose `implements` field equals X, without that path appearing in
    X's affected_scope. The allowance is keyed on the `implements` relationship
    only; an unrelated record's YAML must still be reported as a violation.
  - |
    No weakening of the core immutability guarantee: a commit that edits an
    implemented record's non-transition content, or that touches a source file
    outside the tagged record's affected_scope, must still be reported exactly
    as it is today. Add regression coverage that asserts these still fail.
  - |
    After the fix, `./linespec provenance check --commit 54eb101` reports no
    violations, and a fresh draft -> open -> complete cycle produces a
    completion commit that `check` reports clean. `check --commit 127c796`
    still reports its single lifecycle violation, by design — that one commit
    is the known, accepted exception.
  - |
    Documentation must match the enforced behavior: CLAUDE.md and
    PROVENANCE_RECORDS.md already describe draft -> open -> implemented, so
    verify rather than rewrite, and add the new Complete error to the
    troubleshooting table in commands.go alongside the existing
    "already implemented" entry.
affected_scope:
  - pkg/provenance/git.go
  - pkg/provenance/git_test.go
  - pkg/provenance/commands.go
  - pkg/provenance/transition_rollback_test.go
forbidden_scope: []
type: blueprint
supersedes: ""
superseded_by: ""
related:
  - prov-2026-8bb2286c
  - prov-2026-3687be46
sealed_at_sha: ""
associated_specs:
  # `make test` runs the whole suite, so this single entry also gates
  # transition_rollback_test.go (listed in affected_scope). Kept as one entry
  # so the suite runs once, not twice, at completion.
  - path: pkg/provenance/git_test.go
    type: go_test
    run_command: make test
associated_traces: []
monitors: []
tags:
  - provenance
  - check
  - git-hooks
  - false-positive
