id: prov-2026-d4538081
title: Commit asynq-worker go.mod indirect block for reproducible readonly build
status: open
created_at: "2026-06-02"
author: calebcowen@gmail.com
intent: |
  Follow-up to prov-2026-0714ca9d, which committed a complete examples/asynq-worker/go.sum
  but scoped only that file. `go mod tidy` also updates go.mod: go-redis v9 pulls the
  transitive dependencies cespare/xxhash and dgryski/go-rendezvous, which Go expects to be
  declared as an `// indirect` require block in go.mod. That block was regenerated in the
  working tree but never committed (the prior record's affected_scope was go.sum only), and
  its completion proof accidentally ran `go build` against the dirty working-tree go.mod, so
  the gap was masked.

  Against the committed state (go.mod without the indirect block + complete go.sum),
  `go build -mod=readonly` — the Go default and what CI uses — fails with
  "updates to go.mod needed, disabled by -mod=readonly". This commits the missing go.mod
  indirect block so the example builds reproducibly under -mod=readonly without relying on
  on-the-fly regeneration, completing the fix begun in prov-2026-0714ca9d.
constraints:
  - |
    Add the `// indirect` require block for github.com/cespare/xxhash/v2 v2.2.0 and
    github.com/dgryski/go-rendezvous (the go-redis v9 transitive deps) to
    examples/asynq-worker/go.mod, exactly as produced by `go mod tidy`.
  - |
    `cd examples/asynq-worker && GOFLAGS=-mod=readonly go build ./...` must succeed against
    the committed go.mod + go.sum (no on-the-fly module updates).
  - |
    go.sum is already committed (prov-2026-0714ca9d) and is not modified here; no source,
    proxy, runner, or linespec changes.
affected_scope:
  - examples/asynq-worker/go.mod
