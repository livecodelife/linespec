id: prov-2026-37958093
title: An Oracle channel that watches the wire without answering for it
status: implemented
version: 2
reason: |-
  Read both encodings of a long statement's length, and pin each to a packet the
  client that sends it really sent.

  prov-2026-37958093 found that a statement carries a one-byte length below 254 and
  0xFE plus a 4-byte LITTLE-endian length at or above it, and pinned that against
  captured packets. The capture was sqlplus. Oracle's managed .NET driver does not
  do that: it sends 0xFE followed by a MARSHALLED length - one byte giving how many
  length bytes follow, then that many bytes BIG-endian. A 489-byte statement arrives
  as fe 02 01 e9, where sqlplus would send fe e9 01 00 00. The short form is the same
  in both, one byte, which is why nothing showed until a statement crossed 254.

  What it costs is not an error but silence. The parser finds no length it can agree
  with, the packet contributes no interaction, and an expectation written against
  that statement is reported as never called - or, worse, a different statement in
  the same request satisfies it and the spec passes. Both were observed on the same
  page: a get-by-key at 259 bytes vanished, and a paginated list matched its COUNT
  while the 489-byte ROW_NUMBER query it was written for was never seen.

  It matters more than the byte count suggests. Every service linespec would point
  at an Oracle is a .NET service using this driver, and 254 bytes is a small
  statement - a generated repository's SELECT with three columns and an alias is
  already past it. On the sqlplus form the channel works; on the form its real users
  send, it silently sees only the short statements.

  The two forms are told apart the way the two packet framings already are, by what
  agrees with itself: the length must be matched by exactly that many printable
  bytes opening with a SQL verb, and Statement already scans every offset and keeps
  the longest match. So reading a second interpretation adds a candidate rather than
  a branch to get wrong.

  One consequence surfaced while implementing it and belongs here rather than in a
  comment alone: that agreement test required the verb at byte zero, and a C#
  verbatim interpolated string - which is how the base class assembles a paginated
  query - puts a newline and an indent before SELECT. Oracle sends the statement
  faithfully, whitespace included, so the test was rejecting a real statement on its
  formatting. Leading whitespace is now skipped before the verb is looked for.
reason_kind: fix
created_at: "2026-09-03"
author: caleb.cowen@linq.com
aliases:
  - prov-2026-37bc00ad
intent: |
  Add READ:ORACLE and WRITE:ORACLE. The proxy frames TNS, pulls the statement out
  of the client's packets, and hands it to the same registry matching every other
  SQL channel uses - so ACCESSING_TABLES, VERIFY_OPERATION, VERIFY_WHERE_COLUMNS,
  VERIFY_WHERE, VERIFY_WRITTEN_VALUES and EXPECT_NOT all work against an Oracle
  service. prov-2026-0ea7902a taught the analysis layer Oracle's SQL; this is the
  transport that gets a statement to it.

  It observes and relays rather than emulating a server. Bytes pass through to a
  real Oracle in both directions untouched and only the client-to-server
  direction is read. That is the whole design decision, and it is what makes the
  channel a few hundred lines rather than a reimplementation of Oracle: nothing
  here has to synthesise a result set, negotiate data types, or answer a
  handshake. The cost is stated rather than discovered - RETURNS is not supported
  on this channel, because a response the proxy did not author is one it cannot
  replace, and a spec binding RETURNS to an Oracle expectation is refused when it
  is parsed instead of ignored at run time.

  The framing was measured against a real Oracle 23ai and two details would have
  been wrong if assumed - both caught by the captures rather than by review.
  Oracle uses TWO length framings on one connection: CONNECT is sent before any
  version is agreed and carries the protocol's original 16-bit length, while
  DATA packets, after negotiation, spread a 32-bit length across all four header
  bytes. Reading only the wide form stalls on the first packet of every
  connection; reading only the narrow one misreads every packet after it. They
  are told apart by whether the header's high half is zero, which is decidable
  from the header alone - so a proxy attaching to a connection already in
  progress needs no handshake state.

  The second is that a statement carries a one-byte length below 254 bytes but
  0xFE followed by a 4-byte LITTLE-endian length at or above it - big-endian
  everywhere else in the header, little-endian there. That form only appears on
  statements long enough to be realistic, which is the size a generated
  repository emits, so a parser built on short queries would pass its own tests
  and fail in use. Both forms are pinned by captured packets checked in as
  testdata, so the tests read bytes Oracle actually sent rather than bytes this
  package encoded for itself.

  An unreadable packet is not an error. Oracle carries plenty over one connection
  that is not a statement, so a packet the parser cannot make sense of relays
  untouched and contributes no interaction. A statement that never arrives fails
  the spec that expected it, which is the loud direction.
constraints:
  - The proxy never synthesises a response. Every byte the client sees came from the real Oracle.
  - RETURNS on an Oracle expectation is refused at parse time with a message naming the reason, never silently ignored.
  - Framing and statement extraction are asserted against captured packets from a real Oracle, never against bytes this package encoded.
  - A packet that cannot be parsed relays untouched and contributes no interaction - never an error, never a silent match.
  - Both statement length forms are handled - one byte below 254, 0xFE plus a 4-byte little-endian length at or above it.
  - Both packet framings are handled - 16-bit on CONNECT, 32-bit on DATA - discriminated from the header alone, with no handshake state.
  - A packet too large for the framing to express is refused rather than misread.
  - Analysis is delegated to sqlanalysis.Oracle; this package parses the protocol and nothing about SQL.
  - The other channels are untouched; the full unit suite and both existing proxy integration suites pass unchanged.
  - Both encodings are asserted against packets captured from the client that sends them - sqlplus for one, ODP.NET for the other - never bytes this package encoded.
  - The existing sqlplus captures keep passing unchanged; this adds a reading, it does not replace one.
  - A length that does not agree with the bytes that follow it is not a length, whichever encoding proposed it.
  - The marshalled count byte is bounded, so a stray 0xFE cannot name a length from arbitrary following bytes.
  - Leading whitespace does not disqualify a statement; the verb is looked for after it, not at byte zero.
