id: prov-2026-57aff9e1
title: 'provenance index: openai provider hardcodes api.openai.com, and -c/--config is ignored'
status: implemented
version: 2
reason: |-
  Follow-up to #188 (prov-2026-57aff9e1 / prov-2026-684303c3), which fixed
  `-c/--config` for `linespec provenance index`'s embedding settings but left
  record discovery on a different config source. Reported against
  LineSpec v3.18.0 (d229fa8371db69fa6f59acdcf5f44246e1c54932), Homebrew/macOS.

  Root cause is in `loadProvenanceConfigFromFile`
  (cmd/linespec/main_stable.go:919-977), the function `reloadConfigIfNeeded`
  calls to rebuild `*cfg` from the `-c` file. When the custom config sets
  `provenance.dir`, it resolves the value with:

      cfg.Dir = filepath.Join(configDir, fullConfig.Provenance.Dir)

  (main_stable.go:950), where `configDir` is the directory containing the
  `-c` file. `filepath.Join` does not special-case an absolute second
  argument -- `Join("/tmp/scratch", "/Users/x/relay/provenance")` yields
  `/tmp/scratch/Users/x/relay/provenance`, not the absolute path itself. The
  mangled result still satisfies `filepath.IsAbs`, so it also slips past the
  one absolute-path guard that exists, in
  `NewCommandsWithEmbedder` (pkg/provenance/commands.go:100-102), which only
  re-joins a *relative* `config.Dir` against `repoRoot`. The result is a
  syntactically absolute but nonexistent directory. `Loader.LoadFromDir`
  (pkg/provenance/loader.go:54-57) treats a missing directory as "zero
  records" rather than an error, so `Commands.Index`
  (pkg/provenance/commands.go:3000) builds an empty `toIndex` slice and
  prints "All implemented records already have embeddings."
  (commands.go:3036) -- a false positive indistinguishable from the correct
  "nothing left to do" case, because that line does not know whether zero
  records were *found* versus zero records *needing* indexing.

  A relative `provenance.dir` in a `-c` config that lives outside the repo is
  working as designed (resolved relative to the config file, per
  prov-2026-bde50f4d) and is not part of this bug -- the issue reporter
  confirmed this by testing with an absolute path and observing identical
  (silently-wrong) output.
reason_kind: fix
created_at: "2026-08-19"
author: 305597777+agent-loops-boxd[bot]@users.noreply.github.com
aliases:
  - prov-2026-531a0e0b
intent: |
  `linespec provenance index` (and `search`, which shares the same code path)
  cannot reach a self-hosted OpenAI-compatible embedding server, and the
  `-c/--config` flag both subcommands advertise in `--help` is silently
  ignored for embedding configuration. Reported while trying to index 31
  provenance records against a local LM Studio server. Version:
  LineSpec v3.17.0 (7f4766a16fa6774806b2c22ab5afccd61e9df1fa), Homebrew/macOS.

  Two independent defects, both in `pkg/embeddings/client.go` /
  `cmd/linespec/main_stable.go`:

  1. `provider: openai` hardcodes the request endpoint to
     `https://api.openai.com/v1/embeddings` in
     `Client.generateOpenAI` (pkg/embeddings/client.go:224). LM Studio,
     Ollama, vLLM, LiteLLM, and text-embeddings-inference all speak the same
     `/v1/embeddings` wire format but are unreachable because there is no way
     to point at a different host. `config.EmbeddingConfig`
     (pkg/config/types.go:324) has no `base_url` field, and an unrecognized
     `base_url` key under `provenance.embedding` in `.linespec.yml` is
     silently dropped rather than rejected, so a user who guesses the field
     name gets no feedback that it did nothing — the request just goes to
     OpenAI and the user's own API key is rejected with OpenAI's own 401.

  2. `-c/--config` is parsed into `IndexOptions.ConfigFile` /
     `SearchOptions.ConfigFile` and does reach
     `reloadConfigIfNeeded` (cmd/linespec/main_stable.go:984), which
     correctly reloads `*cfg` from the custom file. But it then rebuilds
     `*cmds` via `provenance.NewCommands(*cfg, repoRoot, os.Stdout, true)`
     (main_stable.go:987), which passes `nil` for the embedder
     (see `NewCommands` at pkg/provenance/commands.go:85-87), instead of
     `NewCommandsWithEmbedder` built from `cfg.Embedding` the way
     `provSetup()` (cmd/linespec/cli.go:173-188) does for the default config
     path. Any subcommand that goes through `provCmds()` with a non-empty
     `-c` therefore always reports "Embedding API not configured"
     (`errEmbeddingNotConfigured`, checked at
     pkg/provenance/commands.go:3002) regardless of what the custom config
     contains — indistinguishable from a config-syntax mistake, since the
     same block pasted into the repo's own `.linespec.yml` works.
constraints:
  - |
    `provenance.embedding.provider: openai` must support an optional
    `base_url` config field. When set, it is used verbatim as the request
    endpoint (path included, e.g. `http://localhost:1234/v1`) for both
    `GenerateDocument` and `GenerateQuery`. When unset, behavior is unchanged:
    requests go to `https://api.openai.com/v1`.
  - |
    An unrecognized key under `provenance.embedding` (e.g. a typo, or a field
    that doesn't apply to the configured provider) must not be silently
    accepted and ignored — either the loader rejects unknown keys, or the
    resolved config is surfaced somewhere the user can verify it took effect.
  - |
    `-c/--config` must be honored by every provenance subcommand whose
    `--help` documents it, including `index` and `search`: when a custom
    config file declares a valid `provenance.embedding` block, that block
    must actually be used to build the embedder for that invocation, not just
    to reload unrelated config state.
  - |
    Fixing the `-c` embedder gap must not change behavior for the no-`-c`
    (default `.linespec.yml`) path, which already works correctly via
    `provSetup()`.
  - |
    The `voyage` provider's fixed endpoint is out of scope — this record only
    covers the `openai` provider's endpoint and the `-c` propagation bug.
  - |
    In loadProvenanceConfigFromFile (cmd/linespec/main_stable.go), an
    absolute `provenance.dir` in the config passed via `-c/--config` must be
    used verbatim, not joined with the config file's own directory. A
    relative `provenance.dir` continues to resolve relative to the config
    file's directory, unchanged from current behavior.
  - |
    After the fix, `linespec provenance index -c <file>` (and any other
    provCmds-based subcommand sharing reloadConfigIfNeeded, e.g. `search`)
    discovers records from the directory the `-c` config's
    `provenance.dir` actually names -- both when that value is relative and
    when it is absolute -- not from the invoking directory's own
    `.linespec.yml`.
  - |
    Commands.Index (pkg/provenance/commands.go) must not print
    "All implemented records already have embeddings." when zero records
    were loaded at all. That message is reserved for the case where records
    were found but all already carry embeddings; zero-records-found must be
    reported distinguishably (e.g. a warning that no records were discovered
    at the configured dir), so a misconfigured or misresolved `-c` path is
    visibly wrong instead of silently reporting success.
  - |
    No behavior change for the no-`-c` (default `.linespec.yml`) path, and
    no change to how `-c`'s `provenance.embedding` block is resolved
    (prov-2026-57aff9e1 / prov-2026-684303c3) -- this record is additive to
    that fix, not a replacement of it.
  - |
    make test passes, including a regression test reproducing the original
    repro: a `-c` config with an absolute `provenance.dir` pointing outside
    both the repo and the config file's own directory must yield the records
    actually present at that absolute path.
