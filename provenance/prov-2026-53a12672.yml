intent: >
  Fix all remaining staticcheck findings across the codebase excluding the PostgreSQL
  proxy dead code (covered by prov-2026-c013b085). Issues include: unused variables
  and struct fields (U1000/SA4006), deprecated Docker API usage (SA1019), error strings
