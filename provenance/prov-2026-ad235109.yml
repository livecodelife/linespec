id: prov-2026-ad235109
title: gRPC WITH body matching silently fails for binary protobuf requests
status: implemented
created_at: "2026-04-27"
author: calebcowen@gmail.com
intent: |
  The WITH body matching feature introduced in prov-2026-9e052576 is silently broken for
  gRPC services that use the standard binary protobuf encoding (Content-Type application/grpc).

  In pkg/proxy/grpc/interceptor.go, after stripping the 5-byte framing header, the interceptor
  calls json.Unmarshal directly on the raw message bytes. For binary protobuf these bytes are
  not valid JSON, so Unmarshal returns an error, bodyMatcher returns false, and the mock is
  never matched -- with no indication to the test author that anything went wrong.

  The original blueprint's constraint ("Non-JSON request bodies are not supported in this
  iteration") intentionally deferred this. In practice it means EXPECT GRPC:Service/Method
  WITH {{file}} is silently useless for any service that does not use application/grpc+json,
  which is the uncommon encoding.

  The fix must decode binary protobuf request bodies to JSON before comparison. The gRPC proxy
  already has a descriptor abstraction (pkg/proxy/grpc/descriptor.go) used for response
  conversion (JSON to Protobuf); the same descriptor should be used in reverse to convert
  incoming request bodies (Protobuf to JSON) so the existing CompareJSON path can be used.
  When no descriptor is available for a binary protobuf request with a WITH file, the
  interceptor must surface a clear diagnostic error rather than silently returning false.
constraints:
  - Binary protobuf request bodies must be decoded to JSON using the registered descriptor
    before CompareJSON is called.
  - >-
    If no descriptor is registered and the request body is binary protobuf, bodyMatcher must
    log a clear diagnostic (e.g. "WITH body match: binary protobuf requires a descriptor;
    set descriptor_path in .linespec.yml") rather than silently returning false.
  - application/grpc+json requests must continue to work via the existing json.Unmarshal path
    with no behavioral change.
  - The Content-Type header must be used to detect encoding; do not attempt heuristic detection
    of binary vs JSON payloads.
  - All existing proxy tests must continue to pass unmodified.
affected_scope:
