id: prov-2026-abc98f0d
title: Implement P3-C Kafka consumer/fetch protocol interception
status: open
created_at: "2026-04-06"
author: calebcowen@gmail.com
intent: |
  Implement Kafka consumer/fetch protocol support in the Kafka interceptor so that
  services which consume from Kafka can be tested. This includes: a Fetch (apiKey=1)
  response handler that serves seeded messages to consumers, minimal consumer group
  protocol stubs (FindCoordinator, JoinGroup, SyncGroup, Heartbeat, OffsetFetch,
  OffsetCommit, ListOffsets, LeaveGroup), DSL support for RECEIVE KAFKA:topic-name
  to trigger a test via a Kafka message rather than HTTP, registry seed message
  storage so the interceptor knows what to serve on Fetch, and wiring the Kafka
  interceptor into the runner for consumer-triggered tests.
constraints:
  - Must follow the existing fake-broker pattern (not a pass-through proxy)
  - RecordBatch format must be Kafka message format v2 (magic=2)
  - "RECEIVE KAFKA: syntax must not break existing RECEIVE HTTP: tests"
  - RESPOND block must remain optional for consumer tests
  - Registry VerifyAll must still enforce EVENT mocks when interceptor is active
affected_scope:
  - pkg/proxy/kafka/interceptor.go
  - pkg/types/types.go
  - pkg/dsl/parser.go
  - pkg/registry/registry.go
  - pkg/runner/runner.go
  - examples/notification-linespecs/process_todo_created_event.linespec
  - pkg/dsl/dsl_test.go
  - pkg/registry/registry_test.go
