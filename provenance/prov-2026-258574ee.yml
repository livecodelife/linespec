id: prov-2026-258574ee
title: Fix PostgreSQL proxy binary encoding for integer types and COUNT(*)
status: implemented
version: 6
reason: |-
  Npgsql reads a mocked non-text column as garbage (a bigint applicationid of 11 arrives as
  raw bytes) while text columns are fine. Since prov-2026-4fc643ef the mock-only
  RowDescription types each column from the discovered schema (bigint -> OID 20), but the
  DataRow encoder (sendDataRowInternal) never sees the schema. When the client asks for
  binary results it picks the width from the column NAME via oidForColumn: applicationid is
  not id/_id/count, so it is "text, size -1", the default branch calls toInt32, and 4 bytes
  go out under an int8 column. Booleans, numerics, dates and floats fall to the same branch
  and either error into text or get int-sized, so they are wrong too. This is a width
  mismatch in binary mode. In text mode the bytes are right but only by accident of
  fmt.Sprintf. A separate hazard: with no Bind format codes (simple query, or a Bind with
  zero codes) the encoder emits binary for id/_id and *_at/*time columns, which is not
  valid for the simple protocol; that legacy behaviour is kept byte-identical here.

  Decision: one pure function, (table, columns, sampleRow, schemaCache) -> per-column
  (OID, size), built once per statement and used both to write the RowDescription and to
  encode each DataRow, so the two can never disagree. It is the existing columnOID logic
  (schema, then UUID-shaped value, then name heuristic) lifted out so it takes no proxy or
  connection state, and prov-2026-167380f0 can reuse it. The encoder dispatches binary
  encoding on the OID (int2/int4/int8, bool, float4/float8, numeric, date, timestamp,
  timestamptz, uuid) and falls back to the current name heuristic when a column has no
  OID. Text-format and unknown-OID output is unchanged.

  Rejected: widening the name heuristic with more column names. The schema already knows
  the type, and a heuristic can never be right for names like applicationid.
reason_kind: fix
created_at: "2026-05-27"
author: calebcowen@gmail.com
aliases:
  - prov-2026-0714ca9d
