id: prov-2026-4c5b54d6
title: Stream fetchViaArchive output and use errors.As in isExitError
status: open
created_at: "2026-04-24"
author: calebcowen@gmail.com
intent: >
  Two performance/fragility issues in cache.go. fetchViaArchive calls
  cmd.Output() which buffers all stdout into a []byte, then converts it to
  string before wrapping in a strings.NewReader — doubling peak memory for
  large provenance directories. Use cmd.StdoutPipe() + cmd.Start() to stream
  directly into unpackProvenance and call cmd.Wait() after. isExitError uses a
  direct type assertion (err.(*exec.ExitError)) which works today because
  cmd.Output does not wrap errors, but errors.As is idiomatic Go 1.13+ and
  handles any future wrapping transparently.
constraints:
  - StdoutPipe error handling must capture cmd.Wait() error and propagate it when unpackProvenance succeeds but wait fails
  - isExitError must be simplified to a single errors.As call; the function signature is unchanged so callers need no update
  - Stderr capture for the exit-error path must be preserved (exitErr.Stderr is still available via errors.As)
affected_scope:
  - pkg/provenance/cache.go
