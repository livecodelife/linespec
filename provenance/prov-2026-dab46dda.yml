intent: "Add VARS block documentation to LINESPEC.md and docs/linespec.html. The VARS block (introduced in v2.4.0) allows explicit typed variable declarations (uuid, integer, string) at the top of a spec, pre-generating values before any payload is scanned. Both docs and the docs site sidebar must be updated to cover syntax, supported types, value generation rules, and a complete example."
