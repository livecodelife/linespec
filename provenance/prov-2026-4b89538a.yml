id: prov-2026-4b89538a
title: 'Fix publish/clone format mismatch: single-file layers published as raw bytes but clone expects tar'
status: open
created_at: "2026-05-15"
author: calebcowen@gmail.com
intent: |
  The publish command's packLayer function returns single-file layers (e.g. prompt.md) as raw
  bytes with the original file extension, while the clone command passes all non-provenance layers
  to manifest.ExtractSpecs which always calls extractTar. When a single-file prompt layer is
  published, clone fails because tar.NewReader cannot parse raw markdown bytes. Fix packLayer to
  always wrap single files in a tar archive, making all layer artifacts uniformly tar-formatted and
  eliminating the format mismatch.
constraints:
  - packLayer must always produce a tar archive regardless of whether the input is a file or directory
  - all layer artifacts written by publish must have the .tar extension
  - the packed filename inside the tar for a single-file input must be the original filename (filepath.Base of the source path)
  - clone extraction behavior must remain unchanged — ExtractSpecs (extractTar) handles all non-provenance layers
  - existing unit tests for packLayer must be updated to reflect the new behavior
affected_scope:
  - pkg/provenance/publish.go
  - pkg/provenance/publish_test.go
forbidden_scope: []
