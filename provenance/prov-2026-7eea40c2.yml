id: prov-2026-7eea40c2
title: One hit key per HTTP method, so two EXPECTs on a URL cannot satisfy each other
status: draft
created_at: "2026-09-08"
author: caleb.cowen@linq.com
intent: |
  Fix GitHub issue #226. Two positive HTTP expectations for the same URL but
  different methods share one hit-tracking key, so a hit on either is reported
  to the host as satisfying both, and the never-called check — the only thing
  asserting that an outbound call happened — goes inert for whichever the
  service skips. Measured against a route asserting an insert and the read that
  names the row it collided with: a read-first implementation that never
  attempts the insert passes.

  mockHitKey drops the method and CALL N for the HTTP channel while keeping
  them for the SQL channels, where the same collision was already fixed.
  Selection is unaffected — FindHTTPMockWithBody honours the method and
  consumes a mock once — so the proxy picks the right mock and runs the right
  VERIFY rules. Only the key crossing the sidecar collides, and SetHits then
  marks both mocks hit.

  The method and CALL N are folded into the HTTP key, as the write channels
  already do. Rejected: keying on the request's own URL as observed, which
  would make the key depend on a query string the matcher never sees and would
  break every expectation the moment a caller added a parameter. The same
  function runs proxy-side and host-side, so both must ship together — they do,
  since the proxy image is pinned to the binary's version, but a stale locally
  built linespec:latest is preferred over it and would disagree with the host,
  reporting every expectation as never called.
constraints:
    - Two HTTP expectations differing only in method are tracked as separate hits.
    - An HTTP expectation the service never called fails verification.
    - A hit recorded proxy-side is attributed host-side to the expectation that matched it.
    - HTTP mock selection continues to honour method, headers and body.
