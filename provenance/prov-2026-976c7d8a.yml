title: Fix MySQL CLIENT_QUERY_ATTRIBUTES parsing (P1-D)
status: implemented
created_at: "2026-03-31"
author: calebcowen@gmail.com
intent: "Fix the MySQL proxy's COM_QUERY handler to properly parse and strip MySQL 8.0.31+ CLIENT_QUERY_ATTRIBUTES framing bytes using correct length-encoded integer parsing, preventing silent query corruption when attributes are present or when queries legitimately start with a null byte."
constraints:
  - Must not break existing MySQL proxy behavior when CLIENT_QUERY_ATTRIBUTES is not negotiated
  - Fail-open on parse errors (use raw bytes rather than rejecting the query)
  - Must use existing go-mysql dependency utilities (LengthEncodedInt, SkipLengthEncodedString)
