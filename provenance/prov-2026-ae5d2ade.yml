id: prov-2026-ae5d2ade
title: Fix integer overflow in gRPC interceptor frame handling
status: open
created_at: "2026-04-23"
author: calebcowen@gmail.com
intent: >
  CodeQL flagged two integer overflow risks in pkg/proxy/grpc/interceptor.go.
  On 32-bit systems, casting uint32 to int truncates large values; on all
  platforms, 5+len(msg) can overflow int when msg is near max size, causing
  a panic in make(). Fix by comparing in uint32 space and capping msgLen.
constraints:
  - "No behavioral change for normal-sized messages"
affected_scope:
  - pkg/proxy/grpc/interceptor.go
