intent: >
  Prepare the v3.28.1 patch release. Bump 3.28.0 to 3.28.1 with ./scripts/bump-version.sh 3.28.1
  and add a 3.28.1 CHANGELOG section, dated 2026-10-21, for the only change since v3.28.0
  (PR #244, prov-2026-1e5cf179): the app container's port is now declared as exposed, so an
  image without EXPOSE gets a host port on daemons that publish only exposed ports (Docker
  28.0.4 on GitHub runners) and the wait for the host port no longer times out. This record
  creates no tag, push or release; the tag is created after the PR merges.
