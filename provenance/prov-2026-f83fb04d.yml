author: noreply@anthropic.com
intent: Add FindHTTPMockWithBody, FindGRPCMockWithBody, and FindKafkaMockWithBody to the registry.
  Each accepts a bodyMatch func(withFile, baseDir string) bool callback so the interceptor supplies
  the comparison logic (loading + CompareJSON) while the registry handles iteration and hit tracking.
  Mocks whose callback returns false are skipped; mocks with no WithFile always return true from
  the callback (match-any preserved).
