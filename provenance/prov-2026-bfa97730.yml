id: prov-2026-bfa97730
title: 'RECEIVE JOB: background job trigger channel'
status: implemented
created_at: "2026-05-14"
author: test@example.com
intent: |
  Add RECEIVE JOB as a new test trigger channel for background job systems. Tests seed the job
  payload into the service's backing queue at the wire protocol level — Redis BRPOP/LPOP/BLPOP,
  Kafka topic, or DB proxy mock rows — so the worker picks it up naturally. For cron/scheduled
  jobs, no seed is needed: the service's internal scheduler fires the job, and LineSpec observes
  the resulting interactions through the proxies.

  In all cases, EXPECT statements serve a dual role for worker tests: some mock the inputs the
  job reads (e.g., EXPECT READ:POSTGRESQL returns a pending record the worker processes), while
  others verify the outputs the job produces (writes, outbound HTTP calls, published events).
  Completion is detected when all EXPECTs are satisfied via the existing proxy polling loop —
  no service endpoint required, no modification to the service under test.

  Job backend is configured once in .linespec.yml; individual test files stay clean.
constraints:
  - RECEIVE JOB must work without any modification to the service under test
  - Redis-backed frameworks (Sidekiq, BullMQ, Resque, RQ, Asynq, Dramatiq) must work via seed
    injected at BRPOP/LPOP/BLPOP — the proxy returns the seeded payload on the worker's next
    blocking pop, wrapped as the correct RESP2 two-element array [key, value]
  - DB-backed frameworks (Oban, GoodJob, Que, River, Delayed Job, Solid Queue) must work via
    EXPECT READ on the DB proxy — worker's SELECT returns the mocked job row; no special seeding
    required beyond the standard EXPECT READ mock
  - Kafka-backed frameworks must work via the existing Kafka seed mechanism
  - Scheduled/cron jobs must work via observe-only mode (no seed, no trigger action) — the
    service's internal scheduler fires the job naturally; EXPECT READ mocks supply any input
    data the job reads, and EXPECT WRITE/HTTP/etc. verify what the job produces; the test uses
    a configurable TIMEOUT to allow the scheduler to fire; scheduler interval is controlled via
    env var in the test environment (standard practice, not a code change)
  - Job backend type and queue key configured once in .linespec.yml under a job_backend section;
    RECEIVE JOB tests do not embed infrastructure details
  - Completion detection must be purely proxy-based using the existing polling loop — no service
    status endpoint required
  - DSL follows existing channel patterns — RECEIVE JOB with optional TIMEOUT; WITH supplies
    the job payload for queue-backed triggers; scheduled/observe-only mode omits WITH
  - Example applications must cover three primary scenarios with working LineSpec tests
    against real containerized implementations — Go + Asynq (Redis-backed worker demonstrating
    the BRPOP seed mechanism), Node.js + BullMQ (Redis-backed worker demonstrating the same
    seed across a different framework and key convention), and a Go scheduled worker using an
    internal ticker that demonstrates observe-only mode with DB reads and outbound HTTP calls
  - LINESPEC.md must be updated with RECEIVE JOB DSL reference including all three modes
