id: prov-2026-bf080d28
title: 'LineSpec-Phoenix evidence integration: emit behavioral test results as Phoenix EvidenceRecords'
type: blueprint
status: open
created_at: "2026-04-29"
author: calebcowen@gmail.com
implements: prov-2026-e90eda10
intent: |
  When LineSpec tests run in a repository that also uses Phoenix VCS, the test
  results should be written as EvidenceRecord entries into Phoenix's evidence
  store (.phoenix/graphs/evidence.json) using a new LINESPEC_BEHAVIORAL_TEST
  evidence kind. This lets Phoenix policy evaluation treat passing LineSpec
  suites as behavioral proof for medium- and high-risk IUs.

  This blueprint covers the LineSpec side only: a new `pkg/phoenix/` package
  that locates and writes Phoenix evidence records, plus a `phoenix:` section
  in .linespec.yml holding the Phoenix root path and the developer-authored
  IU-to-spec mapping. After `linespec test` runs, if phoenix config is
  present, evidence records are written automatically for each mapped suite.

  The contract between the two tools (evidence kind string, record schema, and
  IU mapping shape) is defined here. Phoenix-side changes (adding the
  LINESPEC_BEHAVIORAL_TEST enum value and updating display rendering) are
  tracked in a separate blueprint in the Phoenix repository.

  Both tools remain independently usable. Absence of phoenix config in
  .linespec.yml is a no-op. Absence of LineSpec evidence in Phoenix produces
  INCOMPLETE verdict, not ERROR.
constraints:
  - >
    LineSpec must write evidence using Phoenix's existing EvidenceRecord JSON
    schema (evidence_id, kind, status, iu_id, canon_ids, artifact_hash,
    message, timestamp) — no custom fields, no schema changes to Phoenix's
    store format.
  - >
    The evidence kind string is "linespec_behavioral_test/v1". Any future
    breaking change to the record payload requires a new version suffix and a
    superseding blueprint.
  - >
    IU-to-spec mapping must be explicitly authored in .linespec.yml under a
    `phoenix.iu_mappings` list. LineSpec must never infer which IU a spec
    covers — missing mappings are silently skipped, not auto-populated.
  - >
    If the Phoenix root is absent or .phoenix/graphs/evidence.json cannot be
    written, LineSpec must log a warning and exit cleanly — it must not fail
    the test run or change the exit code.
  - >
    The `artifact_hash` field in each emitted EvidenceRecord must be the SHA-1
    of the .linespec file's content at run time, so Phoenix can detect staleness
    when the spec changes.
  - >
    canon_ids in emitted records must be set to an empty array — LineSpec has
    no knowledge of Phoenix canonical node IDs. Mapping is IU-level only.
affected_scope:
  - pkg/phoenix/**
  - pkg/config/**
  - cmd/linespec/main_beta.go
  - cmd/linespec/main_stable.go
  - examples/todo-phoenix/**
forbidden_scope: []
associated_specs:
  - path: cmd/linespec/main_beta.go
    type: code
    run_command: make test
  - path: pkg/phoenix/evidence_test.go
    type: code
    run_command: make test
associated_traces: []
monitors: []
tags:
  - phoenix
  - integration
  - evidence
  - behavioral-testing
