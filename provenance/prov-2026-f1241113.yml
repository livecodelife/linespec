id: prov-2026-f1241113
title: Migrate cmd/linespec CLI to a Cobra command tree
status: implemented
version: 3
reason: |-
  The v3.14.0 Release workflow failed at the GoReleaser step with
  "undefined: Node" from github.com/smacker/go-tree-sitter. Root cause is the
  same cgo dependency that prov-2026-80db53da fixed for Dockerfile.linespec:
  after the Cobra collapse the single cmd/linespec entrypoint imports
  pkg/discover unconditionally, which pulls in go-tree-sitter (a cgo package).
  .goreleaser.yml still builds every target (linux/windows/darwin x amd64/arm64)
  with CGO_ENABLED=0, so the pure-Go iter.go references Node — defined only in
  the cgo bindings — and the build fails. The Test job passed because it builds
  natively (cgo available on the runner); only GoReleaser's cross-compilation
  matrix breaks.

  Fix: cross-compile with cgo enabled using `zig cc` / `zig c++` as the
  per-target C/C++ cross-compiler. This keeps the full platform matrix and ships
  the discover feature in every prebuilt binary. tree-sitter is pure C (libc
  only, no platform frameworks), so zig cross-links it cleanly for each
  goos/goarch. Set CGO_ENABLED=1 and a templated per-target CC/CXX in both
  .goreleaser.yml builds, and install zig in the Release workflow before the
  GoReleaser step.
reason_kind: fix
created_at: "2026-06-22"
author: calebcowen@gmail.com
aliases:
  - prov-2026-80db53da
  - prov-2026-78af1526
intent: |
  Replace the hand-rolled os.Args/switch dispatch in cmd/linespec/ with a Cobra
  command tree, wrapping the existing handler functions as RunE callbacks without
  changing their logic. This makes the command/flag surface declarative so the
  full CLI reference can be auto-generated from the tree via cobra/doc and stop
  drifting from the code. Migrate incrementally, one command group at a time, with
  the provenance group migrated first as the validation milestone, and collapse the
  two build-tagged entrypoints (main_stable.go, main_beta.go) into a single tree.
constraints:
  - Command names, subcommand names, and flag names/shapes must stay byte-identical so git hooks, CI, make targets, and scripts that shell out to linespec keep passing. This covers every top-level command (init, clone, import, proxy, test, build, provenance) and every provenance subcommand (create, open, complete, lint, check, status, search, context, next, govern, graph, deprecate, audit, index, generate, sync, compile, publish, lock-scope, lock-layer, run-specs, discover, install-skills, install-plugin).
  - Preserve the -p alias for the provenance command and the global -d/--debug flag.
  - Handler functions and all of pkg/ business logic must remain unchanged — Cobra RunE wrappers only replace the arg/flag parsing front layer and call the existing handlers. The parseXOptions helpers may be reshaped into flag bindings but must produce identical option structs.
  - Replace the hand-rolled --help/-h and --version with Cobra's generated versions. The version command/flag must keep reading the main.version variable that goreleaser injects via -ldflags "-X main.version=..." (and may surface main.commit / main.date if present), so release builds still report the tag.
  - Collapse main_stable.go and main_beta.go into a single command tree. The unified tree must be a superset that preserves every command currently reachable in either entrypoint; reconcile the build-tag divergence (build/clone/import exist only in the stable entrypoint today) deliberately rather than silently dropping commands.
  - Migrate group by group. The provenance group lands first as the validation milestone; each subsequent group (test, proxy, build, init, clone, import) is its own imprint so regressions stay isolated.
  - Land separately from and after the docs-pipeline change (per the parent brief).
  - Adding Cobra (and its spf13/pflag dependency) to go.mod/go.sum is in scope; no other dependency or runtime behavior change is permitted.
  - The fix is confined to Dockerfile.linespec; no Go source or dependency change.
  - The produced binary must still run on the alpine:latest runtime stage (musl), so build the cgo binary against alpine's musl in the builder stage.
  - Drop `-tags beta` only after confirming no Go file still gates behavior on the beta build tag (verified — none remain).
  - Keep the existing platform/arch matrix (linux/windows/darwin x amd64/arm64, minus windows/arm64) and both the stable and beta build IDs.
  - Do not change cmd/linespec or pkg/discover; the fix is release-tooling only.
  - Pin the zig version in the workflow for reproducibility.
