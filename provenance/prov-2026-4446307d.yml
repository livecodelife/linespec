id: prov-2026-4446307d
title: Next.js + JavaScript/TypeScript support for discover
status: implemented
version: 4
reason: |-
  prov-2026-4446307d's constraint "MUST detect App Router route handlers (route.ts exporting
  GET/POST/PUT/PATCH/DELETE) and pages (page.tsx)" is not met yet. Verified against linq-lens
  (real Next.js 16 App Router repo): `discover --dir app --framework nextjs --dry-run`
  completes and prints "Scanned: app (nextjs/typescript)" but reports "0 route(s), 0 protocol
  boundary hit(s)" across all 38 grouped modules, even though real route handlers exist, e.g.:

    app/api/cron/ingest/route.ts:37   export async function GET(request: Request) {
    app/api/search/users/route.ts:20  export async function GET(request: Request) {
    app/auth/callback/route.ts:16     export async function GET(request: Request) {
    app/auth/signout/route.ts:6       export async function POST(request: Request) {

  Each of those files also exports unrelated route-segment config constants ahead of the
  handler (`export const dynamic = "force-dynamic"`, `export const runtime = "nodejs"`,
  `export const maxDuration = 300`) — plausible distractors if route detection is matching
  on "the file is named route.ts" without correctly isolating the exported
  GET/POST/PUT/PATCH/DELETE function declarations from those sibling exports.

  Because 0 routes are found, Phase 2 protocol boundary tracing and Phase 3 stub generation
  never have anything to run against either — the whole point of the Next.js framework
  description (route-driven discovery instead of directory-only grouping, per
  prov-2026-4446307d intent) is currently inert. Framework-agnostic mode was already
  fine before this blueprint; this bug is about the framework-driven path it added.
reason_kind: fix
created_at: "2026-09-22"
author: caleb.cowen@linq.com
aliases:
