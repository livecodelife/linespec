title: Fix PostgreSQL proxy binary encoding and extended query protocol for lib/pq
status: implemented
created_at: "2026-04-17"
author: calebcowen@gmail.com
intent: "Fix PostgreSQL proxy to correctly handle lib/pq's extended query protocol: extract
  per-column result format codes from Bind messages, encode UUID columns as binary (16 bytes),
  JSON-encode slice/map values for JSONB columns, generate proper RFC 4122 UUIDs for *_UUID
  interpolation variables, and use PostgreSQL wire timestamp format for text-mode timestamps."
constraints:
  - MUST NOT break existing example test suites (user, notification, order, multi-db)
  - MUST correctly handle binary UUID encoding for lib/pq extended query protocol
