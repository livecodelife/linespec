implements: prov-2026-92f06ee9
implements_repo: livecodelife-cli
implements_version: 1
intent: >
  Implement two new top-level commands — `linespec clone <manifest-url>` and
  `linespec import <manifest-url>` — that consume a published manifest to
  bootstrap or extend a governed repository. Clone creates a fully development-ready
  project (git init, hooks, .linespec.yml, layers extracted). Import pulls
  provenance records from a manifest into an existing repository. Both commands
  perform integrity verification (root_hash then per-layer hashes) before writing
  anything to disk, and abort cleanly on any mismatch.
constraints:
  - clone verifies root_hash against the concatenation of the resolved version's layer hashes before fetching any layer artifacts; aborts before fetching on mismatch
  - each layer artifact is hash-verified after download and before extraction; on mismatch, abort and report — no files are written to disk
  - cloned project setup runs git init, linespec provenance install-hooks, writes .linespec.yml with provenance.manifest_url set to the source manifest URL, and expands all layers to their correct paths
  - specs layer files are extracted to their preserved repo-relative paths without consulting provenance records
  - import aborts without writing if any local record ID already exists (no overwrite); conflict must be resolved manually
  - import runs linespec provenance lint after all records are written to surface reference issues
  - version pinning is supported via @version suffix in the URL and a --version flag; unpinned targets the latest field
  - packLayer must always produce a tar archive regardless of whether the input is a file or directory
  - all layer artifacts written by publish must have the .tar extension
  - the packed filename inside the tar for a single-file input must be the original filename (filepath.Base of the source path)
  - clone extraction behavior must remain unchanged — ExtractSpecs (extractTar) handles all non-provenance layers
  - existing unit tests for packLayer must be updated to reflect the new behavior
  - |
    Only strip a leading prefix when ALL entries in the tar share the same single top-level
    directory component. If entries have mixed top-level paths, extract without stripping.
  - |
    Provenance layer extraction must remain unchanged — provenance records are always flat
    <id>.yml entries with no leading directory prefix.
  - |
    If tar entries have no common top-level prefix (they start at root), extraction is unchanged.
  - |
    Existing tests for ExtractProvenance and extractTar must continue to pass. New tests must
    cover: stripping when all entries share a prefix, no-op when entries are already flat.
  - |
    The specs layer is extracted into a fixed linespecs/ subdirectory of the clone
    destination (created if absent), not into the destination root.
  - |
    Within linespecs/, the existing common-top-level-prefix stripping behavior is
    preserved so files do not end up double-nested (e.g. linespecs/linespec.manifest/...).
  - |
    Provenance layer extraction is unchanged — records continue to land flat in
    provenance/.
  - |
    The code and prompt layers continue to extract to the destination root; only the
    specs layer target changes.
  - |
    Tests must cover: specs layer lands under linespecs/ with prefix stripping applied,
    and provenance/code/prompt targets are unaffected.
affected_scope:
