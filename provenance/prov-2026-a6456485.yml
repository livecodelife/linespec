sealed_at_sha: 2f35f2551af87a2ce2bc0154902937262b1a4648
associated_specs:
  - path: cmd/linespec/main_stable.go
    type: code
    run_command: make test
  - path: Dockerfile.linespec
    type: docker
    run_command: docker build -f {{path}} -t linespec:verify .
  - path: cmd/linespec/build_test.go
    type: go_test
    run_command: go test ./cmd/linespec/... -run 'TestBuildDoesNotHardcodeCGODisabled|TestFindLinespecSourceRoot' -v
  - path: cmd/linespec/build_integration_test.go
    type: go_test
    run_command: go test -tags integration ./cmd/linespec/... -run TestDockerfileLinespecBuildsWithCGOAndRealVersion -v
