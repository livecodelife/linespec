id: prov-2026-a6456485
title: Fix linespec build cross-compile for non-Linux hosts
status: implemented
version: 2
reason: |-
  `linespec build` cannot build the linespec:latest Docker image. It fails
  during the host-side Linux cross-compile with a wall of
  "undefined: Node" errors out of go-tree-sitter, then reports
  "Failed to build a Linux binary for the Docker image: exit status 1".
  Reproduced on macOS/arm64 with the v3.17.0 Homebrew build and independently
  observed on a second machine.

  Root cause: goBuildForLinux (cmd/linespec/main_stable.go:512) and
  goInstallForLinux (main_stable.go:537) both hardcode CGO_ENABLED=0 in the
  cross-compile environment. That was correct when it was written
  (prov-2026-a6456485) because the binary was pure Go. v3.14.0 then added
  pkg/discover, which pulls in github.com/smacker/go-tree-sitter — a cgo
  package. With CGO_ENABLED=0 the build constraints exclude every cgo file in
  the tree-sitter grammar packages, including the one that defines the `Node`
  type, so the remaining pure-Go files (iter.go and friends) fail to compile.
  The Dockerfile already documents exactly this failure mode in a comment and
  avoids it by building inside the image with `apk add build-base` and
  CGO_ENABLED=1.

  The host-side cross-compile is now redundant work that only reintroduces the
  toolchain problem the Dockerfile already solved: Dockerfile.linespec does
  `COPY . .` and builds from source in a golang:1.23-alpine builder stage, so
  it never consumes the host-built binary for a source-directory build.
  Preferred fix is to drop the host-side Linux cross-compile from the
  source-directory path and let `docker build -f Dockerfile.linespec` do it,
  which is verified working: building the image directly produces a functional
  43MB image where the previous `linespec build` path produced nothing.

  Related smaller defect found while verifying: Dockerfile.linespec's
  `go build` passes no -ldflags, so the binary inside the image reports its
  version as "vdev" instead of the real version. Worth carrying the
  -X main.version ldflag into the image build in the same change.
reason_kind: fix
created_at: "2026-04-20"
author: calebcowen@gmail.com
aliases:
  - prov-2026-b9339a5a
intent: >
  The `linespec build` command copies the host binary into an Alpine Docker
  image. On macOS (darwin), the binary is Mach-O format; Linux containers
  require ELF format. The result is `exec format error` when the proxy
  sidecar starts, silently breaking all non-PostgreSQL proxy types (MySQL,
  MongoDB, Redis) because the proxy container exits immediately. The fix
  cross-compiles a Linux binary before building the Docker image when the
  host OS is not Linux, using `go build` with `GOOS=linux` from the source
  root. The source root is located by walking up from the current working
  directory then from the executable path, looking for a `go.mod` containing
  `module github.com/livecodelife/linespec`.
constraints:
  - On Linux hosts the current binary is used as-is — no cross-compile step
  - On non-Linux hosts a fresh `go build` with GOOS=linux GOARCH=<host-arch> is run; if no source root can be found the command exits with a clear error describing how to obtain a Linux binary
  - The cross-compiled binary is placed in the existing tmpDir alongside the Dockerfile so no additional temp directories are created
  - |
    `linespec build` run from a linespec source directory must produce a
    working linespec:latest image on a macOS host with Docker running, with no
    manual `docker build` fallback and no host C toolchain setup required.
  - |
    The cgo/tree-sitter dependency must be built with CGO_ENABLED=1 wherever
    the Linux binary is actually produced. If any host-side cross-compile path
    is kept, it must not hardcode CGO_ENABLED=0.
  - |
    The non-source-directory path (goInstallForLinux, used when `linespec
    build` runs outside a checkout) must either be fixed the same way or fail
    with a clear, actionable message instead of a tree-sitter compiler dump.
  - |
    The binary inside linespec:latest must report the real version via
    `--version`, not "vdev".
  - |
    No change to the image's runtime contract: same entrypoint
    (/app/linespec), same alpine base with ca-certificates and libstdc++, and
    the image must stay usable by the existing test runner.
affected_scope:
  - cmd/linespec/main_stable.go
  - provenance/prov-2026-0e5c82e4.yml
  - Dockerfile.linespec
  - cmd/linespec/build_test.go
  - cmd/linespec/build_integration_test.go
forbidden_scope: []
related:
