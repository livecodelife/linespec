id: prov-2026-3d5fb504
title: Add --llm-url flag for local LLM server support
status: implemented
created_at: "2026-06-12"
author: test@example.com
intent: |
  Adds --llm-url <base-url> flag to linespec provenance discover so users can
  point --enrich at a local LLM server (LMStudio, Ollama, etc.). The provider
  path is appended automatically: /v1/chat/completions for openai, /v1/messages
  for anthropic. Adds LLMBaseURL field to enrich.Input; Enrich() passes it
  through to EnrichWithBaseURL(). callOpenAI and callAnthropic now treat baseURL
  as a base and construct the full endpoint internally.
