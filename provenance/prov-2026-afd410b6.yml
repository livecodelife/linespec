id: prov-2026-afd410b6
title: discover hangs indefinitely scanning a real Next.js repo root
status: open
created_at: "2026-09-22"
author: caleb.cowen@linq.com
intent: |
  Verified against linq-lens, a real Next.js 16 App Router repo (~500 source files across
  app/, components/, lib/, scripts/, tests/, supabase/, data-fixes/, plus node_modules and
  a .next build dir): `discover --dry-run` at the repo root (framework auto-detected as
  nextjs/typescript, from prov-2026-4446307d) pegs one CPU core at ~100% for 3+ minutes with
  zero stdout/stderr output, even with --debug, before being killed. It never completes.

  Isolated with a binary built from the current source tree:
    - Every individual top-level source directory scanned alone completes in well under a
      minute: app/, components/, lib/ (including the 1499-line generated
      lib/supabase/database.types.ts), scripts/, tests/, supabase/, data-fixes/.
    - Forcing the framework and scoping to one directory (`--dir app --framework nextjs`)
      also completes quickly (and separately reports 0 routes — see prov-2026-ebc2266b).
    - node_modules and .next were moved out of the way entirely (`mv` aside, restored after)
      and the repo-root scan still hung — so this is not simply "too many files under an
      unexcluded dependency/build directory."

  So the hang is specific to running the framework-driven pipeline across the combined
  repo root with multiple top-level source directories present together — something that
  doesn't reproduce with any single directory in isolation. The exact mechanism (call-graph
  tracing, symbol/import cross-referencing, or record grouping) was not identified; this
  record documents the reproduction for whoever picks it up to profile.

  Root cause identified: pkg/discover/boundaries's Tracer.traceHandler has no memoization —
  callStack only guards against a genuine cycle within one DFS path, not against revisiting
  the same function from an unrelated sibling branch. JS/TS code routinely redefines short,
  common names (get, map, filter, parse, ...) across many unrelated files/classes, and
  findFuncBody matches by bare name only with no scoping, so at the default call-graph depth
  of 3 this becomes exponential: reproduced a multi-minute-plus hang with as few as 40
  synthetic files sharing 8 common names. This explains why single-directory runs never hit
  it (fewer files means far fewer name collisions to fan out across) and why moving
  node_modules/.next aside didn't help (the blowup is driven by the app's own source files'
  name collisions, not dependency/build volume). Fixed by memoizing each unscoped (function
  name, remaining depth) result the first time it's computed.
constraints:
  - MUST NOT hang or exhibit worse than roughly linear-in-file-count behavior when
    discover's framework-driven pipeline runs across a repo root containing multiple
    top-level source directories — reproduce against a multi-directory fixture, not only
    single-directory fixtures, since that is precisely what individual-directory testing
    missed here.
  - A CLI run that will take a long time SHOULD emit periodic progress output (even under
    plain, non-debug operation) so a hang is distinguishable from a slow-but-live scan;
    right now there is no way to tell the two apart from the outside.
  - Root-causing this MUST include a repro fixture shaped like linq-lens (several
    top-level source directories, a generated multi-hundred-line .ts file, real cross-file
    imports between them) — the existing associated_specs for prov-2026-4446307d and its
    imprints only exercise small/single-directory fixtures and did not catch this.
