id: prov-2026-da18cbfe
title: 'Phase 3: .linespec stub generation from routes and protocol boundaries'
status: implemented
created_at: "2026-06-04"
author: test@example.com
implements: prov-2026-0071506f
intent: |
  For each discovered route, combine its metadata with the traced protocol boundaries
  to generate a skeleton .linespec file. The stubs establish correct structure —
  which protocol interactions exist at each endpoint — without requiring complete
  detail. Engineers fill in matcher bodies and response shapes; they never start blank.

  Stub structure per route:
    - RECEIVE: from the route's HTTP method and path
    - HEADERS: inferred from middleware (e.g. auth middleware implies Authorization header)
    - EXPECT: one clause per protocol boundary hit, body left as # TODO
    - RESPOND: placeholder status code (200 for GET, 201 for POST/PUT, 204 for DELETE)

  Stubs are written to a configurable directory (default: specs/), named by route:
  specs/post_api_v1_users.linespec. Discover is additive: if a .linespec file already
  exists at the target path, it is skipped and reported in the summary.

  --dry-run mode prints what would be written without touching the filesystem.
  --format table|json controls dry-run output format.
constraints:
  - MUST generate valid .linespec DSL syntax for RECEIVE, HEADERS, EXPECT, and RESPOND clauses
  - MUST infer HEADERS from middleware analysis (auth middleware → Authorization header)
  - MUST produce one EXPECT clause per protocol boundary hit with # TODO body
  - MUST use conventional status codes (200 GET, 201 POST/PUT, 204 DELETE) as RESPOND defaults
  - MUST name stub files by route (post_api_v1_users.linespec from POST /api/v1/users)
  - MUST skip and report existing .linespec files; never overwrite
  - MUST support --dry-run mode that shows output without writing files
  - MUST support --format table|json for --dry-run output
affected_scope:
  - pkg/discover/stubs/**
