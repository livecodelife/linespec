id: prov-2026-f0384a57
title: Pass MySQL schema via file instead of --schema-data CLI arg to avoid ARG_MAX limit
status: implemented
created_at: "2026-04-20"
author: calebcowen@gmail.com
intent: >
  The MySQL proxy container was receiving the full base64-encoded database schema as a
  --schema-data CLI argument. On large schemas, this causes exec to fail with
  "argument list too long" (POSIX E2BIG / ARG_MAX). Fix by writing the schema JSON to
  a file in the per-test tempDir (already bind-mounted into the container) and passing
  the file path via --schema-file instead. The --schema-data flag is retained as a
  fallback for backward compatibility.
constraints:
  - The schema file must be written to r.tempDir so it is accessible via the existing
    registry mount (/app/registry by default) inside the proxy container.
  - The --schema-data fallback must remain functional for any callers not using the runner.
  - The fix must not change the schema content or how it is loaded by mysql.Proxy.
affected_scope:
  - pkg/runner/runner.go
  - cmd/linespec/main_stable.go
  - cmd/linespec/main_beta.go
