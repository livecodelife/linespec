id: prov-2026-82b2dee6
title: Release 3.19.0
status: implemented
created_at: "2026-08-21"
author: 305597777+agent-loops-boxd[bot]@users.noreply.github.com
intent: |
  Version bump and release artifacts for v3.19.0, bundling the work
  accumulated on main since v3.18.0 (prov-2026-eb1c8e81), plus keeping the
  docs and published doc site in parity with that functionality.

  Records completed since v3.18.0:
    - prov-2026-3ee1f3c3 (#200): `provenance run-specs`/`complete` invoked the
      runner once per associated_specs entry even when multiple entries
      resolved to the same effective command, paying redundant framework
      boot cost (measured ~1.7x on a 3-spec record) — fixed by grouping
      consecutive same-command entries into one invocation.
    - prov-2026-2f2bf9c3 (#201): record-internal paths (affected_scope,
      forbidden_scope, associated_specs) were resolved against the process
      cwd instead of the same base as provenance.dir, so linting from inside
      a subpackage reported phantom missing-file failures — fixed.
    - prov-2026-8d5c9376 (#202): `provenance complete` never actually ran a
      record's own associated_specs even with
      run_associated_specs_on_complete enabled — it only checked that each
      spec's path existed, so a failing proof command was reported as
      verified and the record sealed anyway — fixed to run specs and roll
      back on failure.
    - prov-2026-c65450b6 (#203): with write_restriction enabled, reconcile
      locked a nested package's own .linespec.yml — the file that turns the
      restriction on — even though the documented always-writable exemption
      should have covered it — fixed.
    - prov-2026-0f3c349b (#204, #208), with imprints prov-2026-9eefeb1b and
      prov-2026-e1c1aa88: `provenance index`/`search`/`audit`/`complete`
      hardcoded a 2048-dim embedding vector width, so `base_url` local
      embedders of any other width (e.g. nomic-embed-text-v1.5 at 768,
      bge-large at 1024) failed every store write/find — fixed by deriving
      the width from the first vector actually written and persisting it in
      the embeddings.bin header.
    - prov-2026-772101a3 (#207, #209): `Store.ReadAll` read each record ID
      with a single bufio.Reader.Read instead of io.ReadFull, so a record ID
      of different length than its neighbors (e.g. a disambiguating suffix)
      could trigger a short read that desynced parsing for every subsequent
      record in the file — fixed, and affected records no longer silently
      vanish from the indexing plan.
    - prov-2026-531a0e0b (#205, #210): follow-up to #188/prov-2026-57aff9e1 —
      `-c/--config` drove embedding settings but record discovery still used
      a mangled provenance.dir (filepath.Join silently concatenated an
      absolute dir onto configDir instead of replacing it), so indexing
      silently found zero records and reported success — fixed.

  Each record already updated the docs it touches directly, so this release's
  own doc work is the mechanical version bump plus a reconstructed CHANGELOG
  entry, not new feature documentation. The published site at linespec.dev is
  a gitignored build artifact regenerated by scripts/build-docs.sh on push to
  main, so there is nothing to commit for it directly — the release just
  needs the Markdown sources it renders from to be accurate and
  version-pinned.
constraints:
  - |
    Promote [Unreleased] in CHANGELOG.md to [3.19.0] - 2026-08-21; add a
    fresh empty [Unreleased] section above it. The existing [Unreleased]
    section already documents the embedding-width fix
    (prov-2026-0f3c349b); the remaining six records (plus imprints)
    completed since v3.18.0 need to be reconstructed into it as well.
  - ./scripts/bump-version.sh 3.19.0 handles VERSION and the doc version pins
    (README.md, LINESPEC.md, PROVENANCE_RECORDS.md).
  - Run ./linespec provenance compile to rebuild the hash manifest.
  - docs/*.html and llms*.txt are gitignored build artifacts and are NOT part
    of the release commit; the Pages workflow rebuilds them on push to main.
    Do not hand-edit them.
  - No functional/behavioral changes in this record — it is a release/version
    bump only. Any doc content beyond version pins and the changelog belongs
    to the individual feature/bug records already implemented, not here.
