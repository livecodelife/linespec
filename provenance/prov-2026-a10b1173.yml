id: prov-2026-a10b1173
title: Fix ReadAll short-read desync and Index silent-skip masking
status: open
created_at: "2026-08-21"
author: 305597777+agent-loops-boxd[bot]@users.noreply.github.com
intent: >
  Implementation note for bug fix prov-2026-772101a3 (linked via related,
  since imprint records may only implement a blueprint; this imprint
  implements the blueprint prov-2026-7136e8c4 that the bug extends).
  Two fixes: (1) pkg/embeddings/store.go's Store.ReadAll now uses io.ReadFull
  instead of a single bufio.Reader.Read call to consume each record ID, since
  Read only guarantees 1..len(idBytes) bytes and a short read silently desyncs
  every subsequent record. (2) pkg/provenance/commands.go's Commands.Index no
  longer `continue`s (dropping the record from toIndex) when store.Exists
  returns a real, non-os.IsNotExist error; it now falls through and adds the
  record to toIndex so it is retried and, if the store is still wedged,
  surfaced as a counted failure via the existing failCount path instead of
  vanishing from the plan and letting the run report false completion.
  Verified both fixes independently: reverting each one in isolation makes
  its corresponding new test fail (a 200-record round-trip test in
  pkg/embeddings/index_wedge_test.go sweeping the suffixed-ID position across
  the corpus, and a Commands.Index test in pkg/provenance/index_test.go using
  a fake OpenAI-compatible httptest server plus a deliberately wedged
  embeddings.bin).
constraints:
  - Store.ReadAll must fully consume each record ID via io.ReadFull regardless of length or buffer boundary.
  - Commands.Index must not silently exclude a record from toIndex when its Exists check errors with something other than file-not-found.
