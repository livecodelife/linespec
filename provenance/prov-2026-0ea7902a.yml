id: prov-2026-0ea7902a
title: One SQL analysis layer, and it knows Oracle
status: open
created_at: "2026-09-03"
author: caleb.cowen@linq.com
intent: |
  Move the SQL reading that backs semantic matching - the operation, the tables,
  the WHERE columns and values, the written values - out of the MySQL and
  PostgreSQL proxies into one pkg/sqlanalysis, parameterised by dialect, and add
  Oracle as a third dialect.

  Today each proxy carries its own copy and the two have drifted. PostgreSQL
  captures a dotted table prefix and resolves $N against the bind list; MySQL
  matches only \w so its own table-prefix strip can never fire, and it reports a
  bound value as the literal string PRESENT. MySQL slices the query at " WHERE "
  and stops at the first trailing clause; PostgreSQL regexes the whole statement.
  None of that is a considered difference between the two databases - it is two
  implementations of one idea, and a third copy is what adding a dialect would
  otherwise mean.

  What actually varies by database is small and belongs in a Dialect: how a bind
  variable is spelled ($1, ?, :name), how an identifier is quoted, and whether a
  table may carry a schema. Everything above that is already shared, which
  matchesSemanticConstraints demonstrates - it takes extracted structures and no
  SQL at all.

  Oracle earns the third dialect because both of its differences defeat the
  existing patterns outright rather than degrading gracefully. Binds are named,
  so every positional branch misses and WHERE columns come back empty; tables are
  schema-qualified, so an INSERT INTO is not recognised as an INSERT into
  anything. Both failures are silent - a spec asserting VERIFY_WHERE_COLUMNS
  against an Oracle query today has nothing to compare and does not say so.

  Transport is deliberately out of scope. A proxy that can sit in front of an
  Oracle listener has to speak TNS, which is its own record; this is the layer
  underneath it, and doing it first makes that record a protocol job rather than
  a protocol job plus a third parser.
constraints:
  - The two existing dialects keep their current observable behaviour; the full unit suite passes unchanged.
  - A dialect carries bind syntax, identifier quoting and schema qualification only. Anything else two proxies disagree about is drift to be resolved, not a dialect field.
  - matchesSemanticConstraints is untouched - it already takes extracted structures and no SQL.
  - No TNS, no proxy, no transport, no new channel and no new config value.
  - Both proxies delegate; neither keeps a private copy, or the drift this removes comes straight back.
affected_scope:
  - pkg/sqlanalysis/**
  - pkg/proxy/mysql/proxy.go
  - pkg/proxy/postgresql/proxy.go
  - CHANGELOG.md
forbidden_scope: []
type: blueprint
