id: prov-2026-eb1c8e81
title: Release 3.18.0
status: implemented
created_at: "2026-08-19"
author: 305597777+agent-loops-boxd[bot]@users.noreply.github.com
intent: |
  Version bump and release artifacts for v3.18.0, bundling the work
  accumulated on main since v3.17.0 (prov-2026-0cc0b3cc), plus keeping the
  docs and published doc site in parity with that functionality.

  Records completed since v3.17.0:
    - prov-2026-f65bb92d (#183), with imprints prov-2026-dab5d51e and
      prov-2026-40232f86: `provenance check` reported false forbidden-scope
      violations against linespec's own completion and imprint-creation
      commits — fixed.
    - prov-2026-105f014e (#180): `provenance compile` sealed draft, open, and
      shared-repo records despite being documented as an idempotent recovery
      tool — fixed.
    - prov-2026-b9339a5a (#182): `linespec build` failed to cross-compile the
      Linux binary for the Docker image ("undefined: Node" from
      go-tree-sitter) since CGO_ENABLED=0 broke cgo-dependent parsing — fixed.
    - prov-2026-a0b6be6b (#181): removed the tracked 22MB linespec-beta binary
      (nothing consumed it) and gitignored the path.
    - prov-2026-4ea65be4 (#186), implemented together with three imprints on
      the long-running LineSpec Testing design record prov-2026-001
      (prov-2026-1f879f10, prov-2026-5dbd0ace, prov-2026-e85fd661): EXPECT
      matching was never satisfied when two proxied databases both declared a
      table with the same name — fixed by adding a `DATABASE` EXPECT clause,
      making trailing-clause parsing order-independent, and wiring logical
      database identity through the PostgreSQL/MySQL proxies (#187).
    - prov-2026-f05161eb, with imprints prov-2026-f857109e and
      prov-2026-3111394d: restored the linespec.dev content-page styling that
      silently broke when the site moved to a from-source pandoc render
      (#184).
    - prov-2026-57aff9e1 (#189), with imprint prov-2026-684303c3: the OpenAI
      embedding provider hardcoded api.openai.com and ignored -c/--config —
      fixed by adding EmbeddingConfig.BaseURL, strict embedding-key
      validation (catching silent config loss from a key typo), and
      threading -c through the embedder.

  Each record already updated the docs it touches directly, so this release's
  own doc work is the mechanical version bump plus a reconstructed CHANGELOG
  entry, not new feature documentation. The published site at linespec.dev is
  a gitignored build artifact regenerated by scripts/build-docs.sh on push to
  main, so there is nothing to commit for it directly — the release just
  needs the Markdown sources it renders from to be accurate and
  version-pinned.
constraints:
  - |
    Promote [Unreleased] in CHANGELOG.md to [3.18.0] - 2026-08-19; add a
    fresh empty [Unreleased] section above it. The [Unreleased] section is
    currently empty, so the changelog for this release is reconstructed from
    the eight records (plus imprints) completed since v3.17.0 listed above.
  - ./scripts/bump-version.sh 3.18.0 handles VERSION and the doc version pins
    (README.md, LINESPEC.md, PROVENANCE_RECORDS.md).
  - Run ./linespec provenance compile to rebuild the hash manifest.
  - docs/*.html and llms*.txt are gitignored build artifacts and are NOT part
    of the release commit; the Pages workflow rebuilds them on push to main.
    Do not hand-edit them.
  - No functional/behavioral changes in this record — it is a release/version
    bump only. Any doc content beyond version pins and the changelog belongs
    to the individual feature/bug records already implemented, not here.
  - prov-2026-850f03a4 is a deprecated, erroneous duplicate record (its real
    work landed under prov-2026-a0b6be6b) and must not be cited in the
    changelog.
affected_scope:
  - CHANGELOG.md
