id: prov-2026-eb7dd809
title: Rewrite index-provenance workflow for direct-push
status: open
created_at: "2026-06-11"
author: test@example.com
intent: |
  Rewrote .github/workflows/index-provenance.yml:
    - Replaced the create-branch / PR / self-approve / merge block with a
      direct commit + push to main using the App token:
      `git push https://x-access-token:$APP_TOKEN@github.com/$GITHUB_REPOSITORY HEAD:main`.
      The linespec-merge-bot App is a ruleset bypass actor, so this needs no PR
      or review. Kept the no-change short-circuit (no empty commits) and the
      `[skip ci]` marker.
    - Fixed the "Check for unindexed records" step: wrapped the dry-run in
      `set +e`/`set -e` so a non-zero exit (Voyage rate limits/errors) warns
      instead of killing the job.
    - Pinned Go via `go-version-file: go.mod` (was hardcoded 1.21).
    - Bumped Node20-deprecated actions: checkout@v4->v5, setup-go@v5->v6,
      create-github-app-token@v1->v2.
    - Dropped the now-unused `pull-requests: write` permission.

  Decision: push HEAD:main from the detached-HEAD checkout (fast-forward).
  Acceptable since embeddings runs are short and serial; a rare race just
  fails the push and the next provenance push re-indexes.
