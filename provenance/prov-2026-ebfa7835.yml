intent: "Fix the HTTP proxy interceptor to infer Content-Type from payload file extension
  instead of always returning application/json. Also fix the runner's trigger request
  to use the correct content type. Add RESPONSE_HEADERS DSL support on EXPECT blocks
  and HEADERS support on RESPOND blocks for explicit override. This is P2-G from
  IMPROVEMENT_PLAN.md."
