  placement. The prose says it "may appear anywhere before RECEIVE" and the example
  shows it before RECEIVE. The parser requires TIMEOUT to appear after RECEIVE and
  before any EXPECT blocks. Fix the prose and the example to match the actual parser
  behavior.
