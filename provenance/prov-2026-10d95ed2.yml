implements: prov-2026-dac81a68
intent: >
  Remove omitempty from ManifestLayer.URL so the field always appears in the
  serialized manifest JSON with an empty string value, making it explicit to the
  author that the URL needs to be filled in after uploading the artifact.
constraints:
  - ManifestLayer.URL json tag changes from "url,omitempty" to "url".
