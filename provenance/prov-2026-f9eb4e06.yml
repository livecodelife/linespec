id: prov-2026-f9eb4e06
title: Add Redis caching and gRPC client to notification-service example
status: implemented
created_at: "2026-04-07"
author: calebcowen@gmail.com
intent: "Demonstrate the gRPC and Redis proxy support added in P3-E by extending the notification-service example. Adds Redis auth-token caching (check cache before calling user-service HTTP) and a gRPC+JSON client for user lookup in the Kafka consumer. Also fixes a bug in the Redis interceptor's encodePayload where JSON objects were incorrectly serialized as RESP2 flat arrays instead of bulk strings."
constraints:
  - "Use conventional Python patterns (redis-py, httpx HTTP/2 for gRPC+JSON)"
  - "Redis cache key pattern: auth:cache:<token> with 300s TTL"
  - "gRPC client targets GRPC:users.UserService/GetUser with JSON body {user_id: N}"
  - "All existing notification-service linespecs must continue to pass"
  - "All make test and make test-quick unit tests must pass"
