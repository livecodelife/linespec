id: prov-2026-9e052576
title: Add request body comparison via WITH statements for HTTP, gRPC, and Kafka EXPECT blocks
status: implemented
version: 2
reason: |-
  The WITH body matching feature introduced in prov-2026-9e052576 is silently broken for
  gRPC services that use the standard binary protobuf encoding (Content-Type application/grpc).

  In pkg/proxy/grpc/interceptor.go, after stripping the 5-byte framing header, the interceptor
  calls json.Unmarshal directly on the raw message bytes. For binary protobuf these bytes are
  not valid JSON, so Unmarshal returns an error, bodyMatcher returns false, and the mock is
  never matched -- with no indication to the test author that anything went wrong.

  The original blueprint's constraint ("Non-JSON request bodies are not supported in this
  iteration") intentionally deferred this. In practice it means EXPECT GRPC:Service/Method
  WITH {{file}} is silently useless for any service that does not use application/grpc+json,
  which is the uncommon encoding.

  The fix must decode binary protobuf request bodies to JSON before comparison. The gRPC proxy
  already has a descriptor abstraction (pkg/proxy/grpc/descriptor.go) used for response
  conversion (JSON to Protobuf); the same descriptor should be used in reverse to convert
  incoming request bodies (Protobuf to JSON) so the existing CompareJSON path can be used.
  When no descriptor is available for a binary protobuf request with a WITH file, the
  interceptor must surface a clear diagnostic error rather than silently returning false.
reason_kind: fix
created_at: "2026-04-26"
author: noreply@anthropic.com
aliases:
  - prov-2026-ad235109
intent: |
  When a service under test makes an outbound HTTP, gRPC, or Kafka call, the test author should be
  able to assert that the request body (or message value) matches an expected payload defined in a
  WITH file. This is analogous to how database EXPECTs use VERIFY_WRITTEN_VALUES to validate what
  values the service wrote.

  Currently, HTTP mocks match on URL + method + headers; gRPC mocks match on service + method only;
  Kafka mocks match on topic name only. None of them compare the request body against the WITH file.

  After this change:
  - EXPECT HTTP:METHOD /path WITH {{file}} will verify the outbound HTTP request body matches the file.
  - EXPECT GRPC:Service/Method WITH {{file}} will verify the outbound gRPC request body matches the file.
  - EXPECT EVENT:topic WITH {{file}} will verify the Kafka Produce message value matches the file.

  The WITH file acts as a discriminator: if multiple mocks share the same URL/service/topic, the one
  whose WITH file matches the actual request body is selected. Mocks without a WITH file continue to
  match any request body (existing behavior preserved).

  Comparison uses deep JSON subset matching: all fields in the expected payload must be present in
  the actual body with matching values; extra fields in the actual are ignored.
constraints:
  - Body comparison must be opt-in via WITH file presence; omitting WITH preserves existing match-any behavior.
  - Comparison is deep JSON subset where expected is a subset of actual. Non-JSON request bodies are not supported in this iteration.
  - Body matching must participate in mock disambiguation — a mock with a mismatching WITH body is skipped rather than producing a hard error at the registry level.
  - A shared CompareJSON utility must be used by all three proxies to avoid logic duplication.
  - The Kafka interceptor must gain resolver support via SetResolver so WITH files can use ${VAR} substitution, consistent with HTTP and gRPC interceptors.
  - All existing proxy tests must continue to pass unmodified.
  - The cmd/linespec/main_beta.go Kafka wiring must call SetResolver so variable substitution works in production.
  - Binary protobuf request bodies must be decoded to JSON using the registered descriptor before CompareJSON is called.
  - 'If no descriptor is registered and the request body is binary protobuf, bodyMatcher must log a clear diagnostic (e.g. "WITH body match: binary protobuf requires a descriptor; set descriptor_path in .linespec.yml") rather than silently returning false.'
  - application/grpc+json requests must continue to work via the existing json.Unmarshal path with no behavioral change.
  - The Content-Type header must be used to detect encoding; do not attempt heuristic detection of binary vs JSON payloads.
