id: prov-2026-9ea7c935
title: Downgrade missing-file errors to warnings for implemented records
status: draft
created_at: "2026-05-14"
author: test@example.com
intent: |
  Any file path resolved by the linter — in associated_specs, affected_scope, or
  forbidden_scope — currently produces a SeverityError when the file does not exist,
  regardless of the record's status. For terminal-state records (implemented, superseded,
  deprecated) this is too aggressive: once sealed, files may legitimately be renamed,
  moved, or deleted as the codebase evolves. The linter should downgrade all
  missing-or-inaccessible file path issues to SeverityWarning for terminal-state records.

  Affected checks in pkg/provenance/linter.go:
  - validateAssociatedSpecs(): currently errors on missing proof artifacts for all records;
    must emit warnings instead for terminal-state records.
  - validateScopePaths() / validateExactPath() / validateGlobPattern() / validateRegexPattern():
    currently skipped entirely for non-open records; for terminal-state records these should
    run but emit warnings, not errors, when paths resolve to nothing.

  The dead-record check (checkDeadRecords) is unaffected — it already emits a warning
  when ALL governed scope files are gone and that behavior must not change.
  Open and draft records retain the current error behavior for all path checks.
constraints:
  - "For implemented, superseded, and deprecated records: any file path that does not exist or cannot be accessed (associated_specs, affected_scope, forbidden_scope) must produce SeverityWarning, not SeverityError."
  - Open and draft records must continue to produce SeverityError for missing or inaccessible paths.
  - "validateScopePaths() must run for terminal-state records (currently skipped), but emit warnings rather than errors when paths are missing."
  - The dead-record check (all governed files gone) must remain unchanged.
  - Existing unit tests must be updated or extended to cover the new per-status severity behavior for all path check types.
affected_scope:
  - pkg/provenance/linter.go
  - pkg/provenance/linter_test.go
forbidden_scope: []
