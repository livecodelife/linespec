id: prov-2026-d3b3320b
title: Remove size arithmetic from PostgreSQL message allocations flagged by CodeQL
status: open
created_at: "2026-10-12"
author: caleb.cowen@linq.com
intent: >
  The CodeQL rerun on PR 238 reported five more go/allocation-size-overflow alerts in
  pkg/proxy/postgresql: CreateMessage and forwardMessage size a buffer from len(payload)+5,
  buildParameterDescription and buildParameterDescriptionFromOIDs size one from 2+n*4,
  and the two RowDescription builders size one from len(columns)*20. Remove the size
  arithmetic (fixed small capacity or appends) so the alerts clear, with identical bytes
  on the wire.
constraints:
  - CreateMessage, forwardMessage and the RowDescription builders allocate a fixed small capacity and grow by append
  - ParameterDescription builders allocate without multiplying a caller-controlled count
  - Wire bytes are unchanged for every input
  - No other files change
affected_scope:
  - pkg/proxy/postgresql/protocol.go
  - pkg/proxy/postgresql/proxy.go
  - pkg/proxy/postgresql/result.go
forbidden_scope: []
type: bug
extends: prov-2026-001
related:
  - prov-2026-d522054c
supersedes: ""
superseded_by: ""
sealed_at_sha: ""
associated_specs:
  - path: pkg/proxy/postgresql/result_encoding_test.go
    type: unit
    run_command: go test -count=1 ./$(dirname {{path}})
associated_traces: []
monitors: []
tags:
