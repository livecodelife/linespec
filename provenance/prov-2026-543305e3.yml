id: prov-2026-543305e3
title: Fix create_user_already_exists linespec to match actual service SQL
status: superseded
created_at: "2026-04-16"
author: calebcowen@gmail.com
intent: |
  The create_user_already_exists linespec used USING_SQL with
  "SELECT users.* FROM..." but the service actually issues
  "SELECT 1 AS one FROM..." (an existence check). With USING_SQL now
  doing exact-match only, the mock no longer matched and the test
  returned 201 instead of 409. Switch to USING_SQL_CONTAINS with the
  WHERE clause fragment, which matches regardless of the SELECT columns.
constraints:
  - Use USING_SQL_CONTAINS for the email lookup to be resilient to ORM column differences
affected_scope:
  - examples/user-linespecs/create_user_already_exists.linespec
  - provenance/prov-2026-fe2348ba.yml
associated_specs:
