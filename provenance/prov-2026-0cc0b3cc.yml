id: prov-2026-0cc0b3cc
title: Release 3.17.0
status: draft
created_at: "2026-08-12"
author: 305597777+agent-loops-boxd[bot]@users.noreply.github.com
intent: |
  Version bump and release artifacts for v3.17.0, bundling the work
  accumulated on main since v3.16.0, plus keeping the docs and published doc
  site in parity with that functionality.

  Records completed since v3.16.0 (prov-2026-ab7e9d87):
    - prov-2026-3687be46 (#166): hash_manifest.json conflicts on every rebase,
      no merge strategy resolves it safely — fixed.
    - prov-2026-28061661 (#162): semantic expectation clauses (VERIFY_*,
      READ/WRITE) parsed but never asserted — now enforced.
    - prov-2026-a0bac0d9 (#158): PostgreSQL async/JOB expectations never
      marked satisfied, mocked result sets sent with OID 0 — fixed.
    - prov-2026-c1515def / prov-2026-93bcd5b8 (#150): new `write_restriction`
      config to fully disable the filesystem write-permission projection.
    - prov-2026-f011d231: Quick Start expanded with init, install-hooks, and
      Claude Code install commands.
    - prov-2026-3486daec (#147): `discover` framework-detected path skipped
      non-route directories, generating far fewer blueprints than expected —
      fixed.

  Each record already updated the docs it touches directly (e.g.
  PROVENANCE_RECORDS.md for write_restriction, README.md for Quick Start), so
  this release's own doc work is the mechanical version bump plus a
  reconstructed CHANGELOG entry, not new feature documentation. The published
  site at linespec.dev is a gitignored build artifact regenerated by
  scripts/build-docs.sh on push to main, so there is nothing to commit for it
  directly — the release just needs the Markdown sources it renders from to be
  accurate and version-pinned.
constraints:
  - |
    Promote [Unreleased] in CHANGELOG.md to [3.17.0] - 2026-08-12; add a fresh
    empty [Unreleased] section above it. The [Unreleased] section is currently
    empty, so the changelog for this release is reconstructed from the seven
    records completed since v3.16.0 listed above.
  - ./scripts/bump-version.sh 3.17.0 handles VERSION and the doc version pins
    (README.md, LINESPEC.md, PROVENANCE_RECORDS.md).
  - Run ./linespec provenance compile to rebuild the hash manifest.
  - docs/*.html and llms*.txt are gitignored build artifacts and are NOT part
    of the release commit; the Pages workflow rebuilds them on push to main.
    Do not hand-edit them.
  - No functional/behavioral changes in this record — it is a release/version
    bump only. Any doc content beyond version pins and the changelog belongs
    to the individual feature/bug records already implemented, not here.
affected_scope:
  - CHANGELOG.md
  - VERSION
  - README.md
  - LINESPEC.md
  - PROVENANCE_RECORDS.md
  - .linespec/hash_manifest.json
