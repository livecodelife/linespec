id: prov-2026-758af159
title: Enforce EXPECT_NOT negative expectations (P1-A)
status: implemented
version: 2
reason: 'Two defects introduced alongside the EXPECT_NOT feature (prov-2026-758af159): (1) The lexer regex for EXPECT_NOT uses `EXPECT\s+NOT` (space separator) while the documented syntax and all new spec files use `EXPECT_NOT` (underscore). The fix accepts both forms so existing specs using the space variant continue to work. (2) Test spec names containing spaces (e.g. `TEST create record success`) are passed verbatim into Docker container name templates, producing names that Docker rejects. The fix sanitizes spec names by replacing spaces with hyphens before substitution. A unit test and an example linespec are added to prevent regressions on both fixes.'
reason_kind: fix
created_at: "2026-03-31"
author: calebcowen@gmail.com
aliases:
  - prov-2026-f5c528ac
intent: "Fix EXPECT_NOT enforcement: negative expectations are currently parsed and registered but FindMock/FindHTTPMock/PeekMock do not skip them, allowing them to be matched as interceptors. Add CheckNegativeMocks/CheckNegativeHTTPMocks functions so proxies can track when requests match negative expectations without serving them as mock responses. VerifyAll already checks the Negative flag correctly."
constraints:
  - Must not break existing positive mock matching behavior
  - Negative mocks must never be returned by Find/Peek functions
  - Hit counters for negative mocks must still be incremented when matching requests arrive
  - Lexer regex updated to accept both EXPECT_NOT (underscore) and EXPECT NOT (space); existing specs must not break.
  - sanitizeContainerName replaces spaces with hyphens and strips other invalid Docker name characters; applied both in substituteTemplate and in runner.go hardcoded container names (PostgreSQL, MongoDB).
  - Unit test covers TokenExpectNot for both the underscore and space forms.
  - New example linespec in an existing suite uses EXPECT_NOT (underscore) to provide integration-level coverage.
  - Version bumped to v3.3.1; CHANGELOG entry added.
