id: prov-2026-f011d231
title: Expand Quick Start with init and Claude Code install commands
status: open
created_at: "2026-07-22"
author: calebcowen@gmail.com
intent: >
  The Quick Start on the docs site (rendered from PROVENANCE_RECORDS.md) currently
  jumps straight from install to `create`/`lint`/`graph`, skipping the setup steps a
  first-time user actually needs: `linespec init` (create `.linespec.yml`),
  `provenance install-hooks` (commit-time enforcement), and the Claude Code
  onboarding commands `provenance install-skills` and `provenance install-plugin`.
  Expand the Quick Start so someone trying provenance records for the first time has
  a copy-pasteable path from zero to a governed, agent-ready repo — without hunting
  through the Installation and Install sections further down the page.
constraints:
  - Markdown is the single source of truth; edit PROVENANCE_RECORDS.md only, never the
    generated docs/*.html or docs/llms*.txt artifacts.
  - Keep the version-pinned go install line consistent with the existing VERSION
    (v3.16.0) so the bump-version script continues to update it.
  - Only document commands that exist and behave as described (init, install-hooks,
    install-skills, install-plugin); note that `init` is interactive.
  - Do not remove the existing create/lint/graph example; augment the flow around it.
affected_scope:
  - PROVENANCE_RECORDS.md
