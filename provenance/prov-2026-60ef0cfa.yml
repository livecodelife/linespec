id: prov-2026-60ef0cfa
title: 'Blueprint: Hash-based integrity for implemented provenance records'
status: implemented
version: 3
reason: |-
  The complete command calls SealRecord to write the correct hash of the newly-implemented
  record to the hash manifest on disk, but CommitRecord only stages the record YAML file.
  The manifest update is left unstaged, so the committed manifest always has a stale hash
  for the just-completed record. PROV-IMM then fires in CI because the stored hash (from
  the last explicit compile run) does not match the current file content (which was modified
  by complete). The fix makes CommitRecord variadic and passes the manifest path alongside
  the record file in the Complete command's auto-commit.
reason_kind: fix
created_at: "2026-05-05"
author: calebcowen@gmail.com
aliases:
  - prov-2026-98b8bd73
  - prov-2026-077a7629
intent: >
  Implement the hash-based provenance integrity system described in the parent
  brief. This blueprint covers three concrete deliverables: a Hasher type that
  owns the hash manifest (.linespec/hash_manifest.json), content hash computation
  using SHA-256 over a canonical YAML serialization of each record's fields,
  and a real validateImmutability check in the Linter that compares live hashes
  against the manifest without calling git. The Complete() command is extended
  to seal a content hash into the manifest at transition time, and the manifest
  also tracks a full-graph hash and an active-subset hash updated on every seal.
constraints:
  - Hash manifest is stored at .linespec/hash_manifest.json, separate from record YAML files
  - Content hash uses SHA-256 over yaml.Marshal output with FilePath cleared
  - validateImmutability is implemented without any git calls
  - Complete() writes the per-record hash and recomputes graph hashes on every seal
  - If the manifest is absent, validateImmutability emits warnings rather than errors
  - Full-graph hash covers all records sorted by ID; active-subset excludes superseded and deprecated
  - CommitRecord signature must become variadic (message string, filePaths ...string) to avoid breaking Open and Deprecate callers
  - Complete must include the manifest path in the commit only when a manifest exists (ManifestExists check)
  - make test must pass
