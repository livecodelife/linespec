id: prov-2026-01d63a42
title: 'Add todo-phoenix example: demonstrate LineSpec-Phoenix evidence integration'
status: draft
created_at: "2026-04-29"
author: calebcowen@gmail.com
type: imprint
implements: prov-2026-bf080d28
intent: |
  Add a complete todo app example (examples/todo-phoenix/) that demonstrates
  LineSpec behavioral testing with Phoenix evidence emission. The app is a
  Hono/TypeScript REST API backed by SQLite, authenticated via a mock external
  user service. After running `linespec test examples/todo-phoenix/`, the
  .phoenix/graphs/evidence.json file is populated with EvidenceRecords for
  the 4 mapped IUs: create_todo, list_todos, update_todo, delete_todo.
constraints:
  - All 8 test files must pass with the built linespec binary
  - Evidence JSON must be written with correct IU IDs and PASS status
  - The example must not require any service changes to run — it uses the .linespec.yml IU mappings
affected_scope:
  - examples/todo-phoenix/**
