id: prov-2026-59110ab7
title: 'Fix variable consistency: pre-scan payloads and rebuild resolver on hot-reload'
status: open
created_at: "2026-04-16"
author: calebcowen@gmail.com
intent: "Ensure that ${VAR} tokens in RETURNS and RESPOND payload files always resolve
  to the same value across the runner and all proxy containers. Two bugs caused mismatches:
  (1) variables that appeared only in payload files (never in DSL fields like USING_SQL
  or HEADERS) were never pre-generated before the variable map was serialized into the
  registry, so proxy containers and the runner independently generated different random
  values for the same variable; (2) when proxy containers were reused across tests via
  /reload-registry, the resolver was not rebuilt from the new registry, so containers
  kept resolving variables with stale values from the first test they served."
constraints:
  - Before calling registry.SetVariables, the runner must scan all payload files referenced
    by the spec (Receive.WithFile, all Expects ReturnsFile and WithFile, Respond.WithFile)
    and call resolver.Resolve for each variable found, ensuring values are pre-generated
    and included in the serialized variable map
  - The /reload-registry handler must rebuild the resolver in-place (updating Variables
    and clearing Generated) from the new registry's variables after every hot-reload
  - Both main_stable.go and main_beta.go must have identical resolver wiring — resolver
    initialization from registry variables, SetResolver on all proxy types, and resolver
    rebuild on /reload-registry
  - All existing example suites must continue to pass
affected_scope:
  - pkg/runner/runner.go
  - cmd/linespec/main_stable.go
  - cmd/linespec/main_beta.go
forbidden_scope: []
