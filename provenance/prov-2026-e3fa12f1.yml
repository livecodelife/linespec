intent: |
  Version bump and release artifacts for v3.11.4. Patch release containing two bug fixes:
  1. pgProxy.ResetConnections() was never called from the /reload-registry handler despite
     a comment saying it would be, causing stale PostgreSQL connections across test runs.
  2. expandScopePatterns was added to the publish pipeline so scope patterns in provenance
     records are expanded to real file lists in published manifest artifacts.
constraints:
  - |
    Promote [Unreleased] in CHANGELOG.md to [3.11.4] - 2026-05-28 with entries for
    both fixes; add a fresh empty [Unreleased] section above it.
  - |
    make bump-version NEW=3.11.4 handles VERSION, docs/index.html, docs/linespec.html,
    docs/docs.html, docs/provenance.html, README.md, LINESPEC.md.
  - |
    Run linespec provenance compile to rebuild the hash manifest.
