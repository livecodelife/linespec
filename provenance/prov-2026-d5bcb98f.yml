id: prov-2026-d5bcb98f
title: Combined open transition with implementation due to strict spec enforcement
status: draft
created_at: "2026-05-08"
author: calebcowen@gmail.com
intent: >
  The workflow calls for a standalone open-transition commit, but strict
  enforcement requires associated_specs paths to exist on disk before the
  linter will pass. Attempting to commit the open record alone (with
  associated_specs set) failed with "proof artifact does not exist". The
  resolution was to create the implementation files first, then commit the
  provenance record update and the new source files together as one commit.
  The open-record commit therefore also includes the initial implementation,
  which is a forced deviation from the ideal standalone-transition workflow.
constraints:
  - The combined commit still carries the [prov-2026-d7f475dd] tag.
  - This pattern should be documented as the expected flow when strict
    enforcement is active and proof artifacts must be created alongside the record.
affected_scope:
