intent: >
  The run_command in prov-2026-2155a00e used a comma to separate test function names
  in the Go test -run flag. Go test -run takes a regex, so the correct separator is |
  (alternation), not comma. Fix the command so the tests actually execute when the
  spec is run via the pre-commit hook.
