name: Index Provenance Embeddings

on:
  push:
    branches: [main]
    paths:
      - 'provenance/**.yml'
      - '.linespec/hash_manifest.json'
      - '.github/workflows/index-provenance.yml'

env:
  VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'livecodelife'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      
      - name: Build LineSpec
        run: go build -o linespec ./cmd/linespec
      
      - name: Index new provenance records
        run: |
          echo "Indexing provenance records..."
          ./linespec provenance index -c .linespec.yml 2>&1 || true
      
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: linespec
      
      - name: Commit and push updated embeddings
        env:
          # The linespec-merge-bot App is a bypass actor on the "Main branch merges"
          # ruleset, so it can push embeddings.bin straight to main — no PR or review.
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ ! -f .linespec/embeddings.bin ]; then
            echo "⚠️ embeddings.bin does not exist, nothing to commit"
            exit 0
          fi

          # No change vs HEAD (staged or unstaged) → nothing to do, no empty commit.
          if git diff --quiet HEAD -- .linespec/embeddings.bin; then
            echo "✓ No changes to embeddings.bin"
            exit 0
          fi

          echo "Committing updated embeddings.bin directly to main..."
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "linespec-merge-bot"
          git add .linespec/embeddings.bin
          # [skip ci] avoids re-triggering CI; embeddings.bin is not in this
          # workflow's on.push.paths either, so there is no re-trigger loop.
          git commit -m "Update embeddings for newly completed provenance records [skip ci]"
          # Push to main via the App token (ruleset bypass actor). HEAD is the new
          # commit on top of the pushed SHA, so HEAD:main is a fast-forward.
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "✓ Pushed updated embeddings.bin to main"

      - name: Check for unindexed records
        run: |
          # A non-zero dry-run (e.g. Voyage rate limits) must warn, not fail the job.
          set +e
          output=$(./linespec provenance index -c .linespec.yml --dry-run 2>&1)
          set -e
          if echo "$output" | grep -q "record(s) to index"; then
            echo "⚠️ Warning: Some records were not indexed (likely rate limits)"
            echo "$output"
          else
            echo "✓ All records indexed successfully"
          fi
