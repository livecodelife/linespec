name: Provenance Lint SARIF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Explicitly run on all PR activity including new pushes (synchronize event)
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  lint-sarif:
    name: Lint Provenance Records (SARIF)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history needed for proper provenance validation
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Pinned to a full commit SHA of github.com/livecodelife/provenance (no release tag yet).
      - name: Install provenance CLI
        run: go install github.com/livecodelife/provenance/cmd/provenance@1d7f589617cff73720500c2f5f89b8882ce29bef

      - name: Configure git for shared repo access
        run: git config --global url."https://x-access-token:${{ secrets.SHARED_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Sync shared provenance repos
        run: provenance sync

      - name: Lint provenance records and generate SARIF
        run: provenance lint --format sarif > provenance-results.sarif
        # Continue even if lint fails so we can upload the findings to Code Scanning
        continue-on-error: true

      - name: Upload provenance lint results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: provenance-results.sarif
          category: linespec-provenance
      
      - name: Check for lint failures (strict mode)
        run: |
          # Run lint again without SARIF to get a non-zero exit on errors.
          # SARIF is already uploaded above, so this step is purely the gate.
          provenance lint --enforcement strict
