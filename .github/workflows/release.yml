name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Test stable build
        run: go build -v ./cmd/linespec

      - name: Test beta build
        run: go build -tags beta -v ./cmd/linespec

  release:
    name: Release
    needs: test
    # macOS runner so darwin builds natively (host clang + SDK) while linux and
    # windows cross-compile via zig — see the CC/CXX env in .goreleaser.yml and
    # prov-2026-78af1526.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      # zig is GoReleaser's cgo cross-compiler (CC/CXX) for the linux and
      # windows targets, so the go-tree-sitter dependency (pulled in via
      # pkg/discover) builds off-host. darwin builds natively on this runner.
      # See prov-2026-78af1526.
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: latest

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
