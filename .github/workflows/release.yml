name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Test stable build
        run: go build -v ./cmd/linespec

      - name: Test beta build
        run: go build -tags beta -v ./cmd/linespec

  # The proxy image is published here rather than built on the user's machine at
  # install time: building it needs a Linux C toolchain (cgo/go-tree-sitter), a
  # running Docker daemon, and — on macOS — a linespec source checkout that a
  # Homebrew install by definition does not have (prov-2026-f57f1570).
  #
  # This runs before `release`, not after, and the release job depends on it. A
  # tag that published binaries but failed to publish the image would leave every
  # user's pinned default pointing at an image that does not exist, turning a
  # release-time failure into a failure on every subsequent `linespec test`.
  image:
    name: Publish proxy image
    needs: test
    # ubuntu, not the macos-latest runner `release` uses: that runner has no
    # Docker daemon and cannot drive buildx.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # QEMU backs the linux/arm64 leg; the image is built from source inside
      # Dockerfile.linespec's golang:1.23-alpine stage, so both arches compile
      # natively against musl with CGO_ENABLED=1.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.linespec
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/livecodelife/linespec:${{ steps.version.outputs.version }}
            ghcr.io/livecodelife/linespec:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The failure this guards is the one that silently shipped before: an
      # image whose binary cannot exec. Run the real entrypoint on each arch and
      # require the ldflag-stamped version back, not just a zero exit from the
      # build.
      - name: Verify both architectures can exec
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          for platform in linux/amd64 linux/arm64; do
            echo "--- $platform ---"
            got="$(docker run --rm --platform "$platform" \
              "ghcr.io/livecodelife/linespec:${version}" --version)"
            echo "$got"
            case "$got" in
              *"$version"*) ;;
              *) echo "::error::$platform reported '$got', expected version $version"; exit 1 ;;
            esac
          done

  release:
    name: Release
    needs: [test, image]
    # macOS runner so darwin builds natively (host clang + SDK) while linux and
    # windows cross-compile via zig — see the CC/CXX env in .goreleaser.yml and
    # prov-2026-78af1526.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      # zig is GoReleaser's cgo cross-compiler (CC/CXX) for the linux and
      # windows targets, so the go-tree-sitter dependency (pulled in via
      # pkg/discover) builds off-host. darwin builds natively on this runner.
      # See prov-2026-78af1526.
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: latest

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
