name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Runs staticcheck (hard gate), deadcode across all build configs
      # (hard gate on the intersection), and dupl (warn-only). The script
      # bootstraps the tools via `go install`. Same gate as the pre-push hook.
      - name: Run Go code-quality gate
        run: ./scripts/go-quality.sh

  provenance-lint:
    name: Provenance Lint
    runs-on: ubuntu-latest
    env:
      # The provenance CLI is pinned to a full commit SHA of github.com/livecodelife/provenance
      # (no release tag exists yet). Bump it deliberately, in its own PR.
      PROVENANCE_SHA: 42605bc8a0c7eafa585b0852a39e7bd3111030bd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install provenance CLI
        run: go install github.com/livecodelife/provenance/cmd/provenance@${{ env.PROVENANCE_SHA }}

      - name: Configure git for shared repo access
        if: env.SHARED_REPO_TOKEN != ''
        run: git config --global url."https://x-access-token:${{ secrets.SHARED_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          SHARED_REPO_TOKEN: ${{ secrets.SHARED_REPO_TOKEN }}

      - name: Sync shared provenance repos
        if: env.SHARED_REPO_TOKEN != ''
        run: provenance sync
        continue-on-error: true
        env:
          SHARED_REPO_TOKEN: ${{ secrets.SHARED_REPO_TOKEN }}

      - name: Lint provenance records
        run: provenance lint --enforcement strict

      - name: Stale pins
        run: provenance stale

      # Every commit on the PR must stay inside the scope of the record it is tagged with.
      - name: Check commits against their records
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: provenance check --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  example-tests:
    name: Example LineSpec Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build LineSpec
        run: go build -o linespec ./cmd/linespec

      - name: Build LineSpec Docker image
        run: docker build -f Dockerfile.linespec -t linespec:latest .

      - name: Build user-service image
        run: docker build -t user-service:latest examples/user-service/

      # Every suite run migrates every discovered service, so all example app
      # images must exist before the first suite starts.
      - name: Build todo-api image
        run: docker build -t todo-api:latest examples/todo-api/

      - name: Build order-service image
        run: docker build -t order-service:latest examples/order-service/

      - name: Build order-events-service image
        run: docker build -t order-events-service:latest examples/multi-db-service/

      - name: Test user-linespecs
        run: ./linespec test examples/user-linespecs/

      - name: Test todo-linespecs
        run: ./linespec test examples/todo-linespecs/

      - name: Test order-linespecs
        run: ./linespec test examples/order-linespecs/

      - name: Test multi-db-linespecs
        run: ./linespec test examples/multi-db-linespecs/
