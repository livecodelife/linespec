name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Runs staticcheck (hard gate), deadcode across all build configs
      # (hard gate on the intersection), and dupl (warn-only). The script
      # bootstraps the tools via `go install`. Same gate as the pre-push hook.
      - name: Run Go code-quality gate
        run: ./scripts/go-quality.sh

  provenance-lint:
    name: Provenance Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build LineSpec
        run: go build -o linespec ./cmd/linespec

      - name: Configure git for shared repo access
        if: env.SHARED_REPO_TOKEN != ''
        run: git config --global url."https://x-access-token:${{ secrets.SHARED_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          SHARED_REPO_TOKEN: ${{ secrets.SHARED_REPO_TOKEN }}

      - name: Sync shared provenance repos
        if: env.SHARED_REPO_TOKEN != ''
        run: ./linespec provenance sync
        continue-on-error: true
        env:
          SHARED_REPO_TOKEN: ${{ secrets.SHARED_REPO_TOKEN }}

      - name: Lint provenance records
        run: ./linespec provenance lint -c .linespec.yml --enforcement strict

  example-tests:
    name: Example LineSpec Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build LineSpec
        run: go build -o linespec ./cmd/linespec

      - name: Build LineSpec Docker image
        run: docker build -f Dockerfile.linespec -t linespec:latest .

      - name: Build user-service image
        run: docker build -t user-service:latest examples/user-service/

      - name: Test user-linespecs
        run: ./linespec test examples/user-linespecs/

      - name: Build todo-api image
        run: docker build -t todo-api:latest examples/todo-api/

      - name: Test todo-linespecs
        run: ./linespec test examples/todo-linespecs/

      - name: Build order-service image
        run: docker build -t order-service:latest examples/order-service/

      - name: Test order-linespecs
        run: ./linespec test examples/order-linespecs/

      - name: Build order-events-service image
        run: docker build -t order-events-service:latest examples/multi-db-service/

      - name: Test multi-db-linespecs
        run: ./linespec test examples/multi-db-linespecs/
