name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run tests
        run: go test ./...

  example-tests:
    name: Example LineSpec Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build LineSpec
        run: go build -o linespec ./cmd/linespec

      - name: Test user-linespecs
        run: ./linespec test examples/user-linespecs/

      - name: Test todo-linespecs
        run: ./linespec test examples/todo-linespecs/

      - name: Test order-linespecs
        run: ./linespec test examples/order-linespecs/

      - name: Test multi-db-linespecs
        run: ./linespec test examples/multi-db-linespecs/
