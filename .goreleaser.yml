# GoReleaser configuration for LineSpec
# See: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

# Stable builds (provenance only)
builds:
  - id: linespec-stable
    main: ./cmd/linespec
    binary: linespec
    # cgo is required: pkg/discover pulls in go-tree-sitter (a cgo package), so
    # the binary no longer builds pure-Go. This job runs on a macOS runner, so
    # darwin builds natively via clang (macOS SDK provides libresolv + the
    # CoreFoundation/Security frameworks that crypto/x509 links); linux and
    # windows cross-compile with `zig cc`/`zig c++` (tree-sitter is pure C).
    env:
      - CGO_ENABLED=1
      - '{{ if eq .Os "linux" }}{{ if eq .Arch "amd64" }}CC=zig cc -target x86_64-linux-gnu{{ else }}CC=zig cc -target aarch64-linux-gnu{{ end }}{{ else if eq .Os "darwin" }}CC=clang{{ else if eq .Os "windows" }}CC=zig cc -target x86_64-windows-gnu{{ end }}'
      - '{{ if eq .Os "linux" }}{{ if eq .Arch "amd64" }}CXX=zig c++ -target x86_64-linux-gnu{{ else }}CXX=zig c++ -target aarch64-linux-gnu{{ end }}{{ else if eq .Os "darwin" }}CXX=clang++{{ else if eq .Os "windows" }}CXX=zig c++ -target x86_64-windows-gnu{{ end }}'
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/livecodelife/linespec/v3/pkg/buildinfo.Version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    ignore:
      - goos: windows
        goarch: arm64
    # No build tags - this is the stable build with provenance only

  # Beta builds — identical to stable since v2.0.0; published for backward compat
  - id: linespec-beta
    main: ./cmd/linespec
    binary: linespec
    # cgo is required: pkg/discover pulls in go-tree-sitter (a cgo package), so
    # the binary no longer builds pure-Go. This job runs on a macOS runner, so
    # darwin builds natively via clang (macOS SDK provides libresolv + the
    # CoreFoundation/Security frameworks that crypto/x509 links); linux and
    # windows cross-compile with `zig cc`/`zig c++` (tree-sitter is pure C).
    env:
      - CGO_ENABLED=1
      - '{{ if eq .Os "linux" }}{{ if eq .Arch "amd64" }}CC=zig cc -target x86_64-linux-gnu{{ else }}CC=zig cc -target aarch64-linux-gnu{{ end }}{{ else if eq .Os "darwin" }}CC=clang{{ else if eq .Os "windows" }}CC=zig cc -target x86_64-windows-gnu{{ end }}'
      - '{{ if eq .Os "linux" }}{{ if eq .Arch "amd64" }}CXX=zig c++ -target x86_64-linux-gnu{{ else }}CXX=zig c++ -target aarch64-linux-gnu{{ end }}{{ else if eq .Os "darwin" }}CXX=clang++{{ else if eq .Os "windows" }}CXX=zig c++ -target x86_64-windows-gnu{{ end }}'
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/livecodelife/linespec/v3/pkg/buildinfo.Version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    ignore:
      - goos: windows
        goarch: arm64

# Archive configurations
archives:
  - id: linespec-stable
    builds:
      - linespec-stable
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - PROVENANCE_RECORDS.md

  - id: linespec-beta
    builds:
      - linespec-beta
    name_template: >-
      {{ .ProjectName }}-beta_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - PROVENANCE_RECORDS.md
      - LINESPEC.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^style:'
      - '^refactor:'
      - Merge pull request
      - Merge branch

# GitHub Release configuration
release:
  github:
    owner: livecodelife
    name: linespec
  
  # If the tag contains 'beta', mark as prerelease
  prerelease: auto
  
  # Release notes template
  header: |
    ## LineSpec {{ .Version }}
    
    ### Quick Install
    
    **Homebrew:**
    ```bash
    brew tap livecodelife/linespec
    brew install linespec{{ if .Prerelease }}-beta{{ end }}
    ```
    
    **Go Install:**
    ```bash
    go install github.com/livecodelife/linespec/cmd/linespec@{{ .Version }}
    ```
    
  
  footer: |
    ### Documentation

    - [PROVENANCE_RECORDS.md](./PROVENANCE_RECORDS.md) - Complete provenance reference
    - [LINESPEC.md](./LINESPEC.md) - Integration testing reference
    - [README.md](./README.md) - Installation and quick start
    
    ### Full Changelog
    
    See [CHANGELOG.md](./CHANGELOG.md) for full details.

# Publish to Homebrew tap
brews:
  # Stable formula
  - name: linespec
    repository:
      owner: livecodelife
      name: homebrew-linespec
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    url_template: "https://github.com/livecodelife/linespec/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/livecodelife/linespec"
    description: "LineSpec - Provenance Records and Integration Testing"
    license: "MIT"
    test: |
      system "#{bin}/linespec", "provenance", "--help"
    install: |
      bin.install "linespec"
    # No post_install hook. It used to run `linespec build` to produce the proxy
    # image locally, which could not work from a Cellar install: on macOS the
    # build needs a source checkout the formula does not have, and on Linux it
    # staged a glibc-linked binary into an Alpine base, yielding an image that
    # could not exec. The image is published by release CI instead and pulled on
    # first use (prov-2026-f57f1570).
    caveats: |
      Protocol proxy sidecars run ghcr.io/livecodelife/linespec, pulled
      automatically the first time you run `linespec test`. Set
      infrastructure.proxy_image in .linespec.yml to use a different registry.
    # Only publish stable builds to the main formula
    ids:
      - linespec-stable
    skip_upload: auto

  # Beta formula
  - name: linespec-beta
    repository:
      owner: livecodelife
      name: homebrew-linespec
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    url_template: "https://github.com/livecodelife/linespec/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }}-beta version {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/livecodelife/linespec"
    description: "LineSpec - backward-compatible alias for the linespec formula (same binary since v2.0.0)"
    license: "MIT"
    test: |
      system "#{bin}/linespec", "provenance", "--help"
    install: |
      bin.install "linespec" => "linespec-beta"
    # Only publish beta builds to the beta formula
    # Explicit string "false" — GoReleaser's SkipUpload is a string type; only "true" and "auto" trigger skips
    ids:
      - linespec-beta
    skip_upload: "false"

# Disable other artifact types for now
nfpms: []
